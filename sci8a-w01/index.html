<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFCF6">
<title>學習教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 繪本風（和紙白、3px 墨灰框、珊瑚粉／山吹黃／水色／若竹綠平塗、Huninn 粉圓）。只用淺色底，不做深色模式。 */
:root{--ink:#3E3A39;--paper:#FFFCF6;--coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--green:#B9DAA5;
 --coral-soft:#FCE7E2;--yellow-soft:#FDF3D6;--mizu-soft:#E2F1F7;--green-soft:#E8F3E0;
 --bg-2:#F5EEE2;--muted:#7C7571;--line:#E8DFD2;--accent-text:#B65544;--bw:3px;--r:24px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 "Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
h1,h2,h3,h4,b,strong,th{font-weight:400}
button{font-family:inherit}
/* ---- 頂部 ---- */
header{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:10px 16px 4px}
.logo{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:21px;line-height:1}
.top h1{margin:0;font-size:19px;line-height:1.5;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{flex:none;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:8px;max-width:880px;margin:0 auto;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
nav button.on{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
main{max-width:880px;margin:0 auto;padding:18px 16px 48px}
section{display:none}section.on{display:block;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.97);opacity:0}60%{transform:scale(1.008);opacity:1}100%{transform:scale(1)}}
/* ---- 插圖 ---- */
.art{display:block;width:72px;height:72px;flex:none}
.art.sm{width:40px;height:40px}.art.md{width:54px;height:54px}.art.lg{width:104px;height:104px}
.stamp{display:grid;place-items:center;background:#fff;border:var(--bw) solid var(--ink);border-radius:50%}
.float{animation:float 3.4s ease-in-out infinite;transform-origin:50% 90%}
.float.d2{animation-delay:-1.2s}.float.d3{animation-delay:-2.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
/* ---- 首頁橫幅 ---- */
.hero{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border:var(--bw) solid var(--ink);border-radius:28px;padding:16px 18px;margin:0 0 18px}
.hero .txt{flex:1;min-width:0}
.hero h2{font-size:25px;line-height:1.4;margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:13.5px;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.chip.y{background:var(--yellow)}.chip.c{background:var(--coral)}
.pics{flex:none;position:relative;width:140px;height:124px}
.pics .stamp{position:absolute;right:4px;bottom:0;width:104px;height:104px}
.pics .stamp .art{width:80px;height:80px}
.pics .s1{position:absolute;left:0;top:0}.pics .s2{position:absolute;right:-6px;top:-10px}
/* ---- 卡片與文字 ---- */
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px 20px;margin:0 0 18px}
h2{font-size:23px;line-height:1.45;margin:0 0 8px}
h3{font-size:19px;line-height:1.5;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
h3:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
b{box-shadow:inset 0 -.42em 0 var(--yellow);padding:0 2px}/* 用 box-shadow 畫螢光筆：透明漸層在 PDF 會多一條黑線 */
.card ul,.card ol{padding-left:1.4em}li::marker{color:var(--accent-text)}
.guide{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px}
.who{flex:none;width:60px;text-align:center}
.ava{width:58px;height:58px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:30px;line-height:1;animation:float 3.4s ease-in-out infinite}
.who small{display:block;font-size:12px;line-height:1.3;margin-top:4px;color:var(--muted)}
.bubble{background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;position:relative;min-width:0;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:19px;width:14px;height:14px;background:#fff;border-left:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);transform:rotate(45deg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.tile{border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 14px;background:var(--coral-soft)}
.tile:nth-child(4n+2){background:var(--mizu-soft)}.tile:nth-child(4n+3){background:var(--yellow-soft)}.tile:nth-child(4n){background:var(--green-soft)}
.tile .em{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:25px;line-height:1;margin-bottom:6px}
.tile .em:empty{display:none}
.tile h4{margin:0 0 2px;font-size:18px;line-height:1.5}.tile p{margin:0;font-size:15.5px}
.chant{background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0 18px;font-size:19px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.chant small{display:block;font-size:14.5px;opacity:.85}
.chant b{box-shadow:inset 0 -.42em 0 #fff}
.trap{background:var(--coral-soft);border:var(--bw) dashed var(--ink);border-radius:18px;padding:10px 14px;margin:12px 0;font-size:15.5px}
.trap:before{content:"⚠️ 陷阱題注意";display:inline-block;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin:0 8px 4px 0;font-size:14px;line-height:1.7}
.lab{background:var(--mizu-soft);border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;margin:12px 0}
.lab h4{margin:2px 0 4px;font-size:18px}
.fig{max-width:580px;margin:10px auto;background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden}
.fig svg{width:100%;height:auto;display:block}
main svg:not(.art){max-width:100%;height:auto}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.vs>div{border:var(--bw) solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15.5px;background:var(--coral-soft)}
.vs>div:nth-child(2n){background:var(--mizu-soft)}
.vs h4{margin:0 0 4px;font-size:18px;line-height:1.5}
.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden}
th,td{padding:7px 10px;vertical-align:top;text-align:left;border-bottom:2px solid var(--line)}
th{background:var(--yellow-soft);border-bottom:2px solid var(--ink)}
td+td,th+th{border-left:2px solid var(--line)}
tr:last-child td{border-bottom:0}
.tl{position:relative;padding-left:32px;margin:10px 0}
.tl:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.tl div{position:relative;margin:0 0 12px}
.tl div:before{content:"";position:absolute;left:-31px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink)}
.tl span{display:inline-block;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin-right:6px;font-size:15px}
.vid{width:100%;display:block;background:var(--ink);border:var(--bw) solid var(--ink);border-radius:20px}
.pic{max-width:100%;border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 記憶卡 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.flip{perspective:900px;height:140px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .k{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--ink);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;overflow:auto}
.flip .f{background:var(--mizu);font-size:19px}
.flip:nth-child(4n+2) .f{background:var(--coral)}.flip:nth-child(4n+3) .f{background:var(--green)}.flip:nth-child(4n) .f{background:var(--yellow)}
.flip .k{background:#fff;font-size:15.5px;transform:rotateY(180deg)}
/* ---- 闖關 ---- */
.qbox{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px;margin-bottom:14px}
.prog{height:16px;background:var(--bg-2);border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink);transition:width .4s}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted)}
.stem{font-size:19px;white-space:pre-line;margin:8px 0}
.src{background:var(--mizu-soft);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;margin:10px 0;font-size:16px}
.opt{display:block;width:100%;text-align:left;font-size:17px;line-height:1.6;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:10px 16px;margin:10px 0;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.ok{background:var(--green)}
.opt.bad{background:var(--coral);animation:shake .3s}
.opt.pick{background:var(--yellow-soft);box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--ink)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-top:10px;font-size:16px}
.fb.ok{display:block;background:var(--green-soft)}.fb.bad{display:block;background:var(--coral-soft)}
.btn{display:inline-block;font-size:16px;line-height:1.5;border:var(--bw) solid var(--ink);background:var(--coral);color:var(--ink);border-radius:16px;padding:8px 20px;margin-top:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--mizu)}
.say{font-size:14px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:middle;cursor:pointer}
.combo{background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 10px;color:var(--ink)}
.combo:empty{display:none}
.rank{text-align:center;padding:6px 4px}
.rank .deco{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.rank .big{width:116px;height:116px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:58px;line-height:1}
.empty{text-align:center}.empty .art{margin:4px auto 0}
.lvl{border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:2px 0 10px;background:var(--yellow-soft)}
.lvl b{display:block;font-size:18px;box-shadow:none;padding:0}.lvl small{display:block;font-size:14.5px;color:var(--muted);line-height:1.5}
.lv-g{background:var(--green-soft)}.lv-m{background:var(--mizu-soft)}.lv-c{background:var(--coral-soft)}
.lvsum{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0}
.lvchip{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px}
.src svg{display:block;width:100%;max-width:520px;margin:4px auto}
.order{padding:0;margin:8px 0}
.order li{list-style:none;display:flex;align-items:center;border:var(--bw) solid var(--ink);background:#fff;border-radius:16px;padding:8px 14px;margin:10px 0;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.order li.pick{background:var(--yellow-soft);box-shadow:0 0 0 var(--ink);transform:translateY(3px)}
.order li .n{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;margin-right:10px;font-size:15px;line-height:1}
.order li.pick .n{background:var(--yellow)}
.tag{display:inline-block;font-size:13px;line-height:1.6;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
.srcs{font-size:13px;color:var(--muted);margin-top:8px}.srcs a{color:var(--accent-text)}
#boom{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;width:max-content;max-width:calc(100% - 32px);background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-size:16px}
/* ---- 作答區塊 ---- */
.how{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin:10px 0 8px;font-size:15px}
.ask,.fill,.wbox,.tbox,.sub{background:var(--paper);border:var(--bw) dashed var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0}
.fill .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fill .row .btn{margin-top:0}
.fill input,.tbox textarea{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);outline:0}
.fill input:focus,.tbox textarea:focus{box-shadow:0 0 0 3px var(--yellow)}
.fill input{width:9em}.tbox textarea{width:100%;min-height:80px;resize:vertical}
.wcan{width:100%;height:300px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;touch-action:none;display:block}
.wtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.wtools .btn{margin-top:0}
.wphoto,.subimg{max-width:100%;border:var(--bw) solid var(--ink);border-radius:16px;margin-top:10px;display:none}
.reveal{background:var(--green-soft);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:12px 0}
@media (max-width:520px){
 body{font-size:16.5px}.card{padding:16px}.qbox{padding:16px}
 .hero{padding:14px}.hero h2{font-size:21px}
 .pics{width:96px;height:100px}.pics .stamp{width:84px;height:84px;right:0}.pics .stamp .art{width:62px;height:62px}
 .pics .s1{width:34px;height:34px}.pics .s2{display:none}
}
@media (prefers-reduced-motion:reduce){
 section.on,.float,.ava,.opt.bad{animation:none}
 .flip .in,.btn,.opt,.order li,.prog i{transition:none}
}
/* ---- 列印（PDF） ---- */
.print body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print header{position:static}.print nav,.print .xp{display:none}
.print .top h1{white-space:normal}
.print section{display:block;animation:none}
.print .float,.print .ava{animation:none}
.print .card{break-inside:auto}
.print .qbox,.print .tile,.print .fig,.print .chant,.print .trap,.print .vs,.print table,.print .hero{break-inside:avoid}
.print .chant,.print .btn,.print .opt{box-shadow:none}
.print .pbreak{break-before:page}
.print .cards{grid-template-columns:1fr 1fr}
.print .fc{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:15px}
.print .wcan,.print .wtools,.print .sub{display:none}.print .wprint{height:220px;border:2px solid var(--ink);border-radius:12px;background:#fff}
@page{size:A4;margin:12mm}
</style>
</head>
<body>
<canvas id="boom"></canvas>
<header><div class="top"><span class="logo" id="logo">📚</span><h1 id="ttl"></h1><span class="xp" id="xp">⭐ 0</span></div><nav id="nav"></nav></header>
<main id="main"></main>
<script>
// 繪本風插圖（原創 SVG）：墨灰 3px 線框＋四色平塗，不用漸層。
// 網頁範本（renderPage 會把整份檔案嵌進 page.html）與首頁目錄（node require）共用這一份。
const INK = "#3E3A39", CORAL = "#F2A497", YELLOW = "#F6D27A", MIZU = "#A8D3E6", GREEN = "#B9DAA5", PAPER = "#FFFCF6";
const SK = `stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
const FACE = (x, y) => `<circle cx="${x - 6}" cy="${y}" r="2.8" fill="${INK}"/><circle cx="${x + 6}" cy="${y}" r="2.8" fill="${INK}"/><path d="M${x - 4} ${y + 7}c2.5 2.5 5.5 2.5 8 0" ${SK} fill="none"/>`;

const ART = {
  book: `<g ${SK}>
    <path d="M50 30c-8-6-20-6-30-2v50c10-4 22-4 30 2z" fill="${YELLOW}"/>
    <path d="M50 30c8-6 20-6 30-2v50c-10-4-22-4-30 2z" fill="${MIZU}"/>
    <path d="M28 42h14M28 52h14M58 42h14M58 52h14" fill="none"/></g>`,
  star: `<g ${SK}><path d="M50 18l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z" fill="${YELLOW}"/></g>${FACE(50, 47)}`,
  cloud: `<path d="M24 70c-8 0-12-6-10-12 2-6 8-8 13-6 1-10 10-16 20-14 7 1 12 7 13 13 7-2 14 3 14 10 0 5-4 9-10 9z" fill="#fff" ${SK}/>`,
  sun: `<g ${SK}><circle cx="50" cy="50" r="18" fill="${YELLOW}"/>
    <path d="M50 18v-8M50 90v-8M18 50h-8M90 50h-8M27 27l-6-6M79 79l-6-6M27 73l-6 6M79 21l-6 6" fill="none"/></g>`,
  // 理化／自然：錐形瓶
  flask: `<g ${SK}>
    <path d="M43 18v22L24 76c-3 6 1 12 8 12h36c7 0 11-6 8-12L57 40V18z" fill="#fff"/>
    <path d="M32.4 60h35.2L76 76c3 6-1 12-8 12H32c-7 0-11-6-8-12z" fill="${MIZU}"/>
    <path d="M38 18h24" fill="none"/>
    <circle cx="47" cy="50" r="3" fill="#fff"/><circle cx="54" cy="42" r="2.2" fill="#fff"/></g>${FACE(50, 72)}`,
  // 歷史／社會：卷軸
  scroll: `<g ${SK}>
    <rect x="24" y="27" width="52" height="50" fill="${PAPER}"/>
    <path d="M32 40h36M32 50h28M32 60h32" fill="none"/>
    <rect x="18" y="22" width="64" height="10" rx="5" fill="${CORAL}"/>
    <rect x="18" y="72" width="64" height="10" rx="5" fill="${CORAL}"/>
    <circle cx="15" cy="27" r="5" fill="${YELLOW}"/><circle cx="85" cy="27" r="5" fill="${YELLOW}"/>
    <circle cx="15" cy="77" r="5" fill="${YELLOW}"/><circle cx="85" cy="77" r="5" fill="${YELLOW}"/></g>`,
  // 地理：地球儀
  globe: `<g ${SK}>
    <circle cx="50" cy="44" r="25" fill="${MIZU}"/>
    <path d="M34 36c4-6 14-6 16 0s-4 10-10 10-10-4-6-10z" fill="${GREEN}"/>
    <path d="M55 50c4-4 12-2 12 4s-6 10-12 8-4-8 0-12z" fill="${GREEN}"/>
    <path d="M22 50a29 29 0 0 0 50 16M50 73v11M38 86h24" fill="none"/></g>`,
  // 數學：三角尺
  ruler: `<g ${SK}>
    <path d="M20 84V20l64 64z" fill="${MIZU}"/>
    <path d="M31 72V48l24 24z" fill="${PAPER}"/>
    <path d="M20 32h7M20 42h5M20 52h7M20 62h5M20 72h7" fill="none"/></g>`,
  // 英文：字母積木
  blocks: `<g ${SK}>
    <rect x="16" y="52" width="32" height="32" rx="6" fill="${CORAL}"/>
    <rect x="52" y="52" width="32" height="32" rx="6" fill="${MIZU}"/>

em":"🔈","h":"喇叭上的米粒","p":"喇叭放音樂時，上面的米粒會跳起來。"},{"em":"🎸","h":"吉他弦","p":"撥弦會看到弦在抖；用手按住弦，聲音馬上停。"}]},{"t":"chant","v":"沒有振動，就沒有聲音"}]},{"h":"🚀 聲音需要介質","body":["把響著的鬧鐘放進玻璃罩，用幫浦慢慢<b>抽出空氣<\/b>：鈴聲越來越小，最後幾乎聽不到；把空氣放回去，聲音又回來了。",{"t":"tiles","v":[{"em":"🌫️","h":"空氣","p":"最常見的介質，聲音靠空氣分子一個推一個傳過來。"},{"em":"🕳️","h":"真空","p":"沒有介質，聲音<b>無法傳播<\/b>。"},{"em":"🧑‍🚀","h":"太空人怎麼聊天？","p":"靠無線電（電磁波），電磁波不需要介質。"}]},{"t":"reveal","ref":"g1","v":"太空接近真空，<b>聽不到爆炸聲<\/b>。電影是為了好看才加的音效！"}]},{"h":"🏃 聲音跑多快？","body":[{"t":"svg","v":"<svg viewBox=\"0 0 440 236\" role=\"img\" aria-label=\"不同介質中的聲速比較\"><rect x=\"0\" y=\"0\" width=\"440\" height=\"236\" rx=\"14\" fill=\"#fbf7ee\"/><text x=\"220\" y=\"24\" font-size=\"15\" font-weight=\"700\" fill=\"#1f6f8b\" text-anchor=\"middle\">聲音每秒跑幾公尺？（約略值）<\/text><text x=\"92\" y=\"63\" font-size=\"14\"  fill=\"#2b2b2b\" text-anchor=\"end\">0°C 空氣<\/text><rect x=\"100\" y=\"48\" width=\"13.629411764705882\" height=\"22\" rx=\"5\" fill=\"#9fd3e6\"/><text x=\"121.62941176470588\" y=\"64\" font-size=\"13\" font-weight=\"700\" fill=\"#2b2b2b\" text-anchor=\"start\">約 331<\/text><text x=\"92\" y=\"103\" font-size=\"14\"  fill=\"#2b2b2b\" text-anchor=\"end\">30°C 空氣<\/text><rect x=\"100\" y=\"88\" width=\"14.370588235294118\" height=\"22\" rx=\"5\" fill=\"#7cc0d8\"/><text x=\"122.37058823529412\" y=\"104\" font-size=\"13\" font-weight=\"700\" fill=\"#2b2b2b\" text-anchor=\"start\">約 349<\/text><text x=\"92\" y=\"143\" font-size=\"14\"  fill=\"#2b2b2b\" text-anchor=\"end\">水<\/text><rect x=\"100\" y=\"128\" width=\"61.76470588235294\" height=\"22\" rx=\"5\" fill=\"#5aa3c4\"/><text x=\"169.76470588235293\" y=\"144\" font-size=\"13\" font-weight=\"700\" fill=\"#2b2b2b\" text-anchor=\"start\">約 1500<\/text><text x=\"92\" y=\"183\" font-size=\"14\"  fill=\"#2b2b2b\" text-anchor=\"end\">鋼鐵<\/text><rect x=\"100\" y=\"168\" width=\"210\" height=\"22\" rx=\"5\" fill=\"#d9622b\"/><text x=\"318\" y=\"184\" font-size=\"13\" font-weight=\"700\" fill=\"#2b2b2b\" text-anchor=\"start\">約 5000 以上<\/text><text x=\"220\" y=\"222\" font-size=\"13\" font-weight=\"700\" fill=\"#2b2b2b\" text-anchor=\"middle\">一般：固體 ＞ 液體 ＞ 氣體；氣溫越高，空氣中越快<\/text><\/svg>"},{"t":"tiles","v":[{"em":"🏊","h":"游泳池","p":"在水底敲東西，聲音又快又清楚。"},{"em":"🚂","h":"古早的鐵軌","p":"耳朵貼鐵軌，比空氣更早聽到火車來。"},{"em":"🌡️","h":"夏天和冬天","p":"氣溫越高，空氣中的聲速越快。"}]},{"t":"chant","v":"固液氣，由快到慢；天越熱，空氣中跑越快","sub":"補充：空氣中聲速約 331 ＋ 0.6 × 氣溫（°C），30°C 時約 349 m/s"}]},{"h":"⚡ 數秒算打雷距離","body":[{"t":"svg","v":"<svg viewBox=\"0 0 440 194\" role=\"img\" aria-label=\"用秒數估算打雷距離\"><rect x=\"0\" y=\"0\" width=\"440\" height=\"194\" rx=\"14\" fill=\"#fbf7ee\"/><text x=\"50\" y=\"70\" font-size=\"40\"  fill=\"#2b2b2b\" text-anchor=\"middle\">⚡<\/text><text x=\"50\" y=\"100\" font-size=\"13\"  fill=\"#2b2b2b\" text-anchor=\"middle\">打雷處<\/text><text x=\"390\" y=\"76\" font-size=\"36\"  fill=\"#2b2b2b\" text-anchor=\"middle\">🧍<\/text><text x=\"390\" y=\"100\" font-size=\"13\"  fill=\"#2b2b2b\" text-anchor=\"middle\">你<\/text><path d=\"M120 40 Q140 65 120 90\" fill=\"none\" stroke=\"#1f6f8b\" stroke-width=\"3\"/><path d=\"M190 40 Q210 65 190 90\" fill=\"none\" stroke=\"#1f6f8b\" stroke-width=\"3\"/><path d=\"M260 40 Q280 65 260 90\" fill=\"none\" stroke=\"#1f6f8b\" stroke-width=\"3\"/><text x=\"220\" y=\"124\" font-size=\"13\"  fill=\"#2b2b2b\" text-anchor=\"middle\">閃電（光）幾乎瞬間到；雷聲（聲音）每秒走約 340 m<\/text><text x=\"220\" y=\"152\" font-size=\"14\"  fill=\"#2b2b2b\" text-anchor=\"middle\">看到閃電後數 3 秒才聽到雷聲：<\/text><text x=\"220\" y=\"178\" font-size=\"17\" font-weight=\"700\" fill=\"#d9622b\" text-anchor=\"middle\">340 m/s × 3 s ＝ 1020 m ≈ 1 公里<\/text><\/svg>"},{"t":"reveal","ref":"g2","v":"閃電和雷聲<b>同時發生<\/b>，只是光每秒跑 30 萬公里，聲音每秒才 340 公尺，所以光先到。"},{"t":"trap","v":"不是「閃電先發生」！是<b>光比聲音快<\/b>。"}]}]},{"id":"s1","nav":"📘一 補底","intro":"週一的 30 分鐘：第一次段考卡住的地方，我們換個方式再走一次。測量是理化的<b>地基<\/b>：密度、濃度、聲速都要先量得準、換得對。","cards":[{"h":"🎬 動畫課第 4 集","body":[{"t":"video","v":"w01-ep4.mp4?v=1025h","poster":"w01-ep4.jpg","cap":"尺上的秘密：最小刻度、估計值、誤差。"}]},{"h":"🎬 動畫課第 5 集","body":[{"t /text><text x=\"345\" y=\"30\" font-size=\"13\"  fill=\"#2b2b2b\" text-anchor=\"middle\">mL<\/text><text x=\"28\" y=\"66\" font-size=\"20\"  fill=\"#2b2b2b\" text-anchor=\"middle\">👁️<\/text><line x1=\"44\" y1=\"60\" x2=\"240\" y2=\"110\" stroke=\"#d9622b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"46\" y=\"50\" font-size=\"13\" font-weight=\"700\" fill=\"#d9622b\" text-anchor=\"start\">俯視（太高）→ 讀太大<\/text><text x=\"28\" y=\"116\" font-size=\"20\"  fill=\"#2b2b2b\" text-anchor=\"middle\">👁️<\/text><line x1=\"44\" y1=\"110\" x2=\"240\" y2=\"110\" stroke=\"#2f8f5a\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"46\" y=\"100\" font-size=\"13\" font-weight=\"700\" fill=\"#2f8f5a\" text-anchor=\"start\">平視 → 50.0 mL ✓<\/text><text x=\"28\" y=\"166\" font-size=\"20\"  fill=\"#2b2b2b\" text-anchor=\"middle\">👁️<\/text><line x1=\"44\" y1=\"160\" x2=\"240\" y2=\"110\" stroke=\"#d9622b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"46\" y=\"182\" font-size=\"13\" font-weight=\"700\" fill=\"#d9622b\" text-anchor=\"start\">仰視（太低）→ 讀太小<\/text><text x=\"240\" y=\"212\" font-size=\"14\" font-weight=\"700\" fill=\"#1f6f8b\" text-anchor=\"middle\">看凹液面「最低處」<\/text><\/svg>"},{"t":"chant","v":"俯視偏大，仰視偏小，平視最準"},{"t":"h3","v":"形狀奇怪的石頭怎麼量體積？用「排水法」"},{"t":"tiles","v":[{"em":"1️⃣","h":"先讀水位","p":"量筒裝適量的水，平視讀出 V₁，例如 50.0 mL。"},{"em":"2️⃣","h":"放入石頭","p":"用細線綁住，慢慢放進去，讀出 V₂，例如 58.0 mL。"},{"em":"3️⃣","h":"相減","p":"石頭體積 ＝ V₂ − V₁ ＝ 8.0 mL ＝ <b>8.0 cm³<\/b>"}]}]},{"h":"⚖️ 質量不會因為搬家而改變","body":[{"t":"vs","v":[{"h":"質量（kg、g）","p":"物體含有多少物質。<br>帶到月球還是一樣多。<br>用天平、電子秤量。"},{"h":"重量（受到的重力）","p":"地球把你往下拉的力。<br>到月球只剩大約 1/6。<br>用彈簧秤量。"}]},{"t":"trap","v":"電子秤放上燒杯後要先按<b>歸零（扣皮重）<\/b>，量到的才是裡面東西的質量。"}]},{"h":"🔍 找錯誤：幫小明訂正","body":[{"t":"how","v":"先用手遮住右邊「學姊改正」，自己想想左邊三個哪裡錯，再拿開手對答案。"},{"t":"vs","v":[{"h":"小明寫的","p":"① 鉛筆長 12.5<br>② 量筒（最小刻度 1 mL）讀數 46 mL<br>③ 3 L ＝ 300 mL"},{"h":"學姊改正","p":"① 少了單位 → <b>12.5 cm<\/b>（還要多估一位）<br>② 要多估一位 → <b>46.0 mL<\/b><br>③ ×1000 → <b>3000 mL<\/b>"}]}]}]},{"id":"s4","nav":"🧪三 練習","intro":"週三的 30 分鐘：先做實驗（8 分），再去上方「⚔️ 闖關」答 24 題、把錯題本清空（15～20 分，做不完下次接著做），最後手寫 2 題、講出場券（7 分）。","cards":[{"h":"🔔 湯匙變教堂鐘","body":[{"t":"lab","h":"實驗 1：固體傳聲比空氣好","steps":["拿一條約 1 公尺的棉線，中間綁一支金屬湯匙。","線的兩端各纏在左右手的食指上。","把食指輕輕塞進耳朵（不要太用力）。","彎腰讓湯匙碰一下桌角，仔細聽。","把手指拿出耳朵，再碰一次，比較兩次的聲音。"],"think":"為什麼手指塞進耳朵時，聲音像「噹～」的大鐘？聲音這次走的是什麼介質？"},{"t":"text","id":"x0","q":"做完實驗，你聽到的聲音有什麼不一樣？為什麼？","how":"做完實驗再打，一兩句就好"}]},{"h":"📱 量手機大賽","body":[{"t":"lab","h":"實驗 2：估計值會不一樣","steps":["用直尺量手機長度，記到最小刻度的下一位（例如 14.73 cm）。","請爸爸和妹妹也各量一次，不要偷看別人的答案。","把三個人的數字寫成一排，圈出不一樣的位數。","算三個數字的平均。"],"think":"三個人哪一位數字最容易不一樣？誰才是「對的」？為什麼要取平均？"},{"t":"text","id":"x5","q":"三個人量到的數字是多少？平均是多少？","how":"例如：14.73、14.75、14.74，平均 14.74 cm"}]},{"h":"⚔️ 接著去闖關（約 15 分鐘）","body":[{"t":"how","v":"點最上面一排的「⚔️ 闖關」，答完 24 題（🌱 看懂 → 📘 課本 → 🔥 段考挑戰，越後面越難）；答錯的到「📕 錯題」重做到全對。做完再回到這一站，繼續下面的手寫題和出場券。"}]},{"h":"✍️ 手寫 2 題（要寫出算式）","body":[{"t":"write","id":"w1","q":"① 1.2 L 的保溫瓶裝滿水，是多少 mL？多少 cm³？寫出換算過程。"},{"t":"write","id":"w2","q":"② 看到閃電後 4 秒才聽到雷聲（聲速約 340 m/s），打雷的地方大約多遠？寫出算式。"}]},{"h":"🎟️ 出場券：用自己的話說","body":[{"t":"text","id":"x1","q":"1. 為什麼真正的太空聽不到爆炸聲？"},{"t":"text","id":"x2","q":"2. 4.36 cm 的「6」是怎麼來的？"},{"t":"text","id":"x3","q":"3. 人浪裡的觀眾，有沒有跟著浪跑到別的座位？那傳出去的是什麼？"},{"t":"text","id":"x4","q":"4. 看到閃電後 5 秒才聽到雷聲，打雷的地方大約多遠？"},{"t":"guide","v":"講不出來的那一題，回去那一站再看一次動畫或卡片，再回來寫。"}]},{"h":"📤 最後一步：傳給爸爸","body":[{"t":"submit","how":"按下面的按鈕 → 選 <b>LINE<\/b> → 選爸爸 → 傳送。手機會把你這週的闖關成績、猜謎、填空、手寫和出場券整理成一張圖傳出去。"},{"t":"guide","v":"傳完這週就結束了，好好休息！下週日見 👋"}]}]}],"flash":[["最小刻度","工具上最小的一格；直尺通常是 1 mm（0.1 cm）"],["估計值","讀到最小刻度後，再用眼睛多估的最後一位"],["記錄的三件事","準確值＋一位估計值＋單位"],["1 L ＝ ? mL","1000 mL"],["1 mL ＝ ? cm³","1 cm³，兩個一樣大"],["1 m³ ＝ ? L","1000 L（100×100×100 cm³）"],["1 kg ＝ ? g","1000 g"],["排水法","放入後水位 − 放入前水位 ＝ 物體體積"],["讀量筒","眼睛和凹液面最低處平視；俯視偏大、仰視偏小"],["質量和重量","質量到哪裡都不變；重量在月球約剩 1/6"],["波傳遞的是什麼","能量；介質只在原地振動"],["橫波","振動方向和前進方向垂直，例：繩波"],["縱波","振動方向和前進方向平行，例：聲波"],["波長 λ","相鄰兩個波峰（或波谷）的距離"],["振幅","離開平衡位置最遠的距離"],["頻率 f","1 秒振動幾次，單位 Hz"],["週期 T","振動 1 次要幾秒，T ＝ 1 ÷ f"],["波速公式","v ＝ λ × f"],["聲音怎麼產生","物體振動"],["真空能傳聲嗎","不能，聲音需要介質"],["聲速快慢","一般：固體＞液體＞氣體；氣溫越高，空氣中越快"],["打雷算距離","距離 ≈ 聲速 × 閃電到雷聲的秒數"]],"order":[{"t":"排水法量石頭體積","items":["量筒裝入適量的水","平視凹液面最低處，記下 V₁","用細線綁住石頭，慢慢放進水裡","再平視讀出水位 V₂","石頭體積 ＝ V₂ − V₁"]},{"t":"長度單位：由大到小","items":["公里 km","公尺 m","公分 cm","毫米 mm"]},{"t":"聲速：由快到慢","items":["鋼鐵","水","30°C 的空氣","0°C 的空氣"]},{"t":"鬧鐘的聲音怎麼跑進耳朵","items":["鬧鐘的鈴快速振動","推擠旁邊的空氣分子","空氣形成疏密相間的縱波傳出去","耳膜跟著振動","大腦判讀成聲音"]}],"quizHow":"📝 怎麼作答：每題<b>點一個<\/b>你覺得對的答案，馬上會告訴你對錯和原因，再按「下一關」。題目分三區：🌱 看懂區 → 📘 課本區 → 🔥 段考挑戰區，<b>越後面越難，最後幾題就是段考程度<\/b>，錯了很正常！錯的題目會自動放進「📕 錯題」，回去重做到全對就過關。做不完沒關係，進度會自動存起來，下次接著做。","quiz":[{"tag":"看懂","s":"讀量筒裡水的體積時，眼睛應該怎麼看？","o":["從上面往下看凹液面","從下面往上看凹液面","和凹液面最低處平視","和凹液面最高處平視"],"a":2,"e":"要和凹液面最低處平視。從上往下看（俯視）會讀太大，從下往上看（仰視）會讀太小。"},{"tag":"看懂","s":"量筒原本有水 50.0 mL，放入一顆小石頭後水位升到 58.0 mL。石頭體積是多少？","o":["58.0 cm³","8.0 cm³","50.0 cm³","108.0 cm³"],"a":1,"e":"排水法：V₂ − V₁ ＝ 58.0 − 50.0 ＝ 8.0 mL ＝ 8.0 cm³。58.0 是水加石頭；108.0 是錯把兩個數相加。"},{"tag":"看懂","s":"球場觀眾做「人浪」時，下列敘述哪一個正確？","o":["觀眾跟著浪一起往旁邊跑","人浪是縱波","觀眾只在原位站起坐下，傳出去的是動作（能量）","人浪不需要觀眾也能傳下去"],"a":2,"e":"波傳的是能量，介質（觀眾）只在原地振動。觀眾上下動、浪往旁邊跑，振動方向和前進方向垂直，所以是橫波。"},{"tag":"看懂","s":"聲波屬於哪一種波？","o":["橫波","縱波","不需要介質的波","只能在固體裡傳的波"],"a":1,"e":"聲音是空氣分子前後推擠形成疏密波，振動方向和前進方向平行，是縱波；它需要介質，固體、液體、氣體都能傳。"},{"tag":"看懂","s":"下列哪一個現象最能說明「聲音是物體振動產生的」？","o":["打雷時先看到閃電","說話時摸喉嚨會感覺到振動","聲音在水中比在空氣中快","太空中聽不到聲音"],"a":1,"e":"說話時喉嚨（聲帶）在振動，直接說明聲音來自振動。閃電、水中聲速、太空聽不到，說明的是速度和介質。"},{"tag":"看懂","s":"把響著的鬧鐘放進玻璃罩，慢慢抽出裡面的空氣，聽到的鈴聲會怎樣？","o":["越來越大聲","完全不變","越來越小聲","音調變高"],"a":2,"e":"空氣越來越少，傳聲的介質越來越少，聲音就越來越小；真空時幾乎聽不到。"},{"tag":"看懂","s":"一般情況下，聲音在下列哪一種物質中跑得最快？","o":["0°C 的空氣","30°C 的空氣","水","鋼鐵"],"a":3,"e":"一般而言聲速是固體＞液體＞氣體，鋼鐵約 5000 m/s 以上，水約 1500 m/s，空氣約 340 m/s。"},{"tag":"課本","s":"用最小刻度 0.1 cm 的直尺量橡皮擦，下列哪一個記錄最正確？","o":["4 cm","4.3 cm","4.36 cm","4.362 cm"],"a":2,"e":"最小刻度 0.1 cm，要讀到 0.1 cm 那一位，再多估一位，所以記到 0.01 cm：4.36 cm。4 cm、4.3 cm 少估了；4.362 cm 多估了兩位，不合理。"},{"tag":"課本","s":"小美量鉛筆長 12.50 cm。這個數字裡，哪一位是「估計值」？","o":["十位的 1","個位的 2","小數點後的 5","最後的 0"],"a":3,"e":"記錄的最後一位永遠是估計值。最後的 0 代表「我估過了，剛好對在刻度上」，不能省略。"},{"tag":"課本","s":"2.5 L 的大瓶綠茶，等於多少 cm³？","o":["2500","250","25000","25"],"a":0,"e":"L → mL 往小單位走要 ×1000：2.5 × 1000 ＝ 2500 mL；1 mL ＝ 1 cm³，所以是 2500 cm³。"},{"tag":"課本","s":"1 m³ 等於多少 L？","o":["1000 L","10 L","100 L","1,000,000 L"],"a":0,"e":"1 m³ ＝ 100 cm × 100 cm × 100 cm ＝ 1,000,000 cm³ ＝ 1,000,000 mL ＝ 1000 L。選 100 L 是只乘了一次 100。"},{"tag":"課本","s":"太空人帶一塊 1 kg 的巧克力到月球（月球的重力約是地球的 1/6）。下列哪一個正確？","o":["質量變成約 1/6 kg","質量變大","質量和重量都不變","質量還是 1 kg，用彈簧秤量的讀數變小"],"a":3,"e":"質量是物體含有多少物質，換地方不會變；重量是受到的重力，月球上只剩約 1/6，所以彈簧秤讀數變小。"},{"tag":"課本","s":"某個波源 1 秒振動 4 次，它的週期是多少？","o":["0.25 秒","4 秒","0.4 秒","2 秒"],"a":0,"e":"頻率 f ＝ 4 Hz，週期 T ＝ 1 ÷ f ＝ 1 ÷ 4 ＝ 0.25 秒。4 秒是把頻率當成週期。"},{"tag":"課本","s":"一條繩波的波長是 2 m，頻率是 3 Hz，波速是多少？","o":["0.67 m/s","1.5 m/s","5 m/s","6 m/s"],"a":3,"e":"v ＝ λ × f ＝ 2 × 3 ＝ 6 m/s。0.67 是 2 ÷ 3、1.5 是 3 ÷ 2、5 是 2 ＋ 3，都用錯了公式。"},{"tag":"課本","s":"看到閃電後 3 秒才聽到雷聲，當時聲速約 340 m/s。打雷的地方大約多遠？","o":["113 m","1020 m","340 m","3000 m"],"a":1,"e":"光幾乎瞬間就到，所以 3 秒都是聲音在走：340 × 3 ＝ 1020 m，大約 1 公里。113 是錯用 340 ÷ 3。"},{"tag":"課本","s":"同一支喇叭在冬天（10°C）和夏天（30°C）播放音樂，聲音在空氣中跑的速度如何？","o":["夏天比較快","冬天比較快","一樣快","只跟音量大小有關"],"a":0,"e":"空氣溫度越高，聲速越快。用 331 ＋ 0.6 × 氣溫：10°C 約 337 m/s，30°C 約 349 m/s。音量大小不影響聲速。"},{"tag":"段考挑戰","s":"量筒裡原本裝水 38.0 mL，放入 5 顆相同的彈珠後，水位升到 48.0 mL。每一顆彈珠的體積是多少？","o":["10.0 cm³","2.0 cm³","9.6 cm³","7.6 cm³"],"a":1,"e":"兩步：5 顆一起排開的水是 48.0 − 38.0 ＝ 10.0 mL ＝ 10.0 cm³，再平分給 5 顆：10.0 ÷ 5 ＝ 2.0 cm³。10.0 是忘了除以 5；9.6 是 48.0 ÷ 5、7.6 是 38.0 ÷ 5，都把水位當成彈珠的體積。"},{"tag":"段考挑戰","s":"小華用最小刻度 1 mm（0.1 cm）的直尺量課本的長，記錄為 25.74 cm。下列敘述何者<b>正確<\/b>？","o":["準確值是 25.74 cm","這把尺可以準確量到 0.01 cm","估計值是 0.04 cm","改用公尺記錄，應寫成 0.26 m"],"a":2,"e":"最小刻度 0.1 cm，看得準的只到 25.7 cm（準確值），最後一位 0.04 cm 是估出來的（估計值）。準確值不含估計的那一位；這把尺只能準確量到 0.1 cm；換單位不能把估計值丟掉，要寫 0.2574 m。"},{"tag":"段考挑戰","s":"【題組】下圖是一條繩波在某一瞬間的形狀（橫軸是位置，縱軸是上下的位移），A、B、C、D 是繩子上的四個點。","src":"<svg viewBox=\"0 0 470 242\" role=\"img\" aria-label=\"繩波某一瞬間的波形圖\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"242 // 作答同步（學習小站 study-hub）：網頁 → ntfy.sh → Mac mini。renderPage／renderHome 會把整份檔案嵌進頁面。
// 鑰匙：第一次用「網址#k=鑰匙」打開任何一頁就記在這台平板（同網域每頁共用），#k=off 取消；沒有鑰匙時完全不作用。
// 頻道與加密鑰匙都由鑰匙推出（和 Mac 的 study_hub.py 同一套規則）：
//   收件 sh-<sha256("in:"+鑰匙) 前 24 碼>、回條 sh-<sha256("st:"+鑰匙) 前 24 碼>、AES-GCM 鑰匙 sha256("enc:"+鑰匙)
// 作答先排進本機佇列，送出後等 Mac 在回條頻道確認才刪；沒網路或 Mac 沒回，20 分鐘後重送（Mac 會去重）。
const HUB = (() => {
  const NT = "https://ntfy.sh/", QK = "hub_q", MAXB = 2700; // 一則訊息的明文上限（加密＋base64 後要在 4096 以內）
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  // 首頁不清掉網址上的鑰匙：iPad「加入主畫面」的圖示和 Safari 分開存資料，網址帶著鑰匙，圖示打開時才會自己記住
  const takeKey = () => {
    const m = location.hash.match(/[#&]k=([\w-]+)/);
    if (!m) return false;
    put("hub_k", m[1] === "off" ? null : m[1]);
    if (typeof DATA !== "undefined") history.replaceState(null, "", location.pathname + location.search);
    return true;
  };
  takeKey();
  addEventListener("hashchange", () => { if (takeKey()) location.reload(); }); // 頁面已開著時點連結只會換 # 後面，不會重新載入
  const KEY = get("hub_k"), ON = !!(KEY && window.crypto && crypto.subtle && window.fetch);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const sha = (s) => crypto.subtle.digest("SHA-256", enc.encode(s));
  const b64u = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  let ch = null;
  const chan = () => ch || (ch = Promise.all([sha("in:" + KEY), sha("st:" + KEY), sha("enc:" + KEY)]).then(async ([a, b, c]) =>
    ({ tin: "sh-" + hex(a).slice(0, 24), tst: "sh-" + hex(b).slice(0, 24), k: await crypto.subtle.importKey("raw", c, "AES-GCM", false, ["encrypt", "decrypt"]) })));
  async function seal(k, u8) {
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, u8));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  const open = async (k, u8) => new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, k, u8.slice(12)));
  const DEV = get("hub_dev") || (() => { const d = Math.random().toString(36).slice(2, 10); put("hub_dev", d); return d; })();
  const queue = () => { try { return JSON.parse(get(QK) || "[]"); } catch (e) { return []; } };
  const save = (a) => put(QK, JSON.stringify(a.slice(-500)));
  const pg = () => (typeof DATA !== "undefined" && DATA && DATA.id) || "home";

  // 記一筆作答；key 相同又還沒送出的舊筆會被取代（打字題只送最後的內容）。題目代號用 id2，id 是這筆事件自己的
  let lastTs = 0;
  function log(t, d = {}, wait = 2500) {
    if (!ON) return;
    const a = queue(), ts = lastTs = Math.max(Date.now(), lastTs + 1); // 同一毫秒連點兩下也要分得出先後
    if (d.key) { const i = a.findIndex((e) => !e.s && e.key === d.key); if (i >= 0) a.splice(i, 1); }
    a.push({ ...d, id: ts.toString(36) + Math.random().toString(36).slice(2, 6), ts, pg: pg(), t, s: 0 });
    save(a); soon(wait); ui();
  }
  let tm = null, busy = false;
  const soon = (ms) => { clearTimeout(tm); tm = setTimeout(flush, ms); };
  async function flush(keepalive) {
    if (!ON || busy || navigator.onLine === false) return;
    busy = true;
    try {
      const c = await chan(), now = Date.now(), todo = queue().filter((e) => !e.s || now - e.s > 20 * 60e3);
      while (todo.length) {
        const batch = []; let size = 0;
        while (todo.length) {
          const { s, key, ...ev } = todo[0], j = JSON.stringify(ev), n = enc.encode(j).length;
          if (batch.length && size + n > MAXB) break;
          batch.push({ id: ev.id, j }); size += n; todo.shift();
        }
        const body = b64u(await seal(c.k, enc.encode(`{"v":1,"dev":"${DEV}","ev":[${batch.map((x) => x.j).join(",")}]}`)));
        const r = await fetch(NT + c.tin, { method: "POST", body, keepalive: !!keepalive });
        if (!r.ok) break;
        const ids = new Set(batch.map((x) => x.id)), t = Date.now(), cur = queue();
        cur.forEach((e) => { if (ids.has(e.id)) e.s = t; }); save(cur);
      }
      if (!keepalive) { setTimeout(poll, 8000); setTimeout(poll, 30000); }
    } catch (e) {} finally { busy = false; ui(); }
  }
  // 讀 Mac 的回條：確認收到的就從佇列刪掉
  async function poll() {
    if (!ON) return;
    try {
      const c = await chan(), r = await fetch(NT + c.tst + "/json?poll=1&since=" + (get("hub_since") || "12h"));
      if (!r.ok) return;
      const acked = new Set();
      for (const ln of (await r.text()).split("\n")) {
        let msg; try { msg = JSON.parse(ln); } catch (e) { continue; }
        if (msg.event !== "message") continue;
        put("hub_since", msg.id);
        try { const o = JSON.parse(dec.decode(await open(c.k, unb64u(msg.message)))); (o.ack || []).forEach((x) => acked.add(x)); if (o.at) put("hub_last", o.at); } catch (e) {}
      }
      if (acked.size) save(queue().filter((e) => !acked.has(e.id)));
    } catch (e) {} finally { ui(); }
  }
  // 整個檔案（作答報告圖）加密後當 ntfy 附件上傳；成功回 true
  async function sendFile(u8, meta) {
    if (!ON) return false;
    try {
      const c = await chan(), m2 = b64u(await seal(c.k, enc.encode(JSON.stringify({ v: 1, dev: DEV, pg: pg(), ts: Date.now(), ...meta }))));
      const r = await fetch(NT + c.tin + "?filename=r.bin&message=" + m2, { method: "POST", body: new Blob([await seal(c.k, u8)], { type: "text/plain" }) });
      return r.ok;
    } catch (e) { return false; }
  }
  // 頁尾一行：讓孩子知道作答會傳給爸爸、同步到哪
  function ui() {
    const el = document.getElementById("hubst"); if (!el) return;
    if (!ON) { el.textContent = ""; return; }
    const n = queue().filter((e) => !e.s).length, last = get("hub_last");
    el.textContent = "📡 你的作答會自動傳給爸爸" + (n ? `・有 ${n} 筆等網路，連上會自動補傳` : last ? `・已同步（${last}）` : "");
  }
  if (ON) {
    addEventListener("online", () => flush());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(true); else poll(); });
    setInterval(() => { if (document.visibilityState === "visible") flush(); }, 60000);
    setTimeout(() => { flush(); poll(); }, 1500);
  }
  return { on: ON, log, sendFile, ui };
})();

 sec.querySelectorAll("[data-text]").forEach(t=>{const r=S.inl[t.dataset.text];if(r&&r.v&&!t.value)t.value=r.v});
 sec.querySelectorAll("canvas[data-w]").forEach(initCanvas);
 sec.querySelectorAll("img[data-wimg]").forEach(img=>IMG.get(img.dataset.wimg,"photo").then(u=>{if(u){img.src=u;img.style.display="block"}}))}
function initCanvas(c){if(c.dataset.ready)return;const w=c.clientWidth;if(!w)return;c.dataset.ready=1;const R=devicePixelRatio||1;c.width=w*R;c.height=c.clientHeight*R;
 const x=c.getContext("2d");x.scale(R,R);x.fillStyle="#fff";x.fillRect(0,0,w,c.clientHeight);x.lineCap=x.lineJoin="round";x.lineWidth=3.2;x.strokeStyle="#1d2b4f";
 const id=c.dataset.w;IMG.get(id,"img").then(u=>{if(!u)return;const im=new Image();im.onload=()=>x.drawImage(im,0,0,im.width/R,im.height/R);im.src=u});
 let dn=false,lx=0,ly=0;const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left-c.clientLeft,e.clientY-b.top-c.clientTop]};
 c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);x.beginPath();x.arc(lx,ly,1.5,0,7);x.fillStyle="#1d2b4f";x.fill()};
 c.onpointermove=e=>{if(!dn)return;const[nx,ny]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(nx,ny);x.stroke();lx=nx;ly=ny};
 c.onpointerup=c.onpointercancel=()=>{if(!dn)return;dn=false;IMG.set(id,"img",c.toDataURL("image/jpeg",0.7))}}
// 平板轉向、視窗變寬窄時重建白板（照原比例把字畫回去），不然筆跡會和手指位置對不上
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>document.querySelectorAll("canvas[data-w]").forEach(c=>{if(c.dataset.ready&&c.clientWidth&&Math.abs(c.clientWidth*(devicePixelRatio||1)-c.width)>2){delete c.dataset.ready;initCanvas(c)}}),250)});
function shrink(file,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",0.72))};im.src=fr.result};fr.readAsDataURL(file)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-ask],[data-check],[data-wclear],[data-submit]");if(!t)return;
 if(t.dataset.ask){const b=INL[t.dataset.ask],j=+t.dataset.j,got=S.inl[b.id]?.got;S.inl[b.id]={j,got:got||j===b.a};save();askMark(t.closest(".ask"),b,j);if(!b.reveal&&j===b.a&&!got)star(1);HUB.log("ask",{id2:b.id,j,ok:b.reveal?null:j===b.a})}
 else if(t.dataset.check){const b=INL[t.dataset.check],box=t.closest(".fill"),v=box.querySelector("input").value,fb=box.querySelector(".fb"),r=S.inl[b.id]||{n:0};
  r.n=(r.n||0)+1;r.v=v;const ok=fillOK(b,v);r.ok=ok;S.inl[b.id]=r;save();HUB.log("fill",{id2:b.id,v:String(v).slice(0,40),ok,n:r.n});fb.className="fb "+(ok?"ok":"bad");
  fb.innerHTML=ok?"✅ 答對了！"+(b.e?"<br>"+b.e:""):(r.n<2?"❌ 再試一次！"+(b.hint?"<br>提示："+b.hint:""):"❌ 正確答案是 <b>"+b.ans[0]+" "+(b.unit||"")+"</b>"+(b.e?"<br>"+b.e:""));if(ok&&r.n===1)star(1)}
 else if(t.dataset.wclear){const c=document.querySelector(`canvas[data-w="${t.dataset.wclear}"]`);delete c.dataset.ready;IMG.set(t.dataset.wclear,"img",null).then(()=>initCanvas(c))}
 else if(t.dataset.submit)makeReport()});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.text){S.inl[t.dataset.text]={v:t.value};save();HUB.log("text",{id2:t.dataset.text,v:t.value.slice(0,600),key:"text:"+t.dataset.text},15000)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.wphoto&&t.files[0]){shrink(t.files[0],u=>{const id=t.dataset.wphoto;IMG.set(id,"photo",u);const img=document.querySelector(`img[data-wimg="${id}"]`);img.src=u;img.style.display="block"})}});
function wrapTxt(x,s,w){const out=[];String(s).replace(/<[^>]+>/g,"").split("\n").forEach(p=>{let l="";for(const ch of p){if(x.measureText(l+ch).width>w){out.push(l);l=ch}else l+=ch}out.push(l)});return out}
async function makeReport(){const fb=$("subfb");fb.className="fb ok";fb.innerHTML="⏳ 正在整理你的作答…";
 const Q=qList(),W=1080,P=48,FN='"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif',items=[],INK="#3E3A39",HD="#B65544";
 const T=(s,sz=30,c=INK,b=false)=>items.push({t:"t",s,sz,c,b});
 const now=new Date(),ds=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
 T(DATA.title,40,INK);T("作答報告　"+ds+"　⭐ "+S.star,28,"#7C7571");
 const done=Object.keys(S.ans).length,first=Object.entries(S.first).filter(([i,v])=>Q[i]&&Q[i].a===v).length,wr=Object.entries(S.ans).filter(([i,v])=>Q[i]&&Q[i].a!==v);
 T("⚔️ 闖關",34,HD);T(`已作答 ${done}/${Q.length} 題，第一次就答對 ${first} 題，目前還錯 ${wr.length} 題`);
 Object.entries(S.first).filter(([i,v])=>Q[i]&&Q[i].a!==v).forEach(([i,v])=>T(`　第 ${+i+1} 題第一次選 ${L[v]}（正解 ${L[Q[i].a]}）：${Q[i].s.replace(/<[^>]+>/g,"").slice(0,28)}`,26,"#5A5452"));
 const asks=Object.values(INL).filter(b=>b.t==="ask"),fills=Object.values(INL).filter(b=>b.t==="fill"),texts=Object.values(INL).filter(b=>b.t==="text"),writes=Object.values(INL).filter(b=>b.t==="write");
 if(asks.length){T("🤔 猜謎／點選",34,HD);asks.forEach(b=>{const r=S.inl[b.id];T(`${b.q.replace(/<[^>]+>/g,"")}　→　${r&&r.j!==undefined?b.o[r.j]+(r.j===b.a?" ✓":" ✗"):"（沒作答）"}`,26)})}
 if(fills.length){T("⌨️ 填空",34,HD);fills.forEach(b=>{const r=S.inl[b.id];T(`${b.q.replace(/<[^>]+>/g,"")}　→　${r&&r.v?normNum(r.v)+" "+(b.unit||"")+(r.ok?" ✓":" ✗")+"（試了 "+r.n+" 次）":"（沒作答）"}`,26)})}
 if(texts.length){T("💬 打字回答",34,HD);texts.forEach(b=>{const r=S.inl[b.id];T("Q："+b.q.replace(/<[^>]+>/g,""),26,"#7C7571");T("A："+(r&&r.v?r.v:"（沒作答）"),28)})}
 const imgs=[];for(const b of writes){for(const f of ["img","photo"]){const u=await IMG.get(b.id,f);if(!u)continue;const im=new Image();await new Promise(ok=>{im.onload=ok;im.onerror=ok;im.src=u});imgs.push({q:b.q,im})}}
 const cv=document.createElement("canvas"),x=cv.getContext("2d");let H=P;x.font=`30px ${FN}`;
 const lay=[];items.forEach(it=>{x.font=`${it.b?"bold ":""}${it.sz}px ${FN}`;const ls=wrapTxt(x,it.s,W-2*P);lay.push({it,ls});H+=ls.length*it.sz*1.45+6});
 imgs.forEach(o=>{H+=60+o.im.height*((W-2*P)/o.im.width)+20});if(imgs.length)H+=50;
 cv.width=W;cv.height=H+P;x.fillStyle="#FFFCF6";x.fillRect(0,0,W,cv.height);x.strokeStyle=INK;x.lineWidth=6;x.strokeRect(14,14,W-28,cv.height-28);let y=P;
 lay.forEach(({it,ls})=>{x.font=`${it.b?"bold ":""}${it.sz}px ${FN}`;x.fillStyle=it.c;ls.forEach(l=>{y+=it.sz*1.45;x.fillText(l,P,y-it.sz*0.35)});y+=6});
 if(imgs.length){y+=50;x.font=`34px ${FN}`;x.fillStyle=HD;x.fillText("✍️ 手寫",P,y-10)}
 imgs.forEach(o=>{x.font=`26px ${FN}`;x.fillStyle="#7C7571";y+=40;x.fillText(wrapTxt(x,o.q,W-2*P)[0],P,y);y+=20;const h=o.im.height*((W-2*P)/o.im.width);x.drawImage(o.im,P,y,W-2*P,h);x.lineWidth=3;x.strokeStyle=INK;x.strokeRect(P,y,W-2*P,h);y+=h+20});
 const url=cv.toDataURL("image/jpeg",0.82),img=$("subimg");img.src=url;img.style.display="block";
 const blob=await (await fetch(url)).blob(),file=new File([blob],DATA.id+"-作答報告.jpg",{type:"image/jpeg"});
 if(HUB.on){fb.innerHTML="⏳ 正在傳給爸爸…";if(await HUB.sendFile(new Uint8Array(await blob.arrayBuffer()),{t:"report",star:S.star})){fb.innerHTML="✅ 已經自動傳給爸爸了！謝謝你，這週辛苦了 🎉";star(3);boom();return}}
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:DATA.title,text:DATA.title+" 作答報告"});fb.innerHTML="✅ 傳好了！謝謝你，這週辛苦了 🎉";star(3);boom();return}catch(e){}}
 fb.innerHTML=`📷 報告圖做好了（在下面）。<b>長按圖片</b>就能存起來或分享到 LINE 給爸爸。<br><a href="${url}" download="${DATA.id}-作答報告.jpg">或按這裡下載圖片</a>`}

function printQuiz(){const Q=qList();return `<div class="card"><h2>⚔️ 練習題</h2>${Q.map((q,i)=>`${LV[q.tag]&&(i===0||Q[i-1].tag!==q.tag)?`<h3>${LV[q.tag][0]} ${LV[q.tag][1]}：${LV[q.tag][2]}</h3>`:""}<div class="qbox"><div class="stem">${i+1}. ${q.tag&&!LV[q.tag]?`<span class="tag">${q.tag}</span>`:""}${q.s}</div>${q.src?srcBox(q)+`<div class="stem">${q.s2||""}</div>`:""}<div>${q.o.map((o,j)=>`(${L[j]}) ${o}`).join("　")}</div></div>`).join("")}</div>`}
function printKey(){return `<div class="card"><h2>✅ 解答與解析</h2>${qList().map((q,i)=>`<p><b>${i+1}. (${L[q.a]})</b> ${q.e}</p>`).join("")}${(DATA.order||[]).map(g=>`<p><b>${g.t}</b>：${g.items.join(" → ")}</p>`).join("")}</div>`}
