<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFCF6">
<title>學習教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 繪本風（和紙白、3px 墨灰框、珊瑚粉／山吹黃／水色／若竹綠平塗、Huninn 粉圓）。只用淺色底，不做深色模式。 */
:root{--ink:#3E3A39;--paper:#FFFCF6;--coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--green:#B9DAA5;
 --coral-soft:#FCE7E2;--yellow-soft:#FDF3D6;--mizu-soft:#E2F1F7;--green-soft:#E8F3E0;
 --bg-2:#F5EEE2;--muted:#7C7571;--line:#E8DFD2;--accent-text:#B65544;--bw:3px;--r:24px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 "Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
h1,h2,h3,h4,b,strong,th{font-weight:400}
button{font-family:inherit}
/* ---- 頂部 ---- */
header{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:10px 16px 4px}
.logo{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:21px;line-height:1}
.top h1{margin:0;font-size:19px;line-height:1.5;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{flex:none;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:8px;max-width:880px;margin:0 auto;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
nav button.on{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
main{max-width:880px;margin:0 auto;padding:18px 16px 48px}
section{display:none}section.on{display:block;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.97);opacity:0}60%{transform:scale(1.008);opacity:1}100%{transform:scale(1)}}
/* ---- 插圖 ---- */
.art{display:block;width:72px;height:72px;flex:none}
.art.sm{width:40px;height:40px}.art.md{width:54px;height:54px}.art.lg{width:104px;height:104px}
.stamp{display:grid;place-items:center;background:#fff;border:var(--bw) solid var(--ink);border-radius:50%}
.float{animation:float 3.4s ease-in-out infinite;transform-origin:50% 90%}
.float.d2{animation-delay:-1.2s}.float.d3{animation-delay:-2.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
/* ---- 首頁橫幅 ---- */
.hero{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border:var(--bw) solid var(--ink);border-radius:28px;padding:16px 18px;margin:0 0 18px}
.hero .txt{flex:1;min-width:0}
.hero h2{font-size:25px;line-height:1.4;margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:13.5px;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.chip.y{background:var(--yellow)}.chip.c{background:var(--coral)}
.pics{flex:none;position:relative;width:140px;height:124px}
.pics .stamp{position:absolute;right:4px;bottom:0;width:104px;height:104px}
.pics .stamp .art{width:80px;height:80px}
.pics .s1{position:absolute;left:0;top:0}.pics .s2{position:absolute;right:-6px;top:-10px}
/* ---- 卡片與文字 ---- */
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px 20px;margin:0 0 18px}
h2{font-size:23px;line-height:1.45;margin:0 0 8px}
h3{font-size:19px;line-height:1.5;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
h3:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
b{box-shadow:inset 0 -.42em 0 var(--yellow);padding:0 2px}/* 用 box-shadow 畫螢光筆：透明漸層在 PDF 會多一條黑線 */
.card ul,.card ol{padding-left:1.4em}li::marker{color:var(--accent-text)}
.guide{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px}
.who{flex:none;width:60px;text-align:center}
.ava{width:58px;height:58px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:30px;line-height:1;animation:float 3.4s ease-in-out infinite}
.who small{display:block;font-size:12px;line-height:1.3;margin-top:4px;color:var(--muted)}
.bubble{background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;position:relative;min-width:0;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:19px;width:14px;height:14px;background:#fff;border-left:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);transform:rotate(45deg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.tile{border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 14px;background:var(--coral-soft)}
.tile:nth-child(4n+2){background:var(--mizu-soft)}.tile:nth-child(4n+3){background:var(--yellow-soft)}.tile:nth-child(4n){background:var(--green-soft)}
.tile .em{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:25px;line-height:1;margin-bottom:6px}
.tile .em:empty{display:none}
.tile h4{margin:0 0 2px;font-size:18px;line-height:1.5}.tile p{margin:0;font-size:15.5px}
.chant{background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0 18px;font-size:19px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.chant small{display:block;font-size:14.5px;opacity:.85}
.chant b{box-shadow:inset 0 -.42em 0 #fff}
.trap{background:var(--coral-soft);border:var(--bw) dashed var(--ink);border-radius:18px;padding:10px 14px;margin:12px 0;font-size:15.5px}
.trap:before{content:"⚠️ 陷阱題注意";display:inline-block;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin:0 8px 4px 0;font-size:14px;line-height:1.7}
.lab{background:var(--mizu-soft);border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;margin:12px 0}
.lab h4{margin:2px 0 4px;font-size:18px}
.fig{max-width:580px;margin:10px auto;background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden}
.fig svg{width:100%;height:auto;display:block}
main svg:not(.art){max-width:100%;height:auto}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.vs>div{border:var(--bw) solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15.5px;background:var(--coral-soft)}
.vs>div:nth-child(2n){background:var(--mizu-soft)}
.vs h4{margin:0 0 4px;font-size:18px;line-height:1.5}
.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden}
th,td{padding:7px 10px;vertical-align:top;text-align:left;border-bottom:2px solid var(--line)}
th{background:var(--yellow-soft);border-bottom:2px solid var(--ink)}
td+td,th+th{border-left:2px solid var(--line)}
tr:last-child td{border-bottom:0}
.tl{position:relative;padding-left:32px;margin:10px 0}
.tl:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.tl div{position:relative;margin:0 0 12px}
.tl div:before{content:"";position:absolute;left:-31px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink)}
.tl span{display:inline-block;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin-right:6px;font-size:15px}
.vid{width:100%;display:block;background:var(--ink);border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 影片放大、YouTube 名師影片 ---- */
.vbox{position:relative}
.zoom{position:absolute;right:10px;top:10px;z-index:2;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.yt{border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;margin:12px 0}
.yt .scr{position:relative;display:block;width:100%;aspect-ratio:16/9;background:var(--ink);cursor:pointer;overflow:hidden}
.yt .scr img{width:100%;height:100%;object-fit:cover;display:block}
.yt .scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:var(--coral);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:28px;line-height:1;box-shadow:0 4px 0 var(--ink);padding-left:5px}
.yt .dur{position:absolute;left:10px;bottom:10px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;line-height:1.7}
.yt .scr .zoom{top:auto;bottom:10px}.yt .scr.live .zoom{top:10px;bottom:auto}
.ytm{padding:10px 16px 12px;border-top:var(--bw) solid var(--ink)}
.ytm h4{margin:0;font-size:17.5px;line-height:1.5}
.ytm p{margin:2px 0 0;font-size:14.5px;line-height:1.6;color:var(--muted)}
.ytm .tag{color:var(--ink)}
#big{position:fixed;inset:0;z-index:200;background:rgba(40,36,35,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 12px 16px}
#big.on{display:flex}
#big .stage{width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;background:#000;border:var(--bw) solid #fff;border-radius:16px;overflow:hidden}
#big .stage iframe,#big .stage video{width:100%;height:100%;border:0;display:block;background:#000}
#big .bt{color:#fff;font-size:16px;text-align:center;max-width:880px}
#big .x{position:absolute;top:10px;right:12px;font-size:18px;line-height:1.5;border:2px solid var(--ink);background:var(--coral);color:var(--ink);border-radius:999px;padding:4px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
body.big{overflow:hidden}
.pic{max-width:100%;border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 記憶卡 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.flip{perspective:900px;height:140px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .k{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--ink);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;overflow:auto}
.flip .f{background:var(--mizu);font-size:19px}
.flip:nth-child(4n+2) .f{background:var(--coral)}.flip:nth-child(4n+3) .f{background:var(--green)}.flip:nth-child(4n) .f{background:var(--yellow)}
.flip .k{background:#fff;font-size:15.5px;transform:rotateY(180deg)}
/* ---- 闖關 ---- */
.qbox{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px;margin-bottom:14px}
.prog{height:16px;background:var(--bg-2);border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink);transition:width .4s}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted)}
.stem{font-size:19px;white-space:pre-line;margin:8px 0}
.src{background:var(--mizu-soft);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;margin:10px 0;font-size:16px}
.opt{display:block;width:100%;text-align:left;font-size:17px;line-height:1.6;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:10px 16px;margin:10px 0;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.ok{background:var(--green)}
.opt.bad{background:var(--coral);animation:shake .3s}
.opt.pick{background:var(--yellow-soft);box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--ink)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-top:10px;font-size:16px}
.fb.ok{display:block;background:var(--green-soft)}.fb.bad{display:block;background:var(--coral-soft)}
.btn{display:inline-block;font-size:16px;line-height:1.5;border:var(--bw) solid var(--ink);background:var(--coral);color:var(--ink);border-radius:16px;padding:8px 20px;margin-top:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--mizu)}
.say{font-size:14px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:middle;cursor:pointer}
.combo{background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 10px;color:var(--ink)}
.combo:empty{display:none}
.rank{text-align:center;padding:6px 4px}
.rank .deco{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.rank .big{width:116px;height:116px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:58px;line-height:1}
.empty{text-align:center}.empty .art{margin:4px auto 0}
.lvl{border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:2px 0 10px;background:var(--yellow-soft)}
.lvl b{display:block;font-size:18px;box-shadow:none;padding:0}.lvl small{display:block;font-size:14.5px;color:var(--muted);line-height:1.5}
.lv-g{background:var(--green-soft)}.lv-m{background:var(--mizu-soft)}.lv-c{background:var(--coral-soft)}
.lvsum{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0}
.lvchip{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px}
.src svg{display:block;width:100%;max-width:520px;margin:4px auto}
.order{padding:0;margin:8px 0}
.order li{list-style:none;display:flex;align-items:center;border:var(--bw) solid var(--ink);background:#fff;border-radius:16px;padding:8px 14px;margin:10px 0;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.order li.pick{background:var(--yellow-soft);box-shadow:0 0 0 var(--ink);transform:translateY(3px)}
.order li .n{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;margin-right:10px;font-size:15px;line-height:1}
.order li.pick .n{background:var(--yellow)}
.tag{display:inline-block;font-size:13px;line-height:1.6;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
.srcs{font-size:13px;color:var(--muted);margin-top:8px}.srcs a{color:var(--accent-text)}
#boom{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;width:max-content;max-width:calc(100% - 32px);background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-size:16px}
/* ---- 作答區塊 ---- */
.how{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin:10px 0 8px;font-size:15px}
.ask,.fill,.wbox,.tbox,.sub{background:var(--paper);border:var(--bw) dashed var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0}
.fill .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fill .row .btn{margin-top:0}
.fill input,.tbox textarea{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);outline:0}
.fill input:focus,.tbox textarea:focus{box-shadow:0 0 0 3px var(--yellow)}
.fill input{width:9em}.tbox textarea{width:100%;min-height:80px;resize:vertical}
.wcan{width:100%;height:300px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.wtools .btn{margin-top:0}
.wans{margin-top:10px}.wans summary{display:inline-block;list-style:none;cursor:pointer}.wans summary::-webkit-details-marker{display:none}.wans div{font-size:20px;margin-top:10px;line-height:1.7}
.wphoto,.subimg{max-width:100%;border:var(--bw) solid var(--ink);border-radius:16px;margin-top:10px;display:none}
.reveal{background:var(--green-soft);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:12px 0}
/* ---- 音效開關 ---- */
.snd{flex:none;font-size:17px;line-height:1.5;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:0 8px;cursor:pointer}
/* ---- 互動模擬（PhET 等） ---- */
.sim{border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;margin:12px 0}
.sim .scr{position:relative;width:100%;aspect-ratio:4/3;max-height:78vh;background:var(--mizu-soft);display:grid;place-items:center;text-align:center;padding:16px}
.sim .scr.live{padding:0;background:#000;aspect-ratio:1024/618}
.sim .scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sim .simic{width:84px;height:84px;margin:0 auto 4px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:42px;line-height:1}
.sim .scr .btn{margin-top:8px}
.zoom.zl{right:auto;left:10px;background:var(--coral)}
.simm{padding:10px 16px 12px;border-top:var(--bw) solid var(--ink)}
.simm h4{margin:0;font-size:17.5px;line-height:1.5}.simm .srcs{margin-top:0}
.mis{list-style:none;padding:0;margin:8px 0 0}
.mis li{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin:8px 0;background:var(--paper);cursor:pointer;font-size:16px}
.mis li.on{background:var(--green-soft)}
.mis .bx{flex:none;width:26px;height:26px;margin-top:2px;border:2px solid var(--ink);border-radius:8px;background:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
#big .stage.sim{width:100%;max-width:1180px;aspect-ratio:auto;flex:1 1 auto;min-height:0;background:#000}
#big .bt .bm{display:inline-block;margin:2px 8px;font-size:15px}
/* ---- 故事闖關：對手血條、過場 ---- */
.foe{display:flex;align-items:center;gap:12px;background:var(--coral-soft);border:var(--bw) solid var(--ink);border-radius:18px;padding:8px 14px;margin:0 0 12px}
.fava{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:30px;line-height:1}
.foe .fi{flex:1;min-width:0}.foe .fn{font-size:16px;line-height:1.4}
.hp{height:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:3px 0}
.hp i{display:block;height:100%;background:var(--coral);border-right:2px solid var(--ink);transition:width .5s}
.foe small{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
.foe.hit .fava{animation:hit .45s}.foe.dodge .fava{animation:dodge .45s}
@keyframes hit{30%{transform:scale(.78) rotate(-14deg);background:var(--coral)}}
@keyframes dodge{40%{transform:translateX(10px) rotate(8deg)}}
.scene p{text-align:left;margin:8px 0}
.story{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:10px 0;text-align:left}
/* ---- 今日複習、這週幾次 ---- */
.goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--green-soft);border:var(--bw) solid var(--ink);border-radius:18px;padding:8px 14px;margin:0 0 18px;font-size:16px}
.gs{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--muted)}
.gs.on{background:var(--yellow);color:var(--ink)}
.goal small{color:var(--muted);font-size:14px}
#rev{scroll-margin-top:118px}
.rv{background:var(--mizu-soft)}.qbox.rv{background:#fff;box-shadow:0 0 0 4px var(--mizu)}
@media (max-width:520px){
 body{font-size:16.5px}.card{padding:16px}.qbox{padding:16px}
 .hero{padding:14px}.hero h2{font-size:21px}
 .pics{width:96px;height:100px}.pics .stamp{width:84px;height:84px;right:0}.pics .stamp .art{width:62px;height:62px}
 .pics .s1{width:34px;height:34px}.pics .s2{display:none}
}
@media (prefers-reduced-motion:reduce){
 section.on,.float,.ava,.opt.bad,.foe .fava{animation:none}
 .flip .in,.btn,.opt,.order li,.prog i{transition:none}
}
/* ---- 列印（PDF） ---- */
.print body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print header{position:static}.print nav,.print .xp,.print .snd{display:none}
.print .top h1{white-space:normal}
.print section{display:block;animation:none}
.print .float,.print .ava{animation:none}
.print .card{break-inside:auto}
.print h2,.print h3{break-after:avoid}
.print .qbox,.print .tile,.print .fig,.print .chant,.print .trap,.print .vs,.print table,.print .hero{break-inside:avoid}
.print .chant,.print .btn,.print .opt{box-shadow:none}
.print .pbreak{break-before:page}
.print .cards{grid-template-columns:1fr 1fr}
.print .fc{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:15px}
.print .wcan,.print .wtools,.print .sub{display:none}.print .wprint{height:220px;border:2px solid var(--ink);border-radius:12px;background:#fff}.print .wgrid{height:auto;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.print .wgrid span{height:70px;border:1px solid #D8D2C8;padding:2px 6px;font-size:13px;color:#7C7571}.print .wansp{transform:rotate(180deg);font-size:13px;color:#7C7571;margin:8px 0 0}
@page{size:A4;margin:12mm}

7、8 日<\/b>","<b>右半邊<\/b>"],["滿月（望）","15、16 日","整個都亮"],["下弦月","22、23 日","左半邊"],["殘月","27 日前後","左邊細細一條"]]},{"t":"chant","v":"上半月右邊亮，下半月左邊亮","sub":"上半個月：亮得越多，日期越接近十五"},{"t":"ask","id":"a2","how":"點一個你覺得對的答案。","q":"考卷上有一個「右邊亮的細月牙」，大約是農曆幾日？","o":["農曆 3 日","農曆 7 日","農曆 15 日","農曆 27 日"],"a":0,"e":"右邊亮是上半個月；只亮細細一條，才剛開始，所以是 3 日。右邊亮一半才是 7 日。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"想再聽一次嗎？📘 課本那支照翰林課本講；🔬 原理那支用模擬講「為什麼」，比較長。挑一支就好。"},{"t":"yt","id":"Pn_ENE8hYpI","title":"1-3 月相的變化","who":"麥斯","tag":"課本"},{"t":"yt","id":"X7Mmbwnj1k8","title":"月亮到底哪邊亮？畫完這張圖月相全對","who":"晟自然玩科學","tag":"原理"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「同一天晚上，月亮在天空中的形狀如何改變？」→ <b>形狀不會改變<\/b>。","「月相由缺到圓，再由圓到缺大約需要幾天？」→ <b>29 或 30 天<\/b>。","「下列的月相大約會出現在哪一個日期？」→ 先看亮哪一邊，再看亮多少。","「面對南方天空看到左半邊亮的月相是上弦月」→ ❌ 左半邊亮是<b>下弦月<\/b>。"]}]}]},{"id":"s2","nav":"🪷 水邊生物","intro":"第二站：<b>水邊的植物和動物<\/b>。這一站沒有動畫，可是有三題是「看清楚特徵就會」的題目。","cards":[{"h":"🌿 四種水生植物：看「根」和「葉」在哪裡","body":[{"t":"table","head":["種類","根","葉","例子"],"rows":[["挺水性","長在泥土裡","挺出水面","蓮、香蒲"],["浮葉性","長在泥土裡","平貼水面","睡蓮"],["<b>漂浮性<\/b>","<b>漂在水裡，不碰泥土<\/b>","浮在水面","布袋蓮、大萍、浮萍"],["<b>沉水性<\/b>","長在泥土裡","<b>整株在水裡<\/b>","<b>水蘊草<\/b>"]]},{"t":"chant","v":"挺水站出來，浮葉貼水面，漂浮到處漂，沉水躲水裡"}]},{"h":"🎈 漂浮性植物為什麼浮得起來？","body":[{"t":"tiles","v":[{"em":"🫧","h":"通氣組織","p":"葉片或葉柄裡有很多<b>裝空氣的小格子<\/b>，像游泳圈。"},{"em":"🌱","h":"根不碰土","p":"根漂在水裡，所以整株會跟著水漂。"}]},{"t":"trap","v":"考卷四個選項：「根部長在土裡」❌、「水蘊草是代表性植物」❌（它是沉水性）、「整株都沉沒在水中」❌（那是沉水性）。只有「葉片內有<b>通氣組織<\/b>」是對的。"}]},{"h":"🌊 水蘊草：軟軟的才不會斷","body":["水蘊草整株泡在水裡。它的<b>莖和葉又細又柔軟<\/b>，水流過來就跟著擺動，水變深變淺也沒關係，所以不容易折斷。",{"t":"vs","v":[{"h":"✅ 水蘊草的本領","p":"<b>柔軟的莖和葉<\/b>"},{"h":"❌ 不是它的","p":"漂浮的根（漂浮性）<br>膨大的葉柄（布袋蓮）<br>中空管道（蓮）"}]},{"t":"ask","id":"a3","how":"點一個你覺得對的答案。","q":"哪一種植物的根漂在水裡、不長在泥土裡？","o":["蓮","睡蓮","水蘊草","布袋蓮"],"a":3,"e":"布袋蓮是漂浮性，根漂在水裡。蓮、睡蓮、水蘊草的根都長在泥土裡。"}]},{"h":"🐸 小時候用鰓、長大用肺的是誰？","body":[{"t":"tiles","v":[{"em":"🥚","h":"蝌蚪","p":"住在水裡，用<b>鰓<\/b>呼吸，擺動尾巴游泳。"},{"em":"🐸","h":"青蛙","p":"長大後主要用<b>肺<\/b>呼吸，皮膚也幫忙。"}]},{"t":"table","head":["動物","怎麼呼吸"],"rows":[["<b>青蛙<\/b>","<b>小時候鰓，長大肺<\/b>"],["螃蟹、大肚魚","一輩子都用鰓"],["紅娘華","腹部末端的呼吸管伸出水面"]]}]},{"h":"🪣 去觀察水生生物要帶什麼？","body":[{"t":"tiles","v":[{"em":"📖","h":"圖鑑","p":"查名字"},{"em":"🪣","h":"水桶","p":"<b>暫時裝撈到的生物<\/b>"},{"em":"🥅","h":"撈網","p":"撈小生物"},{"em":"🔍","h":"放大鏡","p":"看小細節"},{"em":"🔭","h":"望遠鏡","p":"看遠處的鳥"}]},{"t":"trap","v":"考卷上漏勾的是<b>水桶<\/b>。撈起來的小魚小蝦要有地方放，觀察完再放回去。零食不用帶。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"想再聽一次嗎？兩支都照翰林課本講，挑你不熟的那一課。"},{"t":"yt","id":"WzCYub0MM_Q","title":"2-2 水生植物","who":"麥斯","tag":"植物"},{"t":"yt","id":"eeAowP9xNtA","title":"2-3 水生動物","who":"麥斯","tag":"動物"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「有關漂浮性植物的敘述，哪一項正確？」→ 葉片內通常具有<b>通氣組織<\/b>。","「水蘊草的哪一種特性可以適應水位及水流的變化？」→ <b>柔軟的莖和葉<\/b>。","「幼年期用鰓呼吸，成年期用肺呼吸的生物是？」→ <b>青蛙<\/b>。"]}]}]},{"id":"s3","nav":"🗺️ 地名","intro":"第三站：<b>地名小偵探<\/b>。社會這次錯最多的，是看到沒去過的地名就不知道怎麼選。其實有三個步驟！","cards":[{"h":"🎬 動畫課第 2 集","body":[{"t":"video","v":"exam4r-ep2.mp4?v=1112","poster":"exam4r-ep2.jpg","cap":"先找位置，再想地形，最後想氣候"}]},{"h":"📍 第一步：先找位置","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 420\" role=\"img\" aria-label=\"臺灣簡圖：基隆九份宜蘭和平區嘉義臺南屏東澎湖的位置\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"420\" rx=\"14\" fill=\"#FFFCF6\"/><g transform=\"translate(110 14) scale(0.7)\"><path d=\"M305.6 20 C313.1 20.8 322.9 35.5 333.6 42.9 C344.3 50.3 367.4 57.2 370 64.3 C372.6 71.5 352 75.3 349 85.7 C346 96.2 357.2 104.3 351.8 127 C346.4 149.7 328.2 183.6 316.8 221.8 C305.4 260.1 294.2 325 283.2 356.4 C272.2 387.7 262.2 390.8 251 409.9 C239.8 429 223 449.4 216 471.1 C209 492.7 213 528.9 209 539.9 C205 550.8 195.7 541.1 192.2 536.8 C188.7 532.5 191.3 525.3 188 513.9 C184.7 502.4 182.6 482 172.6 468 C162.6 454 139.2 445.8 127.8 429.8 C116.4 413.7 107.3 391.5 104 371.7 C100.7 351.8 105.9 330.9 108.2 310.5 C110.5 290.1 111.7 266.4 118 249.4 C124.3 232.3 138.5 220.8 146 208.1 C153.5 195.3 156.3 183.9 162.8 172.9 C169.3 161.9 175.9 155.6 185.2 142.3 C194.5 129.1 210.2 107.4 218.8 93.4 C227.4 79.4 225.3 67.4 237 58.2 C248.7 49.1 277.4 44.7 288.8 38.3 C300.2 32 29 troke-width=\"2.5\"/><text x=\"279\" y=\"189\" font-size=\"23\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#FFFCF6\" stroke-width=\"6\">和平區<\/text><circle cx=\"153\" cy=\"298\" r=\"7\" fill=\"#B5533C\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><text x=\"141\" y=\"306\" font-size=\"23\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#FFFCF6\" stroke-width=\"6\">嘉義<\/text><circle cx=\"118\" cy=\"372\" r=\"7\" fill=\"#B5533C\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><text x=\"106\" y=\"380\" font-size=\"23\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#FFFCF6\" stroke-width=\"6\">臺南<\/text><circle cx=\"159\" cy=\"422\" r=\"7\" fill=\"#B5533C\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><text x=\"147\" y=\"432\" font-size=\"23\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#FFFCF6\" stroke-width=\"6\">屏東<\/text><circle cx=\"31\" cy=\"285\" r=\"7\" fill=\"#B5533C\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><text x=\"31\" y=\"331\" font-size=\"23\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#FFFCF6\" stroke-width=\"6\">澎湖<\/text><\/g><text x=\"52\" y=\"40\" font-size=\"18\" font-weight=\"700\" fill=\"#2F6F8F\" text-anchor=\"middle\">北部<\/text><text x=\"52\" y=\"60\" font-size=\"15\"  fill=\"#2F6F8F\" text-anchor=\"middle\">冬天多雨<\/text><text x=\"410\" y=\"250\" font-size=\"18\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">東部<\/text><text x=\"70\" y=\"388\" font-size=\"18\" font-weight=\"700\" fill=\"#B5533C\" text-anchor=\"middle\">南部<\/text><text x=\"70\" y=\"408\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"middle\">冬天少雨<\/text><text x=\"395\" y=\"392\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">深綠色＝山地<\/text><\/svg>"},{"t":"table","head":["地方","在臺灣的哪裡"],"rows":[["基隆、九份","<b>北部<\/b>"],["宜蘭","東北部"],["臺中","中部"],["嘉義（我們家）、臺南、屏東","<b>南部<\/b>"],["澎湖","西邊海上的小島"]]},{"t":"trap","v":"考卷的選項：「臺南市位於北部」❌、「屏東縣位於東部」❌、「新竹市在臺中市的南方」❌（新竹在臺中的<b>北方<\/b>）。只有「基隆市位於北部」✅。"}]},{"h":"⛰️ 第二步：想地形","body":[{"t":"tiles","v":[{"em":"🏔️","h":"臺中市和平區","p":"在很裡面的高山上，是<b>山地<\/b>。有名的梨山就在那裡。"},{"em":"🍎","h":"樹林多＋種水果","p":"衛星地圖上樹林很多、居民種水果 → <b>山地<\/b>。"},{"em":"🌾","h":"宜蘭平原","p":"<b>平坦廣闊，一望無際<\/b>。"}]},{"t":"guide","v":"臺中「市區」是盆地，可是「和平區」是山地。同一個縣市裡，也會有不同的地形！"}]},{"h":"🌦️ 第三步：想氣候","body":[{"t":"vs","v":[{"h":"🌧️ 北部、東北部的冬天","p":"吹東北季風，<b>常常下雨<\/b><br>基隆、九份、宜蘭"},{"h":"☀️ 南部的冬天","p":"<b>雨很少<\/b>、比較溫暖<br>嘉義、臺南、屏東"}]},{"t":"tiles","v":[{"em":"🏠","h":"九份的黑屋頂","p":"雨多，所以屋頂鋪<b>油毛氈<\/b>（塗了瀝青，可以防水）→ 選「<b>較常下雨<\/b>」。"},{"em":"🥜","h":"澎湖種花生","p":"一整年<b>雨少、風大<\/b>，種不了水稻，所以種比較不怕乾的<b>花生<\/b>。"}]}]},{"h":"⚠️ 是非題：看到這些字要小心","body":[{"t":"chant","v":"完全、一定、全部、都 → 多想一下"},"考卷：「屏東和宜蘭，寒假的氣溫<b>完全<\/b>不一樣。」冬天宜蘭比屏東冷一些，可是只是「有差別」，說「完全不一樣」就太過頭了，所以是 ❌。",{"t":"ask","id":"a4","how":"點一個你覺得對的答案。","q":"題目說某個地方「雨量很少、風很大，是海上的小島」，最可能是哪裡？","o":["基隆","澎湖","九份","宜蘭"],"a":1,"e":"澎湖是西邊海上的小島，雨少、風大。基隆、九份、宜蘭都是雨多的地方。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"想再聽一次嗎？📘 課本的照康軒課本講；📝 考前的是老師帶全班對考題。挑一支就好。"},{"t":"yt","id":"tXL21VtkZs0","title":"1-2 家鄉的地形","who":"麥斯","tag":"地形"},{"t":"yt","id":"TaTZyH33msY","title":"1-3 氣候、水資源與生活","who":"麥斯","tag":"氣候"},{"t":"yt","id":"MuNKucpmXEs","title":"1-3 選擇題抽考講解","who":"市隱 小四教室","tag":"考前"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「臺中市和平區的地形是山地。」→ ⭕。","「九份的居民會使用瀝青製成的油毛氈來搭建屋頂，跟當地氣候的什麼特色有關？」→ <b>較常下雨<\/b>。","「澎湖一整年的雨量比較少，居民比較可能選擇哪一種作物？」→ <b>花生<\/b>。","「衛星模式的地圖上可看見許多樹林，居民大多以種植水果為生，應該位於哪一種地形？」→ <b>山地<\/b>。"]}]}]},{"id":"s4","nav":"🏠 老房子","intro":"第四站：<b>老房子和老器物<\/b>。這一站的秘訣只有一個：<b>每個地方、每樣東西，都有自己的工作<\/b>，不要幫它多加。","cards":[{"h":"🏯 三合院：誰做什麼工作？","body":[{"t":"table","head":["地方","它的工作"],"rows":[["<b>正廳<\/b>","供奉神明、<b>祭拜祖先<\/b>"],["護龍","家人住的房間（左大右小）"],["稻埕","曬稻穀、辦喜事請客"],["廚房","煮飯、燒菜"],["農具間","放農具"],["水池","養魚、洗東西"]]},{"t":"trap","v":"考卷：「正廳……同時也具有防風、防盜等功能。」❌ 前半句是對的，後半句偷偷多加了正廳沒有的工作。<b>一句話只要有一小段錯，整句就是錯的<\/b>。"},{"t":"guide","v":"「左大右小」：排行比較大的住<b>左<\/b>護龍，比較小的住<b>右<\/b>護龍。這題你有答對，很棒！"}]},{"h":"🧺 老器物配對：別寫反了","body":[{"t":"table","head":["器物","用途"],"rows":[["<b>菜櫥<\/b>","<b>放<\/b>菜餚（櫥＝櫃子）"],["<b>灶<\/b>","<b>煮<\/b>菜、蒸粿（下面燒火）"],["砧板","切菜、切肉的墊子"],["水桶","裝水、提水"],["木杵","<b>搗小米<\/b>（不能炒菜）"],["魚筌","用竹子、藤編的捕魚工具"],["竹葉","漢人用來包裝粿"]]},{"t":"trap","v":"「木杵可以搗小米，<b>也可以用來炒菜<\/b>」❌ 又是後半句多加的！木頭放到火上會燒起來。"},{"t":"ask","id":"a5","how":"點一個你覺得對的答案。","q":"「用來放置菜餚的器物」是哪一個？","o":["灶","砧板","菜櫥","水桶"],"a":2,"e":"菜櫥是放菜的櫃子。灶是用來煮菜、蒸粿的。"}]},{"h":"🌿 原住民族：善用一草一木","body":["早期原住民族用身邊的<b>木頭、竹子、藤<\/b>做出好用的器物，這叫<b>就地取材<\/b>。所以「善用大自然的一草一木，製作出實用的器物」是 ⭕。",{"t":"vs","v":[{"h":"✅ 大自然裡拿得到","p":"木頭、竹子、藤條"},{"h":"❌ 以前沒有","p":"塑膠、玻璃、不鏽鋼、人造纖維"}]}]},{"h":"💧 水庫和湖泊","body":[{"t":"vs","v":[{"h":"🏗️ 水庫","p":"<b>人蓋的<\/b>（政府興建）<br>把水存起來，給大家穩定的用水"},{"h":"🏞️ 湖泊","p":"一大片水域<br>旁邊常有步道、自行車道，可以休閒"}]},{"t":"guide","v":"題目有「政府<b>興建<\/b>」「穩定的用水」→ 填水庫。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"想再聽一次嗎？📘 課本的照康軒課本講；📝 考前的是老師帶全班對是非題。挑一支就好。"},{"t":"yt","id":"TmrIfY1oEEo","title":"2-1 傳統住屋與生活","who":"麥斯","tag":"住屋"},{"t":"yt","id":"j8Dyi-J7iXY","title":"2-2 器物與生活","who":"麥斯","tag":"器物"},{"t":"yt","id":"tiXSu9VM2ZM","title":"2-1 是非題抽考講解","who":"市隱 小四教室","tag":"考前"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「正廳是供奉神明、祭拜祖先的地方，同時也具有防風、防盜等功能。」→ ❌。","「在漢人傳統的生活中，會利用哪一種東西來包裝粿？」→ <b>竹葉<\/b>。","「用木頭做成的木杵，可以用來搗小米，也可以用來炒菜。」→ ❌。","「政府興建（　）可提供居民們穩定的用水」→ <b>水庫<\/b>。"]}]}]},{"id":"s5","nav":"✏️ 詞性","intro":"第五站：<b>詞性<\/b>。國語這次錯的題目，有一半是分不出名詞和動詞。教你一招，馬上分得出來！","cards":[{"h":"🎬 動畫課第 3 集","body":[{"t":"video","v":"exam4r-ep3.mp4?v=1112","poster":"exam4r-ep3.jpg","cap":"加「正在」說得通是動詞；人、事、物、地方的名字是名詞"}]},{"h":"🏷️ 名詞、動詞、形容詞","body":[{"t":"tiles","v":[{"em":"🏷️","h":"名詞＝名字","p":"人、事、物、地方的名字：媽媽、月亮、學校、懷裡、一項研究。"},{"em":"🏃","h":"動詞＝動作","p":"正在做的事：跑、吃、開、拉住、守衛。"},{"em":"🎨","h":"形容詞＝怎麼樣","p":"形容樣子：美麗的、忠實的、緊緊的。"}]},{"t":"chant","v":"名詞是什麼東西，動詞是做什麼事"}]},{"h":"🔧 一招分辨：前面加「正在」","body":[{"t":"list","v":["① 在詞的前面加上「<b>正在<\/b>」","② 念念看，說得通 → <b>動詞<\/b>","③ 說不通，而且它是人、事、物、地方的名字 → <b>名詞<\/b>"]},{"t":"vs","v":[{"h":"一起「研究」植物","p":"<b>正在<\/b>研究植物 ✅ 說得通<br>→ <b>動詞<\/b>"},{"h":"完成這項「研究」","p":"完成<b>正在<\/b>研究 ❌ 說不通<br>前面有「這項」→ <b>名詞<\/b>"}]},{"t":"trap","v":"同一個詞放在不同的句子，詞性可能不一樣！不能只看字，要<b>把整句讀完<\/b>。看到「這項、這個、一場、一件」後面的詞，通常是名詞。"},{"t":"ask","id":"a6","how":"點一個你覺得對的答案。","q":"「這場『比賽』很精彩。」句子裡的「比賽」是什麼詞性？","o":["動詞","名詞","形容詞","數量詞"],"a":1,"e":"前面有「這場」，「比賽」是一件事情的名字，所以是名詞。"},{"t":"ask","id":"a7","how":"點一個你覺得對的答案。","q":"「我們明天要『比賽』跑步。」句子裡的「比賽」是什麼詞性？","o":["動詞","名詞","形容詞","數量詞"],"a":0,"e":"「正在比賽跑步」說得通，是在做一件事，所以是動詞。"}]},{"h":"🧩 找出不一樣的那一個","body":["考卷：哪一個「」裡的詞，詞性和其他三個不同？",{"t":"table","head":["選項","加「正在」","詞性"],"rows":[["① 花朵成群結隊的「開」","正在開 ✅","動詞"],["② 忠實的「守衛」著","正在守衛 ✅","動詞"],["③ 媽媽的「<b>懷裡<\/b>」","正在懷裡 ❌","<b>名詞<\/b>（地方的名字）"],["④ 緊緊的「拉住」","正在拉住 ✅","動詞"]]},{"t":"guide","v":"這種題目不要用猜的，<b>四個都試一次<\/b>，不一樣的那個自己就跑出來了。"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「短文中的兩個『研究』，它們的詞性分別是什麼？」→ 第一個是動詞，第二個是名詞，選「<b>動詞、名詞<\/b>」。","「下面選項『』中的字詞，哪一個詞性和其他三個不同？」→ 四個都加「正在」試一次。"]}]}]},{"id":"s6","nav":"📖 讀題寫字","intro":"第六站：<b>讀題和寫字<\/b>。課文理解題和國字，都是「慢一點就會對」的分數。","cards":[{"h":"🔎 課文理解題：四個選項都要對課文","body":["考卷：根據〈鏡頭下的家鄉〉，下面敘述哪個正確？",{"t":"table","head":["選項","和課文對一對"],"rows":[["① 作者<b>長大後<\/b>，每到假日會跟<b>爺爺、奶奶<\/b>四處走訪","❌ 課文是<b>小時候<\/b>和<b>爸媽<\/b>"],["② 作者不記得所拍下的照片內容","❌ 作者印象很深刻"],["③ 火車沿著軌道<b>北上<\/b>……","❌ 課文是<b>南下<\/b>回雲林"],["④ 作者形容白鷺鷥陪伴著農人的身影如詩如畫","✅"]]},{"t":"chant","v":"圈出人、時間、方向，回課文對一對","sub":"一個詞不對，整句就錯"},{"t":"trap","v":"錯的選項常常只改<b>一兩個字<\/b>：南下改北上、小時候改長大後、爸媽改爺爺奶奶。看到很像課文的句子，更要一個字一個字看。"}]},{"h":"✍️ 這次寫錯的字","body":[{"t":"table","head":["字","注音","語詞","提醒"],"rows":[["擊","ㄐㄧˊ","攻擊","筆畫多，下面是「手」"],["源","ㄩㄢˊ","能源、水源","三點水＋原"],["產","ㄔㄢˇ","產生","上面不是「立」，中間有一撇"],["抹","ㄇㄛˇ","抹上顏色","抹布念 ㄇㄚ，塗抹念 ㄇㄛˇ"]]},{"t":"write","id":"w1","how":"用手指寫在格子裡，或寫在紙上按「📷 拍照交」，寫完按「對答案」。","q":"看注音寫國字：① 攻ㄐㄧˊ　② 能ㄩㄢˊ　③ ㄔㄢˇ生　④ ㄇㄛˇ上顏色　⑤ 形ㄓㄨㄤˋ","grid":5,"ans":"① 擊　② 源　③ 產　④ 抹　⑤ 狀"}]},{"h":"💬 造句：寫完念一遍","body":["你的造句意思都對，只是「能源」的「源」寫錯了。造句寫完要做兩件事：",{"t":"list","v":["① 小聲念一遍，看句子順不順","② 一個字一個字檢查，有沒有不確定的字"]},{"t":"text","id":"x1","how":"打字就好，寫完會存起來。","q":"用「由於……因而……」造一個和「能源」有關的句子（20 個字以上）。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"想再聽一次第三課嗎？"},{"t":"yt","id":"A1odOq-akRI","title":"課本 P24、P25 講解","who":"市隱","tag":"課本"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「根據〈鏡頭下的家鄉〉一課，下面敘述哪個正確？」→ 四個選項都回課文對一次。","「依序寫出國字和注音」→ 寫完回頭看一次筆畫多的字（擊、鷹、護）。"]}]}]},{"id":"paper","nav":"📝 白紙練習卷","intro":"最後一關！闖關做完後，拿一張<b>白紙<\/b>，把練習卷寫一遍。這次不趕時間，慢慢寫。","cards":[{"h":"📄 練習卷（跟考卷同題型）","body":["<a href=\"exam4r-practice.pdf\" target=\"_blank\" rel=\"noopener\"><b>👉 打開練習卷 PDF<\/b><\/a>（會開新分頁；最後一頁是解答，<b>寫完才看<\/b>）",{"t":"list","v":["一、自然：月相配對、選擇題、勾選題","二、社會：是非題、選擇題、配合題","三、國語：詞性、看注音寫國字、讀題"]},{"t":"guide","v":"寫完先自己檢查：月相先看亮哪一邊；是非題找「完全、也可以」這種字；詞性加「正在」。錯的題回去看那一站！"}]},{"h":"📷 交作業","body":[{"t":"write","id":"w2","how":"寫完的白紙按「📷 拍照交」，一頁拍一張。","q":"把寫好的練習卷拍照交上來。"},{"t":"text","id":"x2","how":"打幾個字就好。","q":"這三科裡，你覺得自己進步最多的是哪一個地方？"},{"t":"submit","how":"全部做完，按這裡傳給爸爸！"}]}]}],"flash":[["同一個晚上，月亮的形狀會變嗎？","不會。只有位置由東往西移"],["月相一輪大約幾天？","29～30 天（一個農曆月）"],["右半邊亮的月亮","上弦月，農曆 7、8 日"],["左半邊亮的月亮","下弦月，農曆 22、23 日"],["右邊亮的細月牙","眉月，農曆 3 日前後"],["左邊亮的細月牙","殘月，農曆 27 日前後"],["上半個月亮哪一邊？","右邊（西邊）"],["漂浮性植物的本領","葉片或葉柄有通氣組織，根不碰泥土"],["水蘊草是哪一種水生植物？","沉水性；莖和葉柔軟"],["小時候用鰓、長大用肺","青蛙"],["基隆、九份在臺灣的哪裡？","北部，冬天常下雨"],["九份屋頂鋪油毛氈是因為","比較常下雨，要防水"],["澎湖雨少風大，種什麼？","花生"],["臺中市和平區是什麼地形？","山地"],["樹林多、居民種水果","山地"],["正廳的工作","供奉神明、祭拜祖先"],["菜櫥和灶","菜櫥放菜；灶煮菜、蒸粿"],["木杵用來做什麼？","搗小米（不能炒菜）"],["政府興建、提供穩定用水","水庫"],["怎麼分辨動詞？","前面加「正在」，說得通就是動詞"],["「完成這項研究」的研究","名詞"],["是非題看到「完全、一定、都」","多想一下，常常是錯的"]],"order":[{"t":"農曆一個月的月相（從初一開始）","items":["看不到月亮（朔）","眉月（右邊細細）","上弦月（右半邊亮）","滿月","下弦月（左半邊亮）","殘月（左邊細細）"]},{"t":"地名題三步驟","items":["先找它在臺灣的位置","再想那裡的地形","最後想那裡的氣候"]},{"t":"青蛙長大的順序","items":["卵","蝌蚪（用鰓呼吸）","長出後腳","長出前腳","青蛙（用肺呼吸）"]}],"quizHow":"📝 怎麼作答：每題<b>點一個<\/b>你覺得對的答案，答對就擦掉怪獸一下，馬上會告訴你原因，再按「下一關」。三隻怪獸：🌱 迷糊叉叉怪 → 📘 半月影子怪 → 🔥 完全大魔王，<b>越後面越難<\/b>，被牠躲開很正常！沒答對的題目會放進「📕 錯題」，回去重做到對就能補上最後一擊。進度會自動存起來。","story":{"title":"考卷怪獸大掃除","ava":"🧹","intro":["段考結束那天晚上，三張考卷上的紅色叉叉偷偷跳下來，變成三隻小怪獸，躲進了栗栗的樹洞教室。","栗栗遞給你一塊魔法橡皮擦：「每答對一題，就能擦掉牠一下。把牠們擦乾淨，叉叉就會變成圈圈！」"],"acts":{"看懂":{"name":"迷糊叉叉怪","ava":"❌","intro":"牠最喜歡趁你沒看清楚題目的時候偷襲。牠只會最簡單的幾招，先拿牠暖身。","win":"迷糊叉叉怪被擦得乾乾淨淨，變成一個小圈圈滾走了。"},"課本":{"name":"半月影子怪","ava":"🌗","intro":"牠躲在月亮暗的那一邊，出的都是課本上的招式。看清楚是哪一邊亮再出手。","win":"半月影子怪被月光照到，縮成一顆小星星飛回天上。"},"挑戰":{"name":"完全大魔王","ava":"👾","intro":"最後一關。牠最愛說「完全」「一定」「也可以」來騙人，招式和考卷一樣要多想一步。被牠躲開很正常，之後還能補擦。","win":"完全大魔王大叫一聲「怎麼可能完全被擦掉！」然後就不見了。"}},"end":"三隻怪獸都被你擦掉了。樹洞教室的黑板上，紅色叉叉一個一個變成圈圈，栗栗和熊熊幫你鼓掌。","cont":"還有怪獸帶著最後一點墨水躲進「📕 錯題」。去那裡把錯的題目重做到對，補上最後一擊。"},"quiz":[{"tag":"看懂","s":"同一個晚上，從 7 點到 9 點，月亮的什麼會改變？","o":["形狀","位置","顏色變成綠色","大小變成兩倍"],"a":1,"e":"同一個晚上，月亮只會由東往西換位置，形狀不會變。"},{"tag":"看懂","s":"從這次滿月到下一次滿月，大約要幾天？","o":["7 天","15 天","45 天","29～30 天"],"a":3,"e":"月相一輪大約 29～30 天，就是一個農曆月。15 天只有一半。"},{"tag":"看懂","s":"小時候用鰓呼吸、長大後主要用肺呼吸的動物是哪一個？","o":["青蛙","螃蟹","大肚魚","紅娘華"],"a":0,"e":"蝌蚪用鰓，長成青蛙後用肺。螃蟹、大肚魚一直用鰓；紅娘華用呼吸管。"},{"tag":"看懂","s":"基隆市在臺灣的哪裡？","o":["南部","東部","北部","西邊海上的小島"],"a":2,"e":"基隆在臺灣最上面，是北部。西邊海上的小島是澎湖。"},{"tag":"看懂","s":"三合院裡，祭拜神明和祖先的地方是哪裡？","o":["稻埕","廚房","農具間","正廳"],"a":3,"e":"正廳在最中間，用來供奉神明、祭拜祖先。稻埕是曬稻穀的空地。"},{"tag":"看懂","s":"下面哪一個是「動詞」（表示動作）？","o":["月亮","奔跑","學校","媽媽"],"a":1,"e":"「正在奔跑」說得通，是動作。月亮、學校、媽媽都是名字，是名詞。"},{"tag":"看懂","s":"下面哪一個是「名詞」（人、事、物、地方的名字）？","o":["拉住","吃","書包","跳"],"a":2,"e":"書包是東西的名字。拉住、吃、跳前面都能加「正在」，是動詞。"},{"tag":"課本","s":"在臺灣面向南方，看到月亮右半邊亮，大約是農曆幾日？","o":["7、8 日","15 日","22、23 日","1 日"],"a":0,"e":"右半邊亮是上弦月，在農曆 7、8 日。左半邊亮才是 22、23 日的下弦月。"},{"tag":"課本","s":"農曆 3 日傍晚看到的月亮是什麼樣子？","o":["圓圓的滿月","左半邊亮","右邊亮的細細月牙","完全看不到"],"a":2,"e":"農曆 3 日是眉月，上半個月右邊亮，而且才剛開始，只有細細一條。"},{"tag":"課本","s":"關於漂浮性水生植物（像布袋蓮），哪一個敘述正確？","o":["根長在水底的泥土裡","整株都沉在水裡","水蘊草是代表植物","葉片或葉柄裡有可以裝空氣的通氣組織"],"a":3,"e":"漂浮性植物靠通氣組織浮在水面，根不碰泥土。整株在水裡的是沉水性，水蘊草就是沉水性。"},{"tag":"課本","s":"水蘊草為什麼不容易被水流沖斷？","o":["莖和葉柔軟，會跟著水流擺動","根會漂在水面","葉柄膨大像游泳圈","葉子挺出水面"],"a":0,"e":"水蘊草的莖和葉又細又軟，水流來就跟著擺動，所以不容易斷。"},{"tag":"課本","s":"九份的居民用瀝青製成的油毛氈鋪屋頂，和當地哪一種氣候特色有關？","o":["比較炎熱","比較常下雨","比較少下雨","常常下雪"],"a":1,"e":"九份在北部山坡上，雨很多，油毛氈可以防水。"},{"tag":"課本","s":"澎湖一整年雨量比較少，居民比較可能種哪一種作物？","o":["水稻","茶樹","花生","蓮藕"],"a":2,"e":"花生比較不怕乾。水稻、蓮藕都需要很多水。"},{"tag":"課本","s":"下面的器物和用途，哪一組配對正確？","o":["菜櫥：煮菜、蒸粿","灶：放置菜餚","砧板：裝水、提水","木杵：搗小米"],"a":3,"e":"木杵用來搗小米。菜櫥是放菜的、灶是煮菜的、砧板是切菜的墊子。"},{"tag":"課本","s":"政府興建來儲水、提供居民穩定用水的是哪一個？","o":["湖泊","水庫","溪流","海洋"],"a":1,"e":"水庫是人蓋的，把水存起來給大家用。"},{"tag":"課本","s":"「我們一起『研究』月亮。」句子裡的「研究」是什麼詞性？","o":["動詞","名詞","形容詞","數量詞"],"a":0,"e":"「正在研究月亮」說得通，是在做一件事，所以是動詞。"},{"tag":"課本","s":"「這項『研究』花了一個月才完成。」句子裡的「研究」是什麼詞性？","o":["動詞","形容詞","數量詞","名詞"],"a":3,"e":"前面有「這項」，「研究」是一件事情的名字，所以是名詞。"},{"tag":"挑戰","s":"考卷上有「右邊亮的半圓月亮」和「右邊亮的細月牙」，哪一組日期配對正確？","o":["半圓：農曆 3 日；細月牙：農曆 7 日","半圓：農曆 7 日；細月牙：農曆 3 日","半圓：農曆 22 日；細月牙：農曆 27 日","半圓：農曆 15 日；細月牙：農曆 1 日"],"a":1,"e":"右邊亮都是上半個月。上半個月亮得越多日期越大：細月牙 3 日，半圓 7 日。"},{"tag":"挑戰","s":"左邊亮的細細月牙，最可能出現在農曆幾日？","o":["3 日","7 日","15 日","27 日"],"a":3,"e":"左邊亮是下半個月。只剩細細一條，快到月底了，是 27 日前後的殘月。"},{"tag":"挑戰","s":"老師要到戶外觀察水生生物，下面哪一樣「不需要」帶？","o":["水桶","撈網","零食","放大鏡"],"a":2,"e":"水桶裝撈到的生物、撈網撈生物、放大鏡看細節，都用得到。零食不需要。"},{"tag":"挑戰","s":"下面關於位置的敘述，哪一個正確？","o":["新竹市在臺中市的北方","臺南市在臺灣的北部","屏東縣在臺灣的東部","基隆市在臺灣的南部"],"a":0,"e":"新竹在臺中的北方。臺南、屏東都在南部，基隆在北部。"},{"tag":"挑戰","s":"「正廳是供奉神明、祭拜祖先的地方，同時也有防風、防盜的功能。」這句話對不對？","o":["對，正廳什麼功能都有","不對，正廳是用來曬稻穀的","對，因為正廳在最中間","不對，後半句錯了：防風、防盜不是正廳的工作"],"a":3,"e":"前半句對，後半句多加了正廳沒有的功能。一句話只要有一小段錯，整句就是錯的。"},{"tag":"挑戰","s":"衛星地圖上看到一個地方地勢很高、到處是樹林，居民大多在山坡上種水果維生，這裡最可能是哪一種地形？","o":["平原","山地","盆地","臺地"],"a":1,"e":"地勢高、樹林多、在山坡上種水果，是山地的特色，像臺中市和平區。"},{"tag":"挑戰","s":"哪一個「」裡的詞，詞性和其他三個不一樣？","o":["小狗「追」著球","弟弟「打開」窗戶","奶奶的「房間」很乾淨","我「幫忙」洗碗"],"a":2,"e":"追、打開、幫忙前面都能加「正在」，是動詞。房間是地方的名字，是名詞。"},{"tag":"挑戰","s":"先讀這段話：","src":"火車沿著軌道南下，窗外的風景從高樓變成平房與農田。","s2":"下面哪一個敘述和這段話「不一樣」？","o":["火車往南開","窗外先看到高樓","後來看到平房和農田","火車沿著軌道北上"],"a":3,"e":"這段話寫的是「南下」，選項把它改成「北上」。錯的選項常常只改一兩個字。"},{"tag":"挑戰","s":"「屏東和宜蘭，寒假的氣溫完全不一樣。」這句話錯在哪裡？","o":["兩地氣溫只是有差別，說「完全」太過頭了","屏東和宜蘭的氣溫一模一樣","宜蘭冬天比屏東熱很多","屏東在臺灣的北部"],"a":0,"e":"冬天宜蘭比屏東冷一些，只是有差別。看到「完全、一定、都」要多想一下。"}],"sources":[{"t":"麥斯「小四自然(上)翰林」「小四社會(上)康軒」播放清單（名師影片）","u":"https://www.youtube.com/@cornlee/playlists"},{"t":"市隱「115-1」四上各科播放清單（名師影片）","u":"https://www.youtube.com/@市隱/playlists"},{"t":"九份黑屋頂（油毛氈）與多雨氣候","u":"https://vocus.cc/article/656f1f9ffd89780001e0fa0e"}]};
// 作答同步（學習小站 study-hub）：網頁 → ntfy.sh → Mac mini。renderPage／renderHome 會把整份檔案嵌進頁面。
// 鑰匙：第一次用「網址#k=鑰匙」打開任何一頁就記在這台平板（同網域每頁共用），#k=off 取消；沒有鑰匙時完全不作用。
// 頻道與加密鑰匙都由鑰匙推出（和 Mac 的 study_hub.py 同一套規則）：
//   收件 sh-<sha256("in:"+鑰匙) 前 24 碼>、回條 sh-<sha256("st:"+鑰匙) 前 24 碼>、AES-GCM 鑰匙 sha256("enc:"+鑰匙)
// 作答先排進本機佇列，送出後等 Mac 在回條頻道確認才刪；沒網路或 Mac 沒回，20 分鐘後重送（Mac 會去重）。
const HUB = (() => {
  const NT = "https://ntfy.sh/", QK = "hub_q", MAXB = 2700; // 一則訊息的明文上限（加密＋base64 後要在 4096 以內）
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  // 首頁不清掉網址上的鑰匙：iPad「加入主畫面」的圖示和 Safari 分開存資料，網址帶著鑰匙，圖示打開時才會自己記住
  const takeKey = () => {
    const m = location.hash.match(/[#&]k=([\w-]+)/);
    if (!m) return false;
    put("hub_k", m[1] === "off" ? null : m[1]);
    if (typeof DATA !== "undefined") history.replaceState(null, "", location.pathname + location.search);
    return true;
  };
  takeKey();
  addEventListener("hashchange", () => { if (takeKey()) location.reload(); }); // 頁面已開著時點連結只會換 # 後面，不會重新載入
  const KEY = get("hub_k"), ON = !!(KEY && window.crypto && crypto.subtle && window.fetch);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const sha = (s) => crypto.subtle.digest("SHA-256", enc.encode(s));
  const b64u = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  let ch = null;
  const chan = () => ch || (ch = Promise.all([sha("in:" + KEY), sha("st:" + KEY), sha("enc:" + KEY)]).then(async ([a, b, c]) =>
    ({ tin: "sh-" + hex(a).slice(0, 24), tst: "sh-" + hex(b).slice(0, 24), k: await crypto.subtle.importKey("raw", c, "AES-GCM", false, ["encrypt", "decrypt"]) })));
  async function seal(k, u8) {
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, u8));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  const open = async (k, u8) => new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, k, u8.slice(12)));
  const DEV = get("hub_dev") || (() => { const d = Math.random().toString(36).slice(2, 10); put("hub_dev", d); return d; })();
  const queue = () => { try { return JSON.parse(get(QK) || "[]"); } catch (e) { return []; } };
  const save = (a) => put(QK, JSON.stringify(a.slice(-500)));
  const pg = () => (typeof DATA !== "undefined" && DATA && DATA.id) || "home";

  // 記一筆作答；key 相同又還沒送出的舊筆會被取代（打字題只送最後的內容）。題目代號用 id2，id 是這筆事件自己的
  let lastTs = 0;
  function log(t, d = {}, wait = 2500) {
    if (!ON) return;
    const a = queue(), ts = lastTs = Math.max(Date.now(), lastTs + 1); // 同一毫秒連點兩下也要分得出先後
    if (d.key) { const i = a.findIndex((e) => !e.s && e.key === d.key); if (i >= 0) a.splice(i, 1); }
    a.push({ ...d, id: ts.toString(36) + Math.random().toString(36).slice(2, 6), ts, pg: pg(), t, s: 0 });
    save(a); soon(wait); ui();
  }
  let tm = null, busy = false;
  const soon = (ms) => { clearTimeout(tm); tm = setTimeout(flush, ms); };
  async function flush(keepalive) {
    if (!ON || busy || navigator.onLine === false) return;
    busy = true;
    try {
      const c = await chan(), now = Date.now(), todo = queue().filter((e) => !e.s || now - e.s > 20 * 60e3);
      while (todo.length) {
        const batch = []; let size = 0;
        while (todo.length) {
          const { s, key, ...ev } = todo[0], j = JSON.stringify(ev), n = enc.encode(j).length;
          if (batch.length && size + n > MAXB) break;
          batch.push({ id: ev.id, j }); size += n; todo.shift();
        }
        const body = b64u(await seal(c.k, enc.encode(`{"v":1,"dev":"${DEV}","ev":[${batch.map((x) => x.j).join(",")}]}`)));
        const r = await fetch(NT + c.tin, { method: "POST", body, keepalive: !!keepalive });
        if (!r.ok) break;
        const ids = new Set(batch.map((x) => x.id)), t = Date.now(), cur = queue();
        cur.forEach((e) => { if (ids.has(e.id)) e.s = t; }); save(cur);
      }
      if (!keepalive) { setTimeout(poll, 8000); setTimeout(poll, 30000); }
    } catch (e) {} finally { busy = false; ui(); }
  }
  // 讀 Mac 的回條：確認收到的就從佇列刪掉
  async function poll() {
    if (!ON) return;
    try {
      const c = await chan(), r = await fetch(NT + c.tst + "/json?poll=1&since=" + (get("hub_since") || "12h"));
      if (!r.ok) return;
      const acked = new Set();
      for (const ln of (await r.text()).split("\n")) {
        let msg; try { msg = JSON.parse(ln); } catch (e) { continue; }
        if (msg.event !== "message") continue;
        put("hub_since", msg.id);
        try { const o = JSON.parse(dec.decode(await open(c.k, unb64u(msg.message)))); (o.ack || []).forEach((x) => acked.add(x)); if (o.at) put("hub_last", o.at); } catch (e) {}
      }
      if (acked.size) save(queue().filter((e) => !acked.has(e.id)));
    } catch (e) {} finally { ui(); }
  }
  // 整個檔案（作答報告圖）加密後當 ntfy 附件上傳；成功回 true
  async function sendFile(u8, meta) {
    if (!ON) return false;
    try {
      const c = await chan(), m2 = b64u(await seal(c.k, enc.encode(JSON.stringify({ v: 1, dev: DEV, pg: pg(), ts: Date.now(), ...meta }))));
      const r = await fetch(NT + c.tin + "?filename=r.bin&message=" + m2, { method: "POST", body: new Blob([await seal(c.k, u8)], { type: "text/plain" }) });
      return r.ok;
    } catch (e) { return false; }
  }
  // 頁尾一行：讓孩子知道作答會傳給爸爸、同步到哪
  function ui() {
    const el = document.getElementById("hubst"); if (!el) return;
    if (!ON) { el.textContent = ""; return; }
    const n = queue().filter((e) => !e.s).length, last = get("hub_last");
    el.textContent = "📡 你的作答會自動傳給爸爸" + (n ? `・有 ${n} 筆等網路，連上會自動補傳` : last ? `・已同步（${last}）` : "");
  }
  if (ON) {
    addEventListener("online", () => flush());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(true); else poll(); });
    setInterval(() => { if (document.visibilityState === "visible") flush(); }, 60000);
    setTimeout(() => { flush(); poll(); }, 1500);
  }
  return { on: ON, log, sendFile, ui };

 return{me,add,render,importOld,goal,today,pending:()=>did()===0&&due().length>0}})();
// 「這週幾次」：內容檔有 goal（例 3）才顯示；當天有作答就算一次，不要求每天都做
function mark(){if(!DATA.goal||PRINT)return;const d=REV.today();S.days=S.days||[];if(S.days.includes(d))return;S.days.push(d);save();
 const g=document.querySelector(".goal");if(g)g.outerHTML=REV.goal();if(S.days.length===DATA.goal){toast("🎯 這週的 "+DATA.goal+" 次全部完成！");boom();SFX.play("win")}}
// ---------- print ----------
function printQuiz(){const Q=qList();return `<div class="card"><h2>⚔️ 練習題</h2>${DATA.story&&DATA.story.intro?`<p>📖 ${[].concat(DATA.story.intro).join(" ")}</p>`:""}${Q.map((q,i)=>`${LV[q.tag]&&(i===0||Q[i-1].tag!==q.tag)?`<h3>${LV[q.tag][0]} ${LV[q.tag][1]}：${LV[q.tag][2]}</h3>`:""}<div class="qbox"><div class="stem">${i+1}. ${q.tag&&!LV[q.tag]?`<span class="tag">${q.tag}</span>`:""}${q.s}</div>${q.src?srcBox(q)+`<div class="stem">${q.s2||""}</div>`:""}<div>${q.o.map((o,j)=>`(${L[j]}) ${o}`).join("　")}</div></div>`).join("")}</div>`}
function printKey(){return `<div class="card"><h2>✅ 解答與解析</h2>${qList().map((q,i)=>`<p><b>${i+1}. (${L[q.a]})</b> ${q.e}</p>`).join("")}${(DATA.order||[]).map(g=>`<p><b>${g.t}</b>：${g.items.join(" → ")}</p>`).join("")}</div>`}
// ---------- 開始：一定放在檔尾，所有 let／const 都宣告好之後才產生頁面、開第一個分頁 ----------
// 記住上次的分頁：iPad 常在背景把網頁重新載入，不記的話每次都跳回「出發」
render();
// 有到期的複習題時，當天第一次打開先回「出發」頁（只跳一次，之後照樣記住分頁）
if(!PRINT){const home1=REV.pending()&&S.rvDay!==REV.today();if(home1){S.rvDay=REV.today();save()}
 show(!home1&&pages.some(p=>p.id===S.tab)?S.tab:"home");HUB.log("open",{tab:S.tab||"home"},4000);REV.importOld()}
