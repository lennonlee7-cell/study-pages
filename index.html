<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFCF6"><title>學習小站</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>:root{--ink:#3E3A39;--paper:#FFFCF6;--coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--green:#B9DAA5;--coral-soft:#FCE7E2;--yellow-soft:#FDF3D6;--mizu-soft:#E2F1F7;--green-soft:#E8F3E0;--muted:#7C7571;--bw:3px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 "Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
h1,h2{font-weight:400}a{color:inherit;text-decoration:none}
header{border-bottom:var(--bw) solid var(--ink)}.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:10px 16px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:21px}
h1{margin:0;font-size:21px}main{max-width:880px;margin:0 auto;padding:18px 16px 40px}
.art{display:block;width:72px;height:72px;flex:none}.art.sm{width:40px;height:40px}.art.md{width:54px;height:54px}
.stamp{display:grid;place-items:center;background:#fff;border:var(--bw) solid var(--ink);border-radius:50%}
.float{animation:float 3.4s ease-in-out infinite;transform-origin:50% 90%}.d2{animation-delay:-1.2s}.d3{animation-delay:-2.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
.hero{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border:var(--bw) solid var(--ink);border-radius:28px;padding:16px 18px;margin:0 0 8px}
.hero .txt{flex:1;min-width:0}.hero h2{font-size:25px;margin:0 0 2px;line-height:1.4}.hero p{margin:0;color:var(--muted);font-size:15px}
.pics{flex:none;position:relative;width:140px;height:124px}.pics .stamp{position:absolute;right:4px;bottom:0;width:104px;height:104px}.pics .stamp .art{width:80px;height:80px}
.pics .s1{position:absolute;left:0;top:0}.pics .s2{position:absolute;right:-6px;top:-10px}
h2.kid{display:flex;align-items:center;gap:10px;font-size:22px;margin:24px 0 10px}h2.kid .stamp{width:48px;height:48px}h2.kid .stamp .art{width:34px;height:34px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.it{display:flex;flex-direction:column;border:var(--bw) solid var(--ink);border-radius:24px;background:var(--coral-soft);overflow:hidden;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.it:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.it:nth-child(4n+2){background:var(--mizu-soft)}.it:nth-child(4n+3){background:var(--green-soft)}.it:nth-child(4n){background:var(--yellow-soft)}
.go{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 10px;flex:1}
.ic{flex:none;width:54px;height:54px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:27px;line-height:1}
.tx{min-width:0;display:flex;flex-direction:column;gap:5px}.t{font-size:19px;line-height:1.45}.tx small{color:var(--muted);font-size:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:13px;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 9px}.chip.y{background:var(--yellow)}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px dashed var(--ink);background:#fff;padding:7px 16px;font-size:14px;color:var(--muted)}
.new{display:inline-block;background:var(--coral);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:8px;font-size:12px;line-height:1.6}
.pdf{flex:none;background:var(--mizu);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 12px;line-height:1.8}
.tip{margin:28px 0 0;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:520px){.hero{padding:14px}.hero h2{font-size:21px}.pics{width:96px;height:100px}.pics .stamp{width:84px;height:84px;right:0}.pics .stamp .art{width:62px;height:62px}.pics .s1{width:34px;height:34px}.pics .s2{display:none}.list{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.float{animation:none}.it{transition:none}}</style></head>
