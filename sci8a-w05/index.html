<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFCF6">
<title>學習教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 繪本風（和紙白、3px 墨灰框、珊瑚粉／山吹黃／水色／若竹綠平塗、Huninn 粉圓）。只用淺色底，不做深色模式。 */
:root{--ink:#3E3A39;--paper:#FFFCF6;--coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--green:#B9DAA5;
 --coral-soft:#FCE7E2;--yellow-soft:#FDF3D6;--mizu-soft:#E2F1F7;--green-soft:#E8F3E0;
 --bg-2:#F5EEE2;--muted:#7C7571;--line:#E8DFD2;--accent-text:#B65544;--bw:3px;--r:24px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 "Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
h1,h2,h3,h4,b,strong,th{font-weight:400}
button{font-family:inherit}
/* ---- 頂部 ---- */
header{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:10px 16px 4px}
.logo{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:21px;line-height:1}
.top h1{margin:0;font-size:19px;line-height:1.5;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{flex:none;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:8px;max-width:880px;margin:0 auto;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
nav button.on{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
main{max-width:880px;margin:0 auto;padding:18px 16px 48px}
section{display:none}section.on{display:block;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.97);opacity:0}60%{transform:scale(1.008);opacity:1}100%{transform:scale(1)}}
/* ---- 插圖 ---- */
.art{display:block;width:72px;height:72px;flex:none}
.art.sm{width:40px;height:40px}.art.md{width:54px;height:54px}.art.lg{width:104px;height:104px}
.stamp{display:grid;place-items:center;background:#fff;border:var(--bw) solid var(--ink);border-radius:50%}
.float{animation:float 3.4s ease-in-out infinite;transform-origin:50% 90%}
.float.d2{animation-delay:-1.2s}.float.d3{animation-delay:-2.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
/* ---- 首頁橫幅 ---- */
.hero{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border:var(--bw) solid var(--ink);border-radius:28px;padding:16px 18px;margin:0 0 18px}
.hero .txt{flex:1;min-width:0}
.hero h2{font-size:25px;line-height:1.4;margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:13.5px;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.chip.y{background:var(--yellow)}.chip.c{background:var(--coral)}
.pics{flex:none;position:relative;width:140px;height:124px}
.pics .stamp{position:absolute;right:4px;bottom:0;width:104px;height:104px}
.pics .stamp .art{width:80px;height:80px}
.pics .s1{position:absolute;left:0;top:0}.pics .s2{position:absolute;right:-6px;top:-10px}
/* ---- 卡片與文字 ---- */
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px 20px;margin:0 0 18px}
h2{font-size:23px;line-height:1.45;margin:0 0 8px}
h3{font-size:19px;line-height:1.5;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
h3:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
b{box-shadow:inset 0 -.42em 0 var(--yellow);padding:0 2px}/* 用 box-shadow 畫螢光筆：透明漸層在 PDF 會多一條黑線 */
.card ul,.card ol{padding-left:1.4em}li::marker{color:var(--accent-text)}
.guide{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px}
.who{flex:none;width:60px;text-align:center}
.ava{width:58px;height:58px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:30px;line-height:1;animation:float 3.4s ease-in-out infinite}
.who small{display:block;font-size:12px;line-height:1.3;margin-top:4px;color:var(--muted)}
.bubble{background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;position:relative;min-width:0;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:19px;width:14px;height:14px;background:#fff;border-left:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);transform:rotate(45deg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.tile{border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 14px;background:var(--coral-soft)}
.tile:nth-child(4n+2){background:var(--mizu-soft)}.tile:nth-child(4n+3){background:var(--yellow-soft)}.tile:nth-child(4n){background:var(--green-soft)}
.tile .em{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:25px;line-height:1;margin-bottom:6px}
.tile .em:empty{display:none}
.tile h4{margin:0 0 2px;font-size:18px;line-height:1.5}.tile p{margin:0;font-size:15.5px}
.chant{background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0 18px;font-size:19px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.chant small{display:block;font-size:14.5px;opacity:.85}
.chant b{box-shadow:inset 0 -.42em 0 #fff}
.trap{background:var(--coral-soft);border:var(--bw) dashed var(--ink);border-radius:18px;padding:10px 14px;margin:12px 0;font-size:15.5px}
.trap:before{content:"⚠️ 陷阱題注意";display:inline-block;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin:0 8px 4px 0;font-size:14px;line-height:1.7}
.lab{background:var(--mizu-soft);border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;margin:12px 0}
.lab h4{margin:2px 0 4px;font-size:18px}
.fig{max-width:580px;margin:10px auto;background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden}
.fig svg{width:100%;height:auto;display:block}
main svg:not(.art){max-width:100%;height:auto}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.vs>div{border:var(--bw) solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15.5px;background:var(--coral-soft)}
.vs>div:nth-child(2n){background:var(--mizu-soft)}
.vs h4{margin:0 0 4px;font-size:18px;line-height:1.5}
.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden}
th,td{padding:7px 10px;vertical-align:top;text-align:left;border-bottom:2px solid var(--line)}
th{background:var(--yellow-soft);border-bottom:2px solid var(--ink)}
td+td,th+th{border-left:2px solid var(--line)}
tr:last-child td{border-bottom:0}
.tl{position:relative;padding-left:32px;margin:10px 0}
.tl:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.tl div{position:relative;margin:0 0 12px}
.tl div:before{content:"";position:absolute;left:-31px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink)}
.tl span{display:inline-block;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin-right:6px;font-size:15px}
.vid{width:100%;display:block;background:var(--ink);border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 影片放大、YouTube 名師影片 ---- */
.vbox{position:relative}
.zoom{position:absolute;right:10px;top:10px;z-index:2;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.yt{border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;margin:12px 0}
.yt .scr{position:relative;display:block;width:100%;aspect-ratio:16/9;background:var(--ink);cursor:pointer;overflow:hidden}
.yt .scr img{width:100%;height:100%;object-fit:cover;display:block}
.yt .scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:var(--coral);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:28px;line-height:1;box-shadow:0 4px 0 var(--ink);padding-left:5px}
.yt .dur{position:absolute;left:10px;bottom:10px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;line-height:1.7}
.yt .scr .zoom{top:auto;bottom:10px}.yt .scr.live .zoom{top:10px;bottom:auto}
.ytm{padding:10px 16px 12px;border-top:var(--bw) solid var(--ink)}
.ytm h4{margin:0;font-size:17.5px;line-height:1.5}
.ytm p{margin:2px 0 0;font-size:14.5px;line-height:1.6;color:var(--muted)}
.ytm .tag{color:var(--ink)}
#big{position:fixed;inset:0;z-index:200;background:rgba(40,36,35,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 12px 16px}
#big.on{display:flex}
#big .stage{width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;background:#000;border:var(--bw) solid #fff;border-radius:16px;overflow:hidden}
#big .stage iframe,#big .stage video{width:100%;height:100%;border:0;display:block;background:#000}
#big .bt{color:#fff;font-size:16px;text-align:center;max-width:880px}
#big .x{position:absolute;top:10px;right:12px;font-size:18px;line-height:1.5;border:2px solid var(--ink);background:var(--coral);color:var(--ink);border-radius:999px;padding:4px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
body.big{overflow:hidden}
.pic{max-width:100%;border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 記憶卡 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.flip{perspective:900px;height:140px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .k{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--ink);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;overflow:auto}
.flip .f{background:var(--mizu);font-size:19px}
.flip:nth-child(4n+2) .f{background:var(--coral)}.flip:nth-child(4n+3) .f{background:var(--green)}.flip:nth-child(4n) .f{background:var(--yellow)}
.flip .k{background:#fff;font-size:15.5px;transform:rotateY(180deg)}
/* ---- 闖關 ---- */
.qbox{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px;margin-bottom:14px}
.prog{height:16px;background:var(--bg-2);border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink);transition:width .4s}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted)}
.stem{font-size:19px;white-space:pre-line;margin:8px 0}
.src{background:var(--mizu-soft);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;margin:10px 0;font-size:16px}
.opt{display:block;width:100%;text-align:left;font-size:17px;line-height:1.6;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:10px 16px;margin:10px 0;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.ok{background:var(--green)}
.opt.bad{background:var(--coral);animation:shake .3s}
.opt.pick{background:var(--yellow-soft);box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--ink)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-top:10px;font-size:16px}
.fb.ok{display:block;background:var(--green-soft)}.fb.bad{display:block;background:var(--coral-soft)}
.btn{display:inline-block;font-size:16px;line-height:1.5;border:var(--bw) solid var(--ink);background:var(--coral);color:var(--ink);border-radius:16px;padding:8px 20px;margin-top:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--mizu)}
.say{font-size:14px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:middle;cursor:pointer}
.combo{background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 10px;color:var(--ink)}
.combo:empty{display:none}
.rank{text-align:center;padding:6px 4px}
.rank .deco{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.rank .big{width:116px;height:116px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:58px;line-height:1}
.empty{text-align:center}.empty .art{margin:4px auto 0}
.lvl{border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:2px 0 10px;background:var(--yellow-soft)}
.lvl b{display:block;font-size:18px;box-shadow:none;padding:0}.lvl small{display:block;font-size:14.5px;color:var(--muted);line-height:1.5}
.lv-g{background:var(--green-soft)}.lv-m{background:var(--mizu-soft)}.lv-c{background:var(--coral-soft)}
.lvsum{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0}
.lvchip{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px}
.src svg{display:block;width:100%;max-width:520px;margin:4px auto}
.order{padding:0;margin:8px 0}
.order li{list-style:none;display:flex;align-items:center;border:var(--bw) solid var(--ink);background:#fff;border-radius:16px;padding:8px 14px;margin:10px 0;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.order li.pick{background:var(--yellow-soft);box-shadow:0 0 0 var(--ink);transform:translateY(3px)}
.order li .n{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;margin-right:10px;font-size:15px;line-height:1}
.order li.pick .n{background:var(--yellow)}
.tag{display:inline-block;font-size:13px;line-height:1.6;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
.srcs{font-size:13px;color:var(--muted);margin-top:8px}.srcs a{color:var(--accent-text)}
#boom{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;width:max-content;max-width:calc(100% - 32px);background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-size:16px}
/* ---- 作答區塊 ---- */
.how{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin:10px 0 8px;font-size:15px}
.ask,.fill,.wbox,.tbox,.sub{background:var(--paper);border:var(--bw) dashed var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0}
.fill .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fill .row .btn{margin-top:0}
.fill input,.tbox textarea{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);outline:0}
.fill input:focus,.tbox textarea:focus{box-shadow:0 0 0 3px var(--yellow)}
.fill input{width:9em}.tbox textarea{width:100%;min-height:80px;resize:vertical}
.wcan{width:100%;height:300px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.wtools .btn{margin-top:0}
.wans{margin-top:10px}.wans summary{display:inline-block;list-style:none;cursor:pointer}.wans summary::-webkit-details-marker{display:none}.wans div{font-size:20px;margin-top:10px;line-height:1.7}
.wphoto,.subimg{max-width:100%;border:var(--bw) solid var(--ink);border-radius:16px;margin-top:10px;display:none}
.reveal{background:var(--green-soft);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:12px 0}
/* ---- 音效開關 ---- */
.snd{flex:none;font-size:17px;line-height:1.5;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:0 8px;cursor:pointer}
/* ---- 互動模擬（PhET 等） ---- */
.sim{border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;margin:12px 0}
.sim .scr{position:relative;width:100%;aspect-ratio:4/3;max-height:78vh;background:var(--mizu-soft);display:grid;place-items:center;text-align:center;padding:16px}
.sim .scr.live{padding:0;background:#000;aspect-ratio:1024/618}
.sim .scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sim .simic{width:84px;height:84px;margin:0 auto 4px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:42px;line-height:1}
.sim .scr .btn{margin-top:8px}
.zoom.zl{right:auto;left:10px;background:var(--coral)}
.simm{padding:10px 16px 12px;border-top:var(--bw) solid var(--ink)}
.simm h4{margin:0;font-size:17.5px;line-height:1.5}.simm .srcs{margin-top:0}
.mis{list-style:none;padding:0;margin:8px 0 0}
.mis li{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin:8px 0;background:var(--paper);cursor:pointer;font-size:16px}
.mis li.on{background:var(--green-soft)}
.mis .bx{flex:none;width:26px;height:26px;margin-top:2px;border:2px solid var(--ink);border-radius:8px;background:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
#big .stage.sim{width:100%;max-width:1180px;aspect-ratio:auto;flex:1 1 auto;min-height:0;background:#000}
#big .bt .bm{display:inline-block;margin:2px 8px;font-size:15px}
/* ---- 故事闖關：對手血條、過場 ---- */
.foe{display:flex;align-items:center;gap:12px;background:var(--coral-soft);border:var(--bw) solid var(--ink);border-radius:18px;padding:8px 14px;margin:0 0 12px}
.fava{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:30px;line-height:1}
.foe .fi{flex:1;min-width:0}.foe .fn{font-size:16px;line-height:1.4}
.hp{height:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:3px 0}
.hp i{display:block;height:100%;background:var(--coral);border-right:2px solid var(--ink);transition:width .5s}
.foe small{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
.foe.hit .fava{animation:hit .45s}.foe.dodge .fava{animation:dodge .45s}
@keyframes hit{30%{transform:scale(.78) rotate(-14deg);background:var(--coral)}}
@keyframes dodge{40%{transform:translateX(10px) rotate(8deg)}}
.scene p{text-align:left;margin:8px 0}
.story{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:10px 0;text-align:left}
/* ---- 今日複習、這週幾次 ---- */
.goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--green-soft);border:var(--bw) solid var(--ink);border-radius:18px;padding:8px 14px;margin:0 0 18px;font-size:16px}
.gs{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--muted)}
.gs.on{background:var(--yellow);color:var(--ink)}
.goal small{color:var(--muted);font-size:14px}
#rev{scroll-margin-top:118px}
.rv{background:var(--mizu-soft)}.qbox.rv{background:#fff;box-shadow:0 0 0 4px var(--mizu)}
@media (max-width:520px){
 body{font-size:16.5px}.card{padding:16px}.qbox{padding:16px}
 .hero{padding:14px}.hero h2{font-size:21px}
 .pics{width:96px;height:100px}.pics .stamp{width:84px;height:84px;right:0}.pics .stamp .art{width:62px;height:62px}
 .pics .s1{width:34px;height:34px}.pics .s2{display:none}
}
@media (prefers-reduced-motion:reduce){
 section.on,.float,.ava,.opt.bad,.foe .fava{animation:none}
 .flip .in,.btn,.opt,.order li,.prog i{transition:none}
}
/* ---- 列印（PDF） ---- */
.print body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print header{position:static}.print nav,.print .xp,.print .snd{display:none}
.print .top h1{white-space:normal}
.print section{display:block;animation:none}
.print .float,.print .ava{animation:none}
.print .card{break-inside:auto}
.print h2,.print h3{break-after:avoid}
.print .qbox,.print .tile,.print .fig,.print .chant,.print .trap,.print .vs,.print table,.print .hero{break-inside:avoid}
.print .chant,.print .btn,.print .opt{box-shadow:none}
.print .pbreak{break-before:page}
.print .cards{grid-template-columns:1fr 1fr}
.print .fc{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:15px}
.print .wcan,.print .wtools,.print .sub{display:none}.print .wprint{height:220px;border:2px solid var(--ink);border-radius:12px;background:#fff}.print .wgrid{height:auto;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.print .wgrid span{height:70px;border:1px solid #D8D2C8;padding:2px 6px;font-size:13px;color:#7C7571}.print .wansp{transform:rotate(180deg);font-size:13px;color:#7C7571;margin:8px 0 0}
@page{size:A4;margin:12mm}
</style>
</head>

：光從空氣鑽進水裡的時候，會<b>轉彎<\/b>。泳池看起來比較淺、筷子看起來斷掉，都是它搞的鬼。","cards":[{"h":"🎬 動畫課第 1 集","body":[{"t":"video","v":"w05-ep1.mp4?v=1118","poster":"w05-ep1.jpg","cap":"光為什麼會轉彎：折射、偏向法線、看到的魚比較淺。"}]},{"h":"📺 換老師再講一次（選看）","body":[{"t":"guide","v":"韓斯老師這一段前半在講折射定律（後半是透鏡，下一站會用到）。看不懂或想多聽一次再點，挑一支就好。"},{"t":"yt","id":"LR-xGLb1eR8","title":"折射定律、凹透鏡、凸透鏡、光路圖","who":"韓斯頭殼","s":1375,"e":1815,"len":"約 7 分","tag":"重點"},{"t":"yt","id":"4m3Cmv01MTs","title":"國二上 4-3 光的折射（完整一堂課・第 1 段）","who":"國中理化自學","len":"24 分","tag":"完整版"}]},{"h":"🚗 光為什麼會轉彎？","body":["想像你推著一台購物車，從光滑的磁磚<b>斜斜地<\/b>推上地毯。先碰到地毯的那個輪子先變慢，另一邊還在快跑，車頭就歪掉了。","光也一樣。光在空氣裡跑得快，在水和玻璃裡跑得慢。<b>斜斜地<\/b>從一種介質進到另一種介質，速率一變，方向就跟著偏折。這叫做光的<b>折射<\/b>。",{"t":"tiles","v":[{"em":"🌬️","h":"空氣（和真空差不多）","p":"光跑得最快，每秒約 30 萬公里。"},{"em":"💧","h":"水","p":"比較慢，大約是空氣中的四分之三。"},{"em":"🧊","h":"玻璃","p":"更慢，大約是空氣中的三分之二。"}]},{"t":"chant","v":"光速：空氣 ＞ 水 ＞ 玻璃","sub":"速率改變，是折射的原因"}]},{"h":"📐 折射的規則","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 250\" role=\"img\" aria-label=\"光從空氣斜射進水裡，折射線偏向法線，折射角小於入射角\"><defs><marker id=\"f1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"f2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#2F7FA3\"/><\/marker><marker id=\"f3\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#D8D4CC\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"250\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"0\" y=\"118\" width=\"470\" height=\"132\" fill=\"#D5EAF4\"/><rect x=\"0\" y=\"236\" width=\"470\" height=\"14\" rx=\"0\" fill=\"#D5EAF4\"/><line x1=\"20\" y1=\"118\" x2=\"450\" y2=\"118\" stroke=\"#3E3A39\" stroke-width=\"3\" /><line x1=\ -anchor=\"middle\">入射角、折射角都是 0°<\/text><\/svg>"},{"t":"vs","v":[{"h":"快 → 慢（空氣 → 水、空氣 → 玻璃）","p":"折射線<b>偏向法線<\/b>，折射角 ＜ 入射角。"},{"h":"慢 → 快（水 → 空氣、玻璃 → 空氣）","p":"折射線<b>偏離法線<\/b>，折射角 ＞ 入射角。"}]},{"t":"chant","v":"哪一邊跑得慢，哪一邊的角就小","sub":"慢的那一邊，光線比較貼近法線"},{"t":"trap","v":"<b>垂直<\/b>射入界面時，光<b>不會偏折<\/b>（入射角、折射角都是 0°）。但是它的速率還是變了，只是方向沒變。"},{"t":"h3","v":"換你接著做：光從空氣射向水面，光和水面的夾角是 30°"},{"t":"fill","id":"f1","q":"① 入射角是幾度？","ans":["60"],"unit":"°","how":"打數字，再按「對答案」","hint":"入射角是和法線的夾角：90 − 30","e":"90° − 30° ＝ 60°。和上週反射的陷阱一樣：角度看法線，不看界面。"},{"t":"ask","id":"a1","q":"② 這道光進到水裡之後，折射角會是下面哪一種？","o":["大於 60°","等於 60°","小於 60°"],"a":2,"how":"點一個，馬上告訴你對不對","e":"空氣 → 水是快 → 慢，折射線偏向法線，所以折射角小於入射角（60°）。"}]},{"h":"🔁 光路可以倒著走","body":["如果光沿著原來的折射線<b>倒著射回去<\/b>，它會沿著原來的入射線出去。這叫做<b>光的可逆性<\/b>。","所以「空氣 → 水」的圖倒過來看，就是「水 → 空氣」的圖，不用背兩次。",{"t":"tiles","v":[{"em":"🎵","h":"折射時不變的","p":"<b>頻率<\/b>不變（光的顏色不變）。"},{"em":"🏃","h":"折射時會變的","p":"<b>速率<\/b>改變，斜射時<b>方向<\/b>也改變。"}]}]},{"h":"🐟 水裡的魚，比你看到的還要深","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 262\" role=\"img\" aria-label=\"從岸上看水裡的魚，看到的像比魚真正的位置淺\"><defs><marker id=\"v1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"262\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"0\" y=\"104\" width=\"470\" height=\"156\" fill=\"#D5EAF4\"/><line x1=\"0\" y1=\"104\" x2=\"470\" y2=\"104\" stroke=\"#3E3A39\" stroke-width=\"3\" /><polyline points=\"318,214 283.1,153.5 254.5,104\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"3\" marker-mid=\"url(#v1)\"/><polyline points=\"254.5,104 216.5,61.3 185.3,26.3\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"3\" marker-mid=\"url(#v1)\"/><line x1=\"254.5\" y1=\"104\" x2=\"318\" y2=\"175.3\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"/><g ><ellipse cx=\"318\" cy=\"214\" rx=\"22\" ry=\"11\" fill=\"#F2A497\" stroke=\"#3E3A39\" stroke-width=\"2.5\" /><path d=\"M338 214 l14 -9 v18z\" fill=\"#F2A497\" stroke=\"#3E3A39\" stroke-width=\"2.5\"  stroke-linejoin=\"round\"/><circle cx=\"306\" cy=\"211\" r=\"2.2\" fill=\"#3E3A39\"/><\/g><g opacity=\"0.95\"><ellipse cx=\"318\" cy=\"175.3\" rx=\"22\" ry=\"11\" fill=\"#fff\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><path d=\"M338 175.3 l14 -9 v18z\" fill=\"#fff\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\" stroke-linejoin=\"round\"/><circle cx=\"306\" cy=\"172.3\" r=\"2.2\" fill=\"#2F7FA3\"/><\/g><circle cx=\"173.3\" cy=\"16.3\" r=\"13\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><circle cx=\"177.3\" cy=\"16.3\" r=\"3\" fill=\"#3E3A39\"/><text x=\"173.33147038914117\" y=\"-3.671709135308717\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">眼睛<\/text><text x=\"364\" y=\"180.32469692807643\" font-size=\"14\" font-weight=\"700\" fill=\"#2F7FA3\" text-anchor=\"start\">看到的魚（像）<\/text><text x=\"364\" y=\"219\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">真正的魚<\/text><text x=\"100\" y=\"164\" font-size=\"14\"  fill=\"#2F7FA3\" text-anchor=\"middle\">大腦以為光是<\/text><text x=\"100\" y=\"184\" font-size=\"14\"  fill=\"#2F7FA3\" text-anchor=\"middle\">直直過來的<\/text><text x=\"235\" y=\"250\" font-size=\"16\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">看到的位置比實際的淺：視深 ＜ 實深<\/text><\/svg>"},"魚身上的光從水裡射到空氣，在水面<b>偏離法線<\/b>轉了個彎才進到眼睛。可是大腦以為光是直直過來的，就順著光線往回找，結果找到的位置比真正的魚<b>淺<\/b>。你看到的是魚的<b>虛像<\/b>。",{"t":"tiles","v":[{"em":"🏊","h":"泳池變淺","p":"從岸上看池底，比實際的淺。看起來的深度叫<b>視深<\/b>，視深 ＜ 實深。"},{"em":"🥢","h":"筷子折斷","p":"水裡那一段筷子的像往上移，所以看起來在水面折斷、往上彎。"},{"em":"🎣","h":"叉魚要瞄下面","p":"魚真正的位置比看到的深，魚叉要瞄準看到的魚的<b>下方<\/b>。"},{"em":"🌅","h":"看到的太陽","p":"陽光穿過大氣層時也會折射，所以太陽其實還在地平線下，我們就看到它了。"}]},{"t":"reveal","ref":"g1","v":"筷子沒有彎，是<b>光<\/b>轉彎了。水裡那段筷子的光從水進到空氣時偏折，看起來的位置比實際的高，所以像是斷掉。"},{"t":"trap","v":"反過來，<b>魚從水裡看岸上的人<\/b>，會覺得人比實際的<b>高<\/b>。兩邊看對方，都是往「離界面比較遠」還是「比較近」？記這句：<b>從空氣看水裡，變淺；從水裡看空氣，變高。<\/b>"},{"t":"sim","id":"m1","src":"https://phet.colorado.edu/sims/html/bending-light/latest/bending-light_all.html?locale=zh_TW&screens=1","title":"折射模擬：讓雷射光鑽進水裡","who":"PhET 互動模擬（科羅拉多大學，CC BY 4.0）","how":"第一次打開要等十幾秒。按雷射筆上的紅色按鈕發光，雷射筆可以用手指拖著轉。","missions":["按雷射筆上的<b>紅色按鈕<\/b>：光進到下面的水裡，是偏向中間那條虛線（法線），還是偏離？","把雷射筆拖到<b>正上方<\/b>，讓光垂直射下去：光有沒有轉彎？","把下面的「材料」從「水」改成「<b>玻璃<\/b>」：光彎得比較多還是比較少？","把上面的材料改成「水」、下面改成「<b>空氣<\/b>」（光從水射進空氣）：這次是偏向還是偏離法線？"]}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["生活說法：「光進到水裡會轉彎」。考卷寫法：「光由空氣<b>斜向<\/b>射入水中，因<b>速率改變<\/b>而發生偏折，折射線<b>偏向法線<\/b>」。","考卷常問折射的原因：答案是「光在不同介質中的<b>速率不同<\/b>」。","考卷常問「下列何者<b>不是<\/b>折射造成的」：影子、針孔成像（光的直進）和平面鏡成像（反射）是最常見的答案。","考卷愛用的陷阱字眼：「光由空氣進入水中，<b>必定<\/b>會偏折」→ 錯，垂直射入就不偏折。"]}]}]},{"id":"s2","nav":"② 透鏡成像","intro":"這一站是整章的<b>主角<\/b>，段考一定考。先認識兩種透鏡，再學三條特殊光線，最後用一張「成像總圖」把所有情況收起來。內容比較多，看累了就休息一下再回來。","cards":[{"h":"🎬 動畫課第 2 集","body":[{"t":"video","v":"w05-ep2.mp4?v=1118","poster":"w05-ep2.jpg","cap":"兩種透鏡和三條特殊光線：凸透鏡會聚、凹透鏡發散。"}]},{"h":"🎬 動畫課第 3 集","body":[{"t":"video","v":"w05-ep3.mp4?v=1118","poster":"w05-ep3.jpg","cap":"透鏡成像總圖：物體放在哪一區，就成什麼像。"}]},{"h":"📺 換老師再講一次（選看）","body":[{"t":"guide","v":"想要老師帶著一題一題畫圖的話，這兩支是完整的一堂課。很長，挑一段看就好。"},{"t":"yt","id":"8ceLW89O6-Q","title":"國二上 4-3 透鏡成像（完整一堂課・第 1 段）","who":"國中理化自學","len":"43 分","tag":"完整版"},{"t":"yt","id":"rbWkZU5B9yY","title":"國二上 4-3 透鏡成像（完整一堂課・第 2 段）","who":"國中理化自學","len":"31 分","tag":"完整版"}]},{"h":"🔎 兩種透鏡：凸透鏡和凹透鏡","body":["透鏡是用玻璃或塑膠做的，光穿過它的時候折射兩次（進去一次、出來一次）。摸摸看就能分辨：",{"t":"svg","v":"<svg viewBox=\"0 0 470 238\" role=\"img\" aria-label=\"凸透鏡把平行光會聚到焦點，凹透鏡把平行光發散\"><defs><marker id=\"t1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"t2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" 鏡心的距離<\/b>，就是焦距。"]},{"t":"trap","v":"亮點的溫度很高，紙會燒焦。裝水的寶特瓶、玻璃球也像凸透鏡，放在車上或窗邊曬太陽可能引起火災。"},{"t":"fill","id":"f2","q":"太陽光通過凸透鏡，在透鏡後面 12 cm 的地方聚成最小最亮的點。這個透鏡的兩倍焦距（2F）離鏡心幾公分？","ans":["24"],"unit":"cm","how":"打數字，再按「對答案」","hint":"焦距是 12 cm，兩倍焦距就是 12 × 2","e":"焦距 f ＝ 12 cm，2f ＝ 24 cm"}]},{"h":"✏️ 三條特殊光線（畫圖找像就靠它）","body":["物體上的一點會往四面八方發光，全部畫出來太亂了。只要挑其中<b>走法最好記<\/b>的幾條，畫出來的交點就是像的位置。",{"t":"svg","v":"<svg viewBox=\"0 0 470 262\" role=\"img\" aria-label=\"凸透鏡的三條特殊光線：平行主軸的過焦點、過鏡心的不偏折、過焦點的變平行\"><defs><marker id=\"l0\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><marker id=\"l1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"l2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#2F7FA3\"/><\/marker><marker id=\"l3\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#5B8C3A\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"262\" rx=\"14\" fill=\"#FFFCF6\"/><line x1=\"12\" y1=\"104\" x2=\"458\" y2=\"104\" stroke=\"#D8D4CC\" stroke-width=\"2\" /><path d=\"M235 26 Q257 104 235 182 Q213 104 235 26z\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"111\" cy=\"104\" r=\"4\" fill=\"#3E3A39\"/><text x=\"111\" y=\"124\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><circle cx=\"173\" cy=\"104\" r=\"4\" fill=\"#3E3A39\"/><text x=\"173\" y=\"124\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/ e x1=\"12\" y1=\"96\" x2=\"458\" y2=\"96\" stroke=\"#3E3A39\" stroke-width=\"2\" /><path d=\"M235 42 Q257 96 235 150 Q213 96 235 42z\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"103\" cy=\"96\" r=\"4.5\" fill=\"#3E3A39\"/><text x=\"103\" y=\"142\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><circle cx=\"169\" cy=\"96\" r=\"4.5\" fill=\"#3E3A39\"/><text x=\"169\" y=\"142\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"301\" cy=\"96\" r=\"4.5\" fill=\"#3E3A39\"/><text x=\"301\" y=\"142\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"367\" cy=\"96\" r=\"4.5\" fill=\"#3E3A39\"/><text x=\"367\" y=\"142\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><text x=\"104\" y=\"24\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">物體放這邊<\/text><text x=\"366\" y=\"24\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">實像出現在這邊（用紙屏接）<\/text><text x=\"235\" y=\"176\" font-size=\"14.5\" font-weight=\"700\" fill=\"#5B8C3A\" text-anchor=\"middle\">① 2F 外 → 像在 ①′：倒立、縮小、實像<\/text><text x=\"235\" y=\"198\" font-size=\"14.5\" font-weight=\"700\" fill=\"#A8791A\" text-anchor=\"middle\">② F～2F → 像在 ②′：倒立、放大、實像<\/text><text x=\"235\" y=\"220\" font-size=\"14.5\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">③ F 內 → 紙屏接不到；同一側出現正立、放大的虛像<\/text><text x=\"235\" y=\"246\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">剛好在 2F：倒立、一樣大的實像（像也在 2F）　剛好在 F：不成像<\/text><\/svg>"},{"t":"table","head":["物體的位置","像的位置","像的性質","用在哪裡"],"rows":[["非常遠（平行光）","另一側的焦點上","一個亮點（實像）","量焦距、聚光"],["① 2F 外","另一側 F～2F","<b>倒立、縮小、實像<\/b>","照相機、眼睛"],["剛好在 2F","另一側 2F","倒立、<b>一樣大<\/b>、實像","用來求焦距"],["② F～2F","另一側 2F 外","<b>倒立、放大、實像<\/b>","投影機"],["剛好在 F","不成像","折射後變成平行光","探照燈"],["③ F 內","和物體<b>同一側<\/b>","<b>正立、放大、虛像<\/b>","放大鏡"]]},{"t":"chant","v":"一倍焦距分虛實，兩倍焦距分大小","sub":"F 是實像和虛像的分界；2F 是縮小和放大的分界"},{"t":"chant","v":"實像都倒立，虛像都正立","sub":"看到「倒立」就是實像，看到「正立」就是虛像（透鏡、面鏡都適用）"},{"t":"guide","v":"有沒有發現：物體區和像區是<b>交叉對應<\/b>的。物體在遠的那一區（2F 外），像就在近的那一區（F～2F）；物體在近的那一區，像就跑到遠的那一區。"}]},{"h":"🖼️ 三種情況各畫一次","body":[{"t":"h3","v":"① 物體在 2F 外：倒立、縮小、實像"},{"t":"svg","v":"<svg viewBox=\"0 0 470 232\" role=\"img\" aria-label=\"物體在兩倍焦距外，成倒立縮小的實像，像在另一側的一倍到兩倍焦距之間\"><defs><marker id=\"l0\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><marker id=\"l1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"l2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#2F7FA3\"/><\/marker><marker id=\"l3\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#5B8C3A\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"232\" rx=\"14\" fill=\"#FFFCF6\"/><line x1=\"12\" y1=\"104\" x2=\"458\" y2=\"104\" stroke=\"#D8D4CC\" stroke-width=\"2\" /><path d=\"M235 26 Q257 104 235 182 Q213 104 235 26z\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"115\" cy=\"104\" r=\"4\" fill=\"#3E3A39\"/><text x=\"115\" y=\"124\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><circle cx=\"175\" cy=\"104\" r=\"4\" fill=\"#3E3A39\"/><text x=\"175\" y=\"124\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"295\" cy=\"104\" r=\"4\" fill=\"#3E3A39\"/><text x=\"308\" y=\"95\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"355\" cy=\"104\" r=\"4\" fill=\"#3E3A39\"/><text x=\"368\" y=\"95\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><text x=\"235\" y=\"124\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">O<\/text><line x1=\"70\" y1=\"104\" x2=\"70\" y2=\"48\" stroke=\"#3E3A39\" stroke-width=\"4\"  marker-end=\"url(#l0)\"/><polyline points=\"70,48 160.8,48 235,48\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-mid=\"url(#l1)\"/><polyline points=\"235,48 286.9,96.4 329.3,136\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-mid=\"url(#l1)\"/><polyline points=\"70,48 147.8,74.4 329.3,136\" fill=\"none\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" marker-mid=\"url(#l2)\"/><line x1=\"329.3\" y1=\"104\" x2=\"329.3\" y2=\"136\" stroke=\"#C8553D\" stroke-width=\"4\"  marker-end=\"url(#l1)\"/><text x=\"337.2857142857143\" y=\"154\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"start\">像<\/text><text x=\"70\" y=\"142\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">物體<\/text><text x=\"235\" y=\"220\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">物體在 2F 外 → 倒立、縮小、實像（照相機、眼睛）<\/text><\/svg>"},"照相機拍遠方的人、眼睛看東西，都是這一種。像比物體小，所以整個人才裝得進小小的底片（感光元件）和視網膜。",{"t":"h3","v":"② 物體在 F～2F 之間：倒立、放大、實像"},{"t":"svg","v":"<svg viewBox=\"0 0 470 232\" role=\"img\" aria-label=\"物體在一倍到兩倍焦距之間，成倒立放大的實像，像在另一側兩倍焦距外\"><defs><marker id=\"l0\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><marker id=\"l1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fi roke-width=\"2.5\" marker-mid=\"url(#l2)\"/><line x1=\"407.5\" y1=\"92\" x2=\"407.5\" y2=\"148.3\" stroke=\"#C8553D\" stroke-width=\"4\"  marker-end=\"url(#l1)\"/><text x=\"415.5\" y=\"166.25\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"start\">像<\/text><text x=\"143\" y=\"130\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">物體<\/text><text x=\"235\" y=\"220\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">物體在 F～2F 之間 → 倒立、放大、實像（投影機）<\/text><\/svg>"},"投影機把小小的畫面放大投到布幕上，就是這一種。因為像是倒的，所以投影片（或機器裡的畫面）要<b>倒著放<\/b>。",{"t":"h3","v":"③ 物體在 F 內：正立、放大、虛像"},{"t":"svg","v":"<svg viewBox=\"0 0 470 232\" role=\"img\" aria-label=\"物體在焦點內，成正立放大的虛像，像和物體在同一側\"><defs><marker id=\"l0\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><marker id=\"l1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"l2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#2F7FA3\"/><\/marker><marker id=\"l3\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#5B8C3A\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"232\" rx=\"14\" fill=\"#FFFCF6\"/><line x1=\"12\" y1=\"134\" x2=\"458\" y2=\"134\" stroke=\"#D8D4CC\" stroke-width=\"2\" /><path d=\"M250 56 Q272 134 250 212 Q228 134 250 56z\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"58\" cy=\"134\" r=\"4\" fill=\"#3E3A39\"/><text x=\"58\" y=\"154\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><circle cx=\"154\" cy=\"134\" r=\"4\" fill=\"#3E3A39\"/><text x=\"154\" y=\"154\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"346\" cy=\"134\" r=\"4\" fill=\"#3E3A39\"/><text x=\"359\" y=\"125\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"442\" cy=\"134\" r=\"4\" fill=\"#3E3A39\"/><text x=\"455\" y=\"125\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><text x=\"250\" y=\"154\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">O<\/text><line x1=\"196\" y1=\"134\" x2=\"196\" y2=\"100\" stroke=\"#3E3A39\" stroke-width=\"4\"  marker-end=\"url(#l0)\"/><polyline points=\"196,100 225.7,100 250,100\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-mid=\"url(#l1)\"/><polyline points=\"250,100 332.5,129.2 400,153.1\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-mid=\"url(#l1)\"/><line x1=\"250\" y1=\"100\" x2=\"126.6\" y2=\"56.3\" stroke=\"#C8553D\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><polyline points=\"196,100 319,177.4 360,203.3\" fill=\"none\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" marker-mid=\"url(#l2)\"/><line x1=\"196\" y1=\"100\" x2=\"126.6\" y2=\"56.3\" stroke=\"#2F7FA3\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><line x1=\"126.6\" y1=\"134\" x2=\"126.6\" y2=\"56.3\" stroke=\"#C8553D\" stroke-width=\"4\" stroke-dasharray=\"6 4\" marker-end=\"url(#l1)\"/><text x=\"118.57142857142857\" y=\"60.28571428571429\" font-size=\"14\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"end\">像（虛像）<\/text><text x=\"196\" y=\"172\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">物體<\/text><text x=\"235\" y=\"220\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">物體在 F 內 → 正立、放大、虛像（放大鏡）<\/text><text x=\"404\" y=\"84\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">從這邊<\/text><text x=\"404\" y=\"102\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">往透鏡看<\/text><\/svg>"},"折射後的兩條光線<b>越走越開<\/b>，在另一邊永遠不會相交，所以紙屏接不到像。但是眼睛從另一邊往透鏡看，大腦順著光線往回找（虛線），就看到一個放大的、正的像。這就是<b>放大鏡<\/b>。",{"t":"reveal","ref":"g2","v":"放大鏡是凸透鏡。遠方的景物在 <b>2F 外<\/b>，所以看到的是<b>倒立、縮小<\/b>的像。它只有在東西放得很近（F 內）的時候，才會放大。"},{"t":"ask","id":"a2","q":"一個凸透鏡的焦距是 10 cm。把蠟燭放在透鏡前 15 cm 的地方，會成什麼像？","o":["倒立、縮小、實像","倒立、放大、實像","正立、放大、虛像"],"a":1,"how":"先想 F 和 2F 各是幾公分，再看 15 落在哪一區","e":"F ＝ 10 cm、2F ＝ 20 cm。15 在 10 和 20 之間，是 ② 區：倒立、放大、實像。"},{"t":"ask","id":"a3","q":"同一個透鏡（焦距 10 cm），蠟燭改放在透鏡前 6 cm 的地方呢？","o":["倒立、縮小、實像","倒立、放大、實像","正立、放大、虛像"],"a":2,"how":"點一個，馬上告訴你對不對","e":"6 比焦距 10 小，在 ③ 區（F 內）：正立、放大、虛像，紙屏接不到。"}]},{"h":"🧲 實像和虛像差在哪？","body":[{"t":"vs","v":[{"h":"實像","p":"光線<b>真的會聚<\/b>在那裡。可以用<b>紙屏接到<\/b>。一定是<b>倒立<\/b>的（上下顛倒、左右也相反）。和物體在透鏡的<b>不同側<\/b>。"},{"h":"虛像","p":"光線沒有真的到那裡，是<b>反向延長線<\/b>的交點。紙屏<b>接不到<\/b>，只能用眼睛透過透鏡看。一定是<b>正立<\/b>的。和物體在透鏡的<b>同一側<\/b>。"}]},{"t":"trap","v":"虛像<b>看得到<\/b>，只是<b>接不到<\/b>。考卷寫「虛像無法用眼睛看見」是錯的。平面鏡裡的你就是虛像，你每天都看得到。"}]},{"h":"🏃 物體移動，像怎麼跟著動？","body":["只看實像的時候（物體在 F 外），記一句話就夠：",{"t":"chant","v":"物近、像遠、像變大","sub":"物體往透鏡（焦點）靠近 → 像離透鏡越來越遠，而且越來越大"},{"t":"list","v":["蠟燭從很遠慢慢移向焦點：紙屏要<b>往後退<\/b>（遠離透鏡）才接得到清楚的像，像越來越大。","倒過來，蠟燭遠離透鏡：紙屏要<b>靠近<\/b>透鏡，像越來越小。","蠟燭越過焦點、進到 F 內：紙屏上<b>突然接不到像<\/b>了，要改從紙屏那一邊透過透鏡看，才看得到正立放大的虛像。"]},{"t":"sim","id":"m2","src":"https://phet.colorado.edu/sims/html/geometric-optics/latest/geometric-optics_all.html?locale=zh_TW&screens=1","title":"透鏡模擬：拖著鉛筆找像","who":"PhET 互動模擬（科羅拉多大學，CC BY 4.0）","how":"第一次打開要等十幾秒。鉛筆可以用手指拖；主軸上兩個黃色的點是焦點；上面中間兩個按鈕可以換凸透鏡、凹透鏡。","missions":["把鉛筆拖到離透鏡<b>很遠<\/b>的地方：右邊的像是正的還是倒的？比鉛筆大還是小？","把鉛筆慢慢拖<b>靠近左邊的黃點（焦點）<\/b>：像是越來越大還是越來越小？離透鏡越來越遠還是近？","把鉛筆拖到黃點和透鏡<b>中間<\/b>：像跑到哪一邊了？是正的還是倒的？","按上面中間右邊的按鈕換成<b>凹透鏡<\/b>，把鉛筆前後拖：像有沒有變成倒的或放大過？"]}]},{"h":"🧪 實驗 4-1：透鏡成像","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 244\" role=\"img\" aria-label=\"透鏡成像實驗裝置：蠟燭、凸透鏡、紙屏依序放在光具座上，三者中心同高\"><defs><marker id=\"e1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"e2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#2F7FA3\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"244\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"24\" y=\"150\" width=\"422\" height=\"14\" rx=\"3\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><line x1=\"40\" y1=\"150\" x2=\"40\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"79\" y1=\"150\" x2=\"79\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"118\" y1=\"150\" x2=\"118\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"157\" y1=\"150\" x2=\"157\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"196\" y1=\"150\" x2=\"196\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"235\" y1=\"150\" x2=\"235\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"274\" y1=\"150\" x2=\"274\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"313\" y1=\"150\" x2=\"313\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"352\" y1=\"150\" x2=\"352\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"391\" y1=\"150\" x2=\"391\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"430\" y1=\"150\" x2=\"430\" y2=\"157\" stroke=\"#3E3A39\" stroke-width=\"1.5\" /><line x1=\"96\" y1=\"150\" x2=\"96\" y2=\"124\" stroke=\"#3E3A39\" stroke-width=\"3\" /><rect x=\"84\" y=\"146\" width=\"24\" height=\"8\" fill=\"#D8D4CC\" stroke=\"#3E3A39\" stroke-width=\"2\"/><line x1=\"235\" y1=\"150\" x2=\"235\" y2=\"124\" stroke=\"#3E3A39\" stroke-width=\"3\" /><rect x=\"223\" y=\"146\" width=\"24\" height=\"8\" fill=\"#D8D4CC\" stroke=\"#3E3A39\" stroke-width=\"2\"/><line x1=\"374\" y1=\"150\" x2=\"374\" y2=\"124\" stroke=\"#3E3A39\" stroke-width=\"3\" /><rect x=\"362\" y=\"146\" width=\"24\" height=\"8\" fill=\"#D8D4CC\" stroke=\"#3E3A39\" stroke-width=\"2\"/><rect x=\"89\" y=\"72\" width=\"14\" height=\"52\" rx=\"2\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><ellipse cx=\"96\" cy=\"60\" rx=\"7\" ry=\"12\" fill=\"#F2A497\" stroke=\"#3E3A39\" stroke-width=\"2\"/><path d=\"M235 22 Q257 66 235 110 Q213 66 235 22z\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"368\" y=\"28\" width=\"12\" height=\"96\" fill=\"#fff\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><line x1=\"30\" y1=\"66\" x2=\"440\" y2=\"66\" stroke=\"#C8553D\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/><text x=\"96\" y=\"38\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">蠟燭<\/text><text x=\"235\" y=\"20\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">凸透鏡<\/text><text x=\"374\" y=\"20\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">紙屏<\/text><text x=\"410\" y=\"60\" font-size=\"13\"  fill=\"#C8553D\" text-anchor=\"middle\">同一個<\/text><text x=\"410\" y=\"78\" font-size=\"13\"  fill=\"#C8553D\" text-anchor=\"middle\">高度<\/text><line x1=\"100\" y1=\"186\" x2=\"231\" y2=\"186\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-start=\"url(#e1)\" marker-end=\"url(#e1)\"/><line x1=\"239\" y1=\"186\" x2=\"370\" y2=\"186\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" marker-start=\"url(#e2)\" marker-end=\"url(#e2)\"/><text x=\"166\" y=\"206\" font-size=\"14\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">物距<\/text><text x=\"304\" y=\"206\" font-size=\"14\" font-weight=\"700\" fill=\"#2F7FA3\" text-anchor=\"middle\">像距<\/text><text x=\"235\" y=\"232\" font-size=\"14.5\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">燭焰、透鏡中心、紙屏中心要排在同一個高度<\/text><\/svg>"},{"t":"lab","h":"課本實驗的做法","steps":["先量焦距：用太陽光（或很遠的燈）找出最小最亮的點，量它到鏡心的距離。","在光具座上依序放<b>蠟燭、凸透鏡、紙屏<\/b>，把燭焰、透鏡中心、紙屏中心調到<b>同一個高度<\/b>。","把蠟燭放在 2F 外，<b>前後移動紙屏<\/b>，直到紙屏上的像最清楚，記下像的大小、正倒和像距。","把蠟燭依序移到 2F、F～2F 之間、F、F 內，每次都重新移動紙屏找像。","蠟燭在 F 內時紙屏接不到像：拿掉紙屏，從紙屏那一邊<b>透過透鏡往蠟燭看<\/b>。"],"think":"為什麼三個東西的中心要一樣高？（這樣像才會落在紙屏的正中央，不會跑到紙屏外面。）"},{"t":"tiles","v":[{"em":"✋","h":"遮住透鏡的上半部","p":"像還是<b>完整<\/b>的，只是<b>變暗<\/b>。因為物體每一點的光，還是可以從沒遮住的那一半通過。"},{"em":"🕯️","h":"蠟燭越燒越短","p":"燭焰往下移，紙屏上的像會<b>往上移<\/b>（因為像是倒的）。"},{"em":"🔄","h":"紙屏上的字","p":"實像不只上下顛倒，<b>左右也相反<\/b>。把「F」形的光源放上去，紙屏上是轉了半圈的 F。"},{"em":"2️⃣","h":"用 2F 求焦距","p":"紙屏上的像和物體<b>一樣大<\/b>時，物距 ＝ 像距 ＝ 2f。把物距除以 2 就是焦距。"}]},{"t":"h3","v":"看學姊做一次"},{"t":"list","v":["蠟燭放在凸透鏡前 30 cm，紙屏上得到倒立、<b>一樣大<\/b>的實像。","一樣大 → 物體剛好在 2F，所以 2f ＝ 30 cm，<b>f ＝ 15 cm<\/b>。","如果把蠟燭移到透鏡前 20 cm：20 在 15 和 30 之間（F～2F）→ 倒立、放大、實像。"]},{"t":"fill","id":"f3","q":"蠟燭放在凸透鏡前 40 cm 時，紙屏上得到倒立、一樣大的實像。這個透鏡的焦距是幾公分？","ans":["20"],"unit":"cm","how":"打數字，再按「對答案」","hint":"一樣大 → 物體在 2F，所以 2f ＝ 40","e":"2f ＝ 40 cm，f ＝ 20 cm"},{"t":"ask","id":"a4","q":"承上題（焦距 20 cm），把蠟燭移到透鏡前 50 cm 的地方，紙屏上的像是？","o":["倒立、縮小、實像","倒立、放大、實像","紙屏上接不到像"],"a":0,"how":"點一個，馬上告訴你對不對","e":"2F ＝ 40 cm，50 比 40 遠，在 2F 外：倒立、縮小、實像。"}]},{"h":"👓 凹透鏡成什麼像？","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 252\" role=\"img\" aria-label=\"凹透鏡只能成正立縮小的虛像，像在物體和透鏡之間\"><defs><marker id=\"l0\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><marker id=\"l1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><marker id=\"l2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#2F7FA3\"/><\/marker><marker id=\"l3\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#5B8C3A\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"252\" rx=\"14\" fill=\"#FFFCF6\"/><line x1=\"12\" y1=\"130\" x2=\"458\" y2=\"130\" stroke=\"#D8D4CC\" stroke-width=\"2\" /><path d=\"M223 70 H247 Q237 130 247 190 H223 Q233 130 223 70z\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"67\" cy=\"130\" r=\"4\" fill=\"#3E3A39\"/><text x=\"67\" y=\"150\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><circle cx=\"151\" cy=\"130\" r=\"4\" fill=\"#3E3A39\"/><text x=\"151\" y=\"150\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"319\" cy=\"130\" r=\"4\" fill=\"#3E3A39\"/><text x=\"332\" y=\"121\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">F<\/text><circle cx=\"403\" cy=\"130\" r=\"4\" fill=\"#3E3A39\"/><text x=\"416\" y=\"121\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">2F<\/text><text x=\"235\" y=\"150\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">O<\/text><line x1=\"131\" y1=\"130\" x2=\"131\" y2=\"60\" stroke=\"#3E3A39\" stroke-width=\"4\"  marker-end=\"url(#l0)\"/><polyline points=\"131,60 188.2,60 235,60\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-mid=\"url(#l1)\"/><polyline points=\"235,60 265.4,34.7 290.2,14\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.5\" marker-mid=\"url(#l1)\"/><line x1=\"235\" y1=\"60\" x2=\"188.5\" y2=\"98.7\" stroke=\"#C8553D\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><polyline points=\"131,60 291.5,168 345,204\" fill=\"none\" stroke=\"#2F7FA3\" stroke-width=\"2.5\" marker-mid=\"url(#l2)\"/><line x1=\"131\" y1=\"60\" x2=\"188.5\" y2=\"98.7\" stroke=\"#2F7FA3\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><line x1=\"188.5\" y1=\"130\" x2=\"188.5\" y2=\"98.7\" stroke=\"#C8553D\" stroke-width=\"4\" stroke-dasharray=\"6 4\" marker-end=\"url(#l1)\"/><text x=\"194.53191489361703\" y=\"170\" font-size=\"14\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">像（虛像）<\/text><text x=\"131\" y=\"168\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">物體<\/text><text x=\"235\" y=\"240\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">凹透鏡：不管物體放哪 → 正立、縮小、虛像<\/text><\/svg>"},"凹透鏡只有一種結果，不用分區：不管物體放在哪裡，都是<b>正立、縮小、虛像<\/b>，像在物體和透鏡之間（和物體同一側）。",{"t":"list","v":["畫法：平行主軸的光折射後往外<b>發散<\/b>，把它<b>反向延長<\/b>（虛線）會通過物體這一側的焦點。","通過鏡心的光一樣直直走。兩條線（一條虛線、一條實線）的交點就是像。"]},{"t":"table","head":["怎麼分辨","凸透鏡","凹透鏡"],"rows":[["摸","中間厚","中間薄"],["照太陽","可以聚成一個亮點","聚不起來，影子周圍一圈亮"],["貼近書本看字","字<b>放大<\/b>","字<b>縮小<\/b>"],["拿遠看遠方","倒立縮小","正立縮小"]]}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["生活說法：「拿近會放大，拿遠會倒過來」。考卷寫法：「物體位於<b>焦點內<\/b>成正立放大虛像；位於<b>兩倍焦距外<\/b>成倒立縮小實像」。","考卷最常給數字：「焦距 10 cm，物體在鏡前 25 cm」。做法永遠一樣：<b>先寫出 F ＝ 10、2F ＝ 20，再看 25 落在哪一區<\/b>。","考卷愛用的陷阱：「凸透鏡只能成實像」→ 錯（F 內是虛像）；「凸透鏡成的像都是放大的」→ 錯；「凹透鏡可以成實像」→ 錯。","考卷常問：「下列哪一種鏡子<b>不可能<\/b>成放大的像？」凹透鏡、凸面鏡、平面鏡都不行。能放大的只有<b>凸透鏡和凹面鏡<\/b>（就是會聚光的那兩個）。","考卷常問遮住透鏡一半：像<b>完整但變暗<\/b>，不會只剩一半。"]}]}]},{"id":"s3","nav":"③ 光學儀器","intro":"學會成像總圖之後，這一站很輕鬆：相機、眼睛、放大鏡、顯微鏡，全部都是<b>凸透鏡成像<\/b>的應用，只是物體放在不同的區。","cards":[{"h":"🎬 動畫課第 4 集","body":[{"t":"video","v":"w05-ep4.mp4?v=1118","poster":"w05-ep4.jpg","cap":"眼睛就是一台相機：近視、遠視戴什麼鏡片，放大鏡和顯微鏡怎麼放大。"}]},{"h":"📺 換老師再講一次（選看）","body":[{"t":"guide","v":"韓斯老師這段四分半，把顯微鏡、照相機、眼睛、近視遠視和色光一次講完（後半段是下一站的內容）。"},{"t":"yt","id":"LR-xGLb1eR8","title":"顯微鏡、照相機、眼睛、近視、遠視、色光與顏色","who":"韓斯頭殼","s":1815,"e":2086,"len":"約 4 分半","tag":"重點"},{"t":"yt","id":"oQpkTUPqPh0","title":"國二上 4-4 光學儀器（完整一堂課・第 1 段）","who":"國中理化自學","len":"21 分","tag":"完整版"}]},{"h":"📷 照相機和眼睛：同一個原理","body":["拍照的時候，人站在鏡頭的 <b>2F 外<\/b>，所以在感光元件上成<b>倒立、縮小的實像<\/b>。眼睛看東西也是同一件事。",{"t":"table","head":["","照相機","眼睛"],"rows":[["凸透鏡","鏡頭","<b>水晶體<\/b>（加上角膜）"],["接像的地方（紙屏）","底片、感光元件","<b>視網膜<\/b>"],["控制進光量","光圈","<b>瞳孔<\/b>（由虹膜控制大小）"],["成的像","倒立、縮小、實像","倒立、縮小、實像"],["怎麼對焦","前後移動鏡頭（改變像距）","改變水晶體的<b>厚薄<\/b>（改變焦距）"]]},{"t":"tiles","v":[{"em":"🙃","h":"視網膜上的像是倒的","p":"但是大腦會自動把它「翻正」，所以我們覺得世界是正的。"},{"em":"👁️","h":"看近的東西","p":"水晶體<b>變厚<\/b>（焦距變短），像才會剛好落在視網膜上。"},{"em":"🏔️","h":"看遠的東西","p":"水晶體<b>變薄<\/b>（焦距變長）。看遠方時眼睛最放鬆。"}]},{"t":"trap","v":"相機對焦是<b>移動鏡頭<\/b>；眼睛對焦是<b>改變水晶體的厚薄<\/b>，眼球本身不會伸長縮短。這個差別常考。"}]},{"h":"👓 近視和遠視","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 238\" role=\"img\" aria-label=\"近視成像在視網膜前，戴凹透鏡矯正；遠視成像在視網膜後，戴凸透鏡矯正\"><defs><marker id=\"y1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#C8553D\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"238\" rx=\"14\" fill=\"#FFFCF6\"/><circle cx=\"150\" cy=\"100\" r=\"46\" fill=\"#fff\" stroke=\"#3E3A39\" stroke-width=\"3\"/><ellipse cx=\"113\" cy=\"100\" rx=\"8\" ry=\"20\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><path d=\"M194 78 A46 46 0 0 1 194 122\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"5\"/><polyline points=\"30,84 67.3,84 113,84\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.2\" marker-mid=\"url(#y1)\"/><line x1=\"113\" y1=\"84\" x2=\"193\" y2=\"105.7\" stroke=\"#C8553D\" stroke-width=\"2.2\" /><polyline points=\"30,116 67.3,116 113,116\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.2\" marker-mid=\"url(#y1)\"/><line x1=\"113\" y1=\"116\" x2=\"193\" y2=\"94.3\" stroke=\"#C8553D\" stroke-width=\"2.2\" /><circle cx=\"172\" cy=\"100\" r=\"4.5\" fill=\"#2F7FA3\"/><text x=\"130\" y=\"38\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">近視：像落在視網膜前面<\/text><path d=\"M42 174 H66 Q56 196 66 218 H42 Q52 196 42 174z\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><text x=\"78\" y=\"192\" font-size=\"14\" font-weight=\"700\" fill=\"#2F7FA3\" text-anchor=\"start\">戴凹透鏡<\/text><text x=\"78\" y=\"212\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"start\">先把光發散一點<\/text><circle cx=\"385\" cy=\"100\" r=\"46\" fill=\"#fff\" stroke=\"#3E3A39\" stroke-width=\"3\"/><ellipse cx=\"348\" cy=\"100\" rx=\"8\" ry=\"20\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><path d=\"M429 78 A46 46 0 0 1 429 122\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"5\"/><polyline points=\"265,84 302.4,84 348,84\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.2\" marker-mid=\"url(#y1)\"/><line x1=\"348\" y1=\"84\" x2=\"428\" y2=\"96.3\" stroke=\"#C8553D\" stroke-width=\"2.2\" /><polyline points=\"265,116 302.4,116 348,116\" fill=\"none\" stroke=\"#C8553D\" stroke-width=\"2.2\" marker-mid=\"url(#y1)\"/><line x1=\"348\" y1=\"116\" x2=\"428\" y2=\"103.7\" stroke=\"#C8553D\" stroke-width=\"2.2\" /><circle cx=\"452\" cy=\"100\" r=\"4.5\" fill=\"#2F7FA3\"/><text x=\"365\" y=\"38\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">遠視：像落在視網膜後面<\/text><path d=\"M289 174 Q311 196 289 218 Q267 196 289 174z\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><text x=\"313\" y=\"192\" font-size=\"14\" font-weight=\"700\" fill=\"#2F7FA3\" text-anchor=\"start\">戴凸透鏡<\/text><text x=\"313\" y=\"212\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"start\">先把光會聚一點<\/text><text x=\"196\" y=\"152\" font-size=\"12.5\"  fill=\"#C8553D\" text-anchor=\"start\">視網膜<\/text><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"226\" stroke=\"#D8D4CC\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><\/svg>"},{"t":"vs","v":[{"h":"近視：看不清楚遠的","p":"水晶體太厚（或眼球太長），光會聚得太早，像落在視網膜<b>前面<\/b>。戴<b>凹透鏡<\/b>先把光發散一點，像就往後移到視網膜上。"},{"h":"遠視：看不清楚近的","p":"水晶體太薄（或眼球太短），光來不及會聚，像落在視網膜<b>後面<\/b>。戴<b>凸透鏡<\/b>先幫忙會聚，像就往前移到視網膜上。"}]},{"t":"list","v":["<b>老花眼<\/b>：年紀大了水晶體變硬、調不厚，看近的東西模糊。和遠視一樣戴<b>凸透鏡<\/b>。","怎麼看別人戴的是哪一種眼鏡？透過鏡片看他的臉：臉的輪廓<b>往內縮<\/b>是凹透鏡（近視）；<b>放大<\/b>是凸透鏡（遠視、老花）。"]},{"t":"chant","v":"近視像在前，戴凹透鏡；遠視像在後，戴凸透鏡"},{"t":"ask","id":"a5","q":"阿嬤看報紙要把報紙拿得很遠才看得清楚。她的眼鏡是哪一種透鏡？","o":["凸透鏡","凹透鏡","平面玻璃"],"a":0,"how":"點一個，馬上告訴你對不對","e":"看近的不清楚是老花眼，像落在視網膜後面，要戴凸透鏡幫忙會聚。"}]},{"h":"🔍 放大鏡","body":["放大鏡就是一片凸透鏡。把東西放在<b>焦點內<\/b>（③ 區），眼睛從另一邊看，看到<b>正立、放大的虛像<\/b>。",{"t":"list","v":["東西一定要在<b>一倍焦距以內<\/b>。拿太遠，超過焦點，像就倒過來了。","在焦點內，東西<b>越靠近焦點<\/b>（離透鏡遠一點），像越大。"]}]},{"h":"🔬 複式顯微鏡","body":["顯微鏡用<b>兩片凸透鏡<\/b>接力放大：靠近標本的叫<b>物鏡<\/b>，靠近眼睛的叫<b>目鏡<\/b>。",{"t":"tiles","v":[{"em":"1️⃣","h":"物鏡：先放大一次","p":"標本放在物鏡的 F～2F 之間（② 區）→ 在鏡筒裡成<b>倒立、放大的實像<\/b>。"},{"em":"2️⃣","h":"目鏡：再放大一次","p":"這個實像剛好落在目鏡的焦點內（③ 區）→ 目鏡像放大鏡一樣，再把它放大成<b>虛像<\/b>。"},{"em":"👀","h":"最後看到的","p":"<b>上下顛倒、左右相反、放大的虛像<\/b>。"},{"em":"✖️","h":"放大倍率","p":"物鏡倍率 × 目鏡倍率。物鏡 40 倍、目鏡 10 倍，一共放大 400 倍。"}]},{"t":"trap","v":"顯微鏡下的像是<b>上下左右都顛倒<\/b>的。看到蟲在視野的<b>右上方<\/b>，其實牠在<b>左下方<\/b>；想把牠移到中間，玻片要往<b>右上方<\/b>推（往像所在的方向推）。"},{"t":"fill","id":"f4","q":"顯微鏡的物鏡是 10 倍，目鏡是 15 倍。一共放大幾倍？","ans":["150"],"unit":"倍","how":"打數字，再按「對答案」","hint":"兩個倍率相乘","e":"10 × 15 ＝ 150 倍"}]},{"h":"🧾 一張表收起來","body":[{"t":"table","head":["儀器","用什麼鏡","物體在哪","成什麼像"],"rows":[["照相機","凸透鏡","2F 外","倒立、縮小、實像"],["眼睛","凸透鏡（水晶體）","2F 外","倒立、縮小、實像"],["投影機","凸透鏡","F～2F","倒立、放大、實像"],["放大鏡","凸透鏡","F 內","正立、放大、虛像"],["顯微鏡","兩片凸透鏡","物鏡的 F～2F","倒立、放大、虛像"],["近視眼鏡","凹透鏡","—","正立、縮小、虛像"]]},{"t":"guide","v":"望遠鏡也是用兩片透鏡（或加上面鏡）接力，把遠方的東西「拉近」來看。段考最常考的還是上面這幾個。"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["生活說法：「近視要戴眼鏡」。考卷寫法：「近視眼成像於視網膜<b>前方<\/b>，應配戴<b>凹透鏡<\/b>矯正」。","考卷常問對應：眼睛的<b>水晶體<\/b>相當於相機的鏡頭，<b>視網膜<\/b>相當於底片，<b>瞳孔<\/b>相當於光圈。","考卷常問：「下列哪一個儀器成的是<b>虛像<\/b>？」放大鏡、顯微鏡（最後的像）、近視眼鏡。相機、眼睛、投影機都是實像。","考卷常問：「拍照時，人要再靠近鏡頭一點，像會怎樣？」物近、像遠、像變大。"]}]}]},{"id":"s4","nav":"④ 顏色","intro":"最後一節：為什麼蘋果是紅的、葉子是綠的？答案是——顏色不在蘋果身上，在<b>光<\/b>裡面。","cards":[{"h":"🎬 動畫課第 5 集","body":[{"t":"video","v":"w05-ep5.mp4?v=1118","poster":"w05-ep5.jpg","cap":"顏色藏在光裡：色散、三原色，還有紅光下的綠葉為什麼變黑。"}]},{"h":"📺 換老師再講一次（選看）","body":[{"t":"guide","v":"這一節想聽完整講解的話，看這一支的前半段就夠了。"},{"t":"yt","id":"sX9ykenTdBI","title":"國二上 4-5 色光與顏色（完整一堂課・第 1 段）","who":"國中理化自學","len":"23 分","tag":"完整版"}]},{"h":"🌈 白光裡藏著七種顏色","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 262\" role=\"img\" aria-label=\"白光通過三稜鏡色散成紅橙黃綠藍靛紫，紅光偏折最小、紫光偏折最大\"><defs><marker id=\"p1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"262\" rx=\"14\" fill=\"#FFFCF6\"/><path d=\"M200 36 L276 176 H124z\" fill=\"#EEF6FA\" stroke=\"#3E3A39\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polyline points=\"20,140 90,123 164,105\" fill=\"none\" stroke=\"#3E3A39\" stroke-width=\"5\"/><polyline points=\"20,140 90,123 164,105\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" marker-mid=\"url(#p1)\"/><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"112\" stroke=\"#E5484D\" stroke-width=\"2\" /><line x1=\"239\" y1=\"112\" x2=\"410\" y2=\"96\" stroke=\"#E5484D\" stroke-width=\"4\" /><text x=\"428\" y=\"101\" font-size=\"14\" font-weight=\"700\" fill=\"#E5484D\" text-anchor=\"middle\">紅<\/text><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"114.6\" stroke=\"#F2913D\" stroke-width=\"2\" /><line x1=\"239\" y1=\"114.6\" x2=\"410\" y2=\"116\" stroke=\"#F2913D\" stroke-width=\"4\" /><text x=\"428\" y=\"121\" font-size=\"14\" font-weight=\"700\" fill=\"#F2913D\" text-anchor=\"middle\">橙<\/text><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"117.2\" stroke=\"#F2C94C\" stroke-width=\"2\" /><line x1=\"239\" y1=\"117.2\" x2=\"410\" y2=\"136\" stroke=\"#F2C94C\" stroke-width=\"4\" /><text x=\"428\" y=\"141\" font-size=\"14\" font-weight=\"700\" fill=\"#F2C94C\" text-anchor=\"middle\">黃<\/text><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"119.8\" stroke=\"#4CAF6D\" stroke-width=\"2\" /><line x1=\"239\" y1=\"119.8\" x2=\"410\" y2=\"156\" stroke=\"#4CAF6D\" stroke-width=\"4\" /><text x=\"428\" y=\"161\" font-size=\"14\" font-weight=\"700\" fill=\"#4CAF6D\" text-anchor=\"middle\">綠<\/text><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"122.4\" stroke=\"#3B82C4\" stroke-width=\"2\" /><line x1=\"239\" y1=\"122.4\" x2=\"410\" y2=\"176\" stroke=\"#3B82C4\" stroke-width=\"4\" /><text x=\"428\" y=\"181\" font-size=\"14\" font-weight=\"700\" fill=\"#3B82C4\" text-anchor=\"middle\">藍<\/text><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"125\" stroke=\"#4B4FB0\" stroke-width=\"2\" /><line x1=\"239\" y1=\"125\" x2=\"410\" y2=\"196\" stroke=\"#4B4FB0\" stroke-width=\"4\" /><text x=\"428\" y=\"201\" font-size=\"14\" font-weight=\"700\" fill=\"#4B4FB0\" text-anchor=\"middle\">靛<\/text><line x1=\"164\" y1=\"105\" x2=\"239\" y2=\"127.6\" stroke=\"#8E55B8\" stroke-width=\"2\" /><line x1=\"239\" y1=\"127.6\" x2=\"410\" y2=\"216\" stroke=\"#8E55B8\" stroke-width=\"4\" /><text x=\"428\" y=\"221\" font-size=\"14\" font-weight=\"700\" fill=\"#8E55B8\" text-anchor=\"middle\">紫<\/text><text x=\"62\" y=\"108\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">白光（太陽光）<\/text><text x=\"200\" y=\"196\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">三稜鏡<\/text><text x=\"330\" y=\"74\" font-size=\"14\" font-weight=\"700\" fill=\"#E5484D\" text-anchor=\"middle\">紅光偏折最小<\/text><text x=\"318\" y=\"246\" font-size=\"14\" font-weight=\"700\" fill=\"#8E55B8\" text-anchor=\"middle\">紫光偏折最大<\/text><text x=\"110\" y=\"232\" font-size=\"14\"  fill=\"#3E3A39\" text-anchor=\"middle\">白光被分成七種色光<\/text><text x=\"110\" y=\"252\" font-size=\"14\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">這個現象叫做「色散」<\/text><\/svg>"},"太陽光看起來是白的，其實是很多種色光混在一起。讓它通過<b>三稜鏡<\/b>，會被分成<b>紅、橙、黃、綠、藍、靛、紫<\/b>。這個現象叫做<b>色散<\/b>。",{"t":"list","v":["原因：不同色光在玻璃裡的<b>速率不一樣<\/b>，折射時偏折的程度就不同。","<b>紅光<\/b>在玻璃裡跑得最快，偏折<b>最小<\/b>；<b>紫光<\/b>跑得最慢，偏折<b>最大<\/b>。","光通過三稜鏡會折射兩次，兩次都往<b>厚的那一邊（底邊）<\/b>偏。"]},{"t":"tiles","v":[{"em":"🌦️","h":"彩虹","p":"雨後空氣中的小水滴像一顆顆小三稜鏡。陽光在水滴裡<b>折射 → 反射 → 再折射<\/b>，就色散成彩虹。"},{"em":"🧍","h":"看彩虹要背對太陽","p":"早上的彩虹在西邊，傍晚的彩虹在東邊。"},{"em":"💿","h":"生活中的色散","p":"澆花的水霧、噴水池旁邊，背對太陽都看得到小彩虹。"}]},{"t":"chant","v":"紅橙黃綠藍靛紫，紅偏最少紫最多"},{"t":"trap","v":"單一種色光（例如只有紅光）通過三稜鏡，<b>只會偏折，不會再色散<\/b>，出來還是紅光。"}]},{"h":"💡 光的三原色：紅、綠、藍","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 240\" role=\"img\" aria-label=\"光的三原色紅綠藍：紅加綠是黃，紅加藍是洋紅，綠加藍是青，三色相加是白\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"240\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"16\" y=\"14\" width=\"268\" height=\"212\" rx=\"12\" fill=\"#111\"/><g style=\"isolation:isolate\"><circle cx=\"150\" cy=\"80\" r=\"62\" fill=\"#FF0000\" style=\"mix-blend-mode:screen\"/><circle cx=\"116.94\" cy=\"137\" r=\"62\" fill=\"#00FF00\" style=\"mix-blend-mode:screen\"/><circle cx=\"183.06\" cy=\"137\" r=\"62\" fill=\"#0000FF\" style=\"mix-blend-mode:screen\"/><\/g><text x=\"150\" y=\"54\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">紅<\/text><text x=\"86.94\" y=\"167\" font-size=\"16\" font-weight=\"700\" fill=\"#111\" text-anchor=\"middle\">綠<\/text><text x=\"213.06\" y=\"167\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">藍<\/text><text x=\"116\" y=\"106\" font-size=\"14\" font-weight=\"700\" fill=\"#111\" text-anchor=\"middle\">黃<\/text><text x=\"184\" y=\"106\" font-size=\"13\" font-weight=\"700\" fill=\"#111\" text-anchor=\"middle\">洋紅<\/text><text x=\"150\" y=\"166\" font-size=\"14\" font-weight=\"700\" fill=\"#111\" text-anchor=\"middle\">青<\/text><text x=\"150\" y=\"128\" font-size=\"15\" font-weight=\"700\" fill=\"#111\" text-anchor=\"middle\">白<\/text><text x=\"378\" y=\"44\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">光的三原色<\/text><text x=\"378\" y=\"66\" font-size=\"15\" font-weight=\"700\" fill=\"#C8553D\" text-anchor=\"middle\">紅、綠、藍<\/text><text x=\"378\" y=\"104\" font-size=\"14\"  fill=\"#3E3A39\" text-anchor=\"middle\">紅 ＋ 綠 ＝ 黃<\/text><text x=\"378\" y=\"128\" font-size=\"14\"  fill=\"#3E3A39\" text-anchor=\"middle\">紅 ＋ 藍 ＝ 洋紅（紫紅）<\/text><text x=\"378\" y=\"152\" font-size=\"14\"  fill=\"#3E3A39\" text-anchor=\"middle\">綠 ＋ 藍 ＝ 青<\/text><text x=\"378\" y=\"180\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">紅 ＋ 綠 ＋ 藍 ＝ 白<\/text><text x=\"378\" y=\"212\" font-size=\"12.5\"  fill=\"#3E3A39\" text-anchor=\"middle\">手機、電視螢幕就是這樣配色<\/text><\/svg>"},"用<b>紅、綠、藍<\/b>三種色光，照不同的比例混合，可以配出幾乎所有顏色的光。三種一樣強地疊在一起就是<b>白光<\/b>。",{"t":"tiles","v":[{"em":"📱","h":"手機螢幕","p":"用放大鏡看，螢幕是一顆顆紅、綠、藍的小燈。黃色的畫面其實是紅燈和綠燈一起亮。"},{"em":"🎨","h":"和水彩不一樣","p":"水彩越混越暗；色光<b>越疊越亮<\/b>。考卷問「光的三原色」，答案是紅綠藍，不是紅黃藍。"}]},{"t":"sim","id":"m3","src":"https://phet.colorado.edu/sims/html/color-vision/latest/color-vision_all.html?locale=zh_TW&screens=2","title":"色光模擬：調出三原色","who":"PhET 互動模擬（科羅拉多大學，CC BY 4.0）","how":"第一次打開要等十幾秒。右邊有紅、綠、藍三支手電筒，把旁邊的拉桿往上拉就會發光。人頭上的泡泡是他看到的顏色。","missions":["只把<b>紅<\/b>和<b>綠<\/b>兩支拉到最上面：他看到什麼顏色？","只把<b>綠<\/b>和<b>藍<\/b>兩支拉到最上面：他看到什麼顏色？","把<b>三支<\/b>都拉到最上面：他看到什麼顏色？","自己調調看：能不能調出橘色？紅、綠、藍各要多少？"]}]},{"h":"🍎 東西的顏色是怎麼來的？","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 244\" role=\"img\" aria-label=\"紅蘋果在白光下反射紅光所以是紅色；綠葉在紅光下沒有光可以反射所以看起來是黑色\"><defs><marker id=\"o1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#E5484D\"/><\/marker><marker id=\"o2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#4CAF6D\"/><\/marker><marker id=\"o3\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3B82C4\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"244\" rx=\"14\" fill=\"#FFFCF6\"/><circle cx=\"118\" cy=\"150\" r=\"34\" fill=\"#E5484D\" stroke=\"#3E3A39\" stroke-width=\"3\"/><path d=\"M118 116 q4 -14 14 -16\" fill=\"none\" stroke=\"#3E3A39\" stroke-width=\"3\"/><line x1=\"30\" y1=\"40\" x2=\"84\" y2=\"108\" stroke=\"#E5484D\" stroke-width=\"4\" marker-end=\"url(#o1)\"/><line x1=\"42\" y1=\"34\" x2=\"96\" y2=\"102\" stroke=\"#4CAF6D\" stroke-width=\"4\" marker-end=\"url(#o2)\"/><line x1=\"54\" y1=\"28\" x2=\"108\" y2=\"96\" stroke=\"#3B82C4\" stroke-width=\"4\" marker-end=\"url(#o3)\"/><line x1=\"140\" y1=\"114\" x2=\"196\" y2=\"44\" stroke=\"#E5484D\" stroke-width=\"4\" marker-end=\"url(#o1)\"/><text x=\"46\" y=\"22\" font-size=\"13\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">白光（紅＋綠＋藍）<\/text><text x=\"206\" y=\"66\" font-size=\"13\"  fill=\"#E5484D\" text-anchor=\"start\">只反射<\/text><text x=\"206\" y=\"84\" font-size=\"13\" font-weight=\"700\" fill=\"#E5484D\" text-anchor=\"start\">紅光<\/text><text x=\"118\" y=\"210\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">紅蘋果：反射紅光，<\/text><text x=\"118\" y=\"230\" font-size=\"14\"  fill=\"#3E3A39\" text-anchor=\"middle\">綠光、藍光被吸收<\/text><line x1=\"238\" y1=\"16\" x2=\"238\" y2=\"236\" stroke=\"#D8D4CC\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><path d=\"M320 178 Q318 118 372 116 Q378 172 320 178z\" fill=\"#2A2A2A\" stroke=\"#3E3A39\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M324 174 L360 130\" stroke=\"#555\" stroke-width=\"2\"/><line x1=\"262\" y1=\"40\" x2=\"326\" y2=\"122\" stroke=\"#E5484D\" stroke-width=\"4\" marker-end=\"url(#o1)\"/><text x=\"258\" y=\"22\" font-size=\"13\" font-weight=\"700\" fill=\"#E5484D\" text-anchor=\"start\">只有紅光<\/text><text x=\"404\" y=\"100\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">沒有綠光<\/text><text x=\"404\" y=\"118\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">可以反射<\/text><text x=\"354\" y=\"210\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">綠葉在紅光下：<\/text><text x=\"354\" y=\"230\" font-size=\"14\"  fill=\"#3E3A39\" text-anchor=\"middle\">紅光被吸收 → 看起來是黑的<\/text><\/svg>"},{"t":"h3","v":"不透明的東西：看它「反射」什麼色光"},{"t":"list","v":["紅蘋果：只<b>反射紅光<\/b>，其他色光被吸收。反射的紅光進到眼睛，我們就看到紅色。","<b>白色<\/b>的東西：<b>所有色光都反射<\/b>。照什麼光，就變什麼顏色（紅光下的白紙是紅的）。","<b>黑色<\/b>的東西：<b>所有色光都吸收<\/b>，沒有光反射出來，所以是黑的。"]},{"t":"h3","v":"透明的東西：看它讓什麼色光「通過」"},{"t":"list","v":["紅色玻璃紙：只讓<b>紅光通過<\/b>，其他色光被擋住（吸收）。","白光先通過紅色玻璃紙、再遇到綠色玻璃紙：紅光過不去，<b>幾乎沒有光<\/b>，看起來是暗的。"]},{"t":"reveal","ref":"g3","v":"綠葉只會反射綠光。房間裡只有紅光，紅光被葉子吸收，<b>沒有光可以反射<\/b>，所以葉子看起來幾乎是<b>黑色<\/b>。"},{"t":"h3","v":"判斷的三步驟（每一題都這樣想）"},{"t":"list","v":["第 1 步：<b>有什麼色光<\/b>照過來？（白光＝紅、綠、藍都有）","第 2 步：這個東西<b>反射（或讓它通過）哪一種<\/b>色光？","第 3 步：兩邊對得上，就看到那個顏色；對不上，就是<b>黑色<\/b>。"]},{"t":"table","head":["照的光","白紙","紅蘋果","綠葉","黑字"],"rows":[["白光","白","紅","綠","黑"],["紅光","紅","紅","<b>黑<\/b>","黑"],["綠光","綠","<b>黑<\/b>","綠","黑"],["藍光","藍","<b>黑<\/b>","<b>黑<\/b>","黑"]]},{"t":"ask","id":"a6","q":"透過一張<b>藍色<\/b>玻璃紙，看一張白紙上的<b>紅色<\/b>字。字看起來是什麼顏色？","o":["紅色","藍色","黑色"],"a":2,"how":"用三步驟想：紅字反射什麼光？這種光過得了藍色玻璃紙嗎？","e":"紅字只反射紅光，紅光通不過藍色玻璃紙，沒有光進到眼睛，所以字是黑色。旁邊的白紙會變成藍色。"},{"t":"tiles","v":[{"em":"👕","h":"夏天穿白色","p":"白色把大部分的光反射掉，吸收的熱比較少，比較涼。"},{"em":"🧥","h":"冬天穿深色","p":"黑色把光都吸收，吸收的熱比較多，比較暖。"}]}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["生活說法：「蘋果是紅的」。考卷寫法：「紅色不透明物體<b>只反射紅光<\/b>，吸收其他色光」。","考卷最常問：「在暗室中，用<b>綠光<\/b>照射白底紅字的卡片，看到什麼？」白底反射綠光 → <b>綠底<\/b>；紅字不反射綠光 → <b>黑字<\/b>。","考卷常問色散：「白光通過三稜鏡，偏折最大的是？」<b>紫光<\/b>。「色散的原因？」各色光在玻璃中的<b>速率不同<\/b>。","考卷常問彩虹：太陽光在水滴中經過<b>折射、反射、折射<\/b>；看彩虹要<b>背對太陽<\/b>。"]}]}]},{"id":"s5","nav":"🧪 練習","intro":"最後一次的 30 分鐘：先做兩個小實驗（8 分），再去上方「⚔️ 闖關」打三個小偷、到錯題本補刀（15 分，做不完下次接著做），最後手寫 2 題、講出場券（7 分）。","cards":[{"h":"🪙 浮上來的硬幣","body":[{"t":"lab","h":"實驗 1：折射讓硬幣現身","steps":["在一個不透明的碗（或馬克杯）底放一枚硬幣。","眼睛慢慢往後、往下移，直到<b>剛好看不到<\/b>硬幣（被碗的邊緣擋住），頭停住不要動。","請家人慢慢往碗裡倒水（硬幣不要被沖走）。看看發生什麼事。"],"think":"硬幣明明沒有動，為什麼又看得到了？這和「泳池看起來比較淺」是同一件事嗎？"},{"t":"text","id":"x0","q":"倒水之後看到了什麼？你覺得為什麼？","how":"做完實驗再打，一兩句就好"}]},{"h":"➡️ 會掉頭的箭頭","body":[{"t":"lab","h":"實驗 2：水杯就是凸透鏡","steps":["在紙上畫一個大大的、朝右的箭頭「→」。","拿一個<b>圓柱形<\/b>的透明杯子裝滿水，放在箭頭前面。","把紙<b>貼在杯子後面<\/b>，透過水看箭頭；再把紙慢慢<b>往後拿遠<\/b>，一邊看箭頭的變化。"],"think":"紙貼著杯子時，箭頭是放大還是縮小、方向有沒有變？拿遠之後，箭頭變成朝哪一邊？對照成像總圖，紙是從哪一區移到哪一區？"},{"t":"text","id":"x5","q":"紙拿遠之後，箭頭變成什麼樣子？","how":"一兩句就好"}]},{"h":"⚔️ 接著去闖關（約 15 分鐘）","body":[{"t":"how","v":"點最上面一排的「⚔️ 闖關」，打倒三個小偷（🌱 歪歪水怪 → 📘 顛倒鏡片師 → 🔥 偷色大王，越後面越難）；被躲開的題目到「📕 錯題」重做到對，補上最後一刀。做完再回到這一站，繼續下面的手寫題和出場券。"}]},{"h":"✍️ 手寫 2 題（要畫圖）","body":[{"t":"write","id":"w1","q":"① 畫一條水平的水面，上面是空氣、下面是水。畫一道光從空氣<b>斜斜<\/b>射進水裡：畫出法線、入射線、折射線，標出入射角和折射角，並寫出哪一個角比較大。"},{"t":"write","id":"w2","q":"② 畫一個凸透鏡和主軸，在兩邊標出 F 和 2F。把一支箭頭（物體）畫在 <b>2F 外<\/b>，用「平行主軸」和「通過鏡心」兩條光線找出像，並在旁邊寫出像的三個性質。"}]},{"h":"🎟️ 出場券：用自己的話說","body":[{"t":"text","id":"x1","q":"1. 泳池的水為什麼看起來比實際的淺？"},{"t":"text","id":"x2","q":"2. 凸透鏡的物體放在 2F 外、F～2F、F 內，各成什麼像？"},{"t":"text","id":"x3","q":"3. 近視的人，像落在視網膜的前面還是後面？要戴哪一種透鏡？"},{"t":"text","id":"x4","q":"4. 為什麼綠色的葉子在紅光下看起來是黑的？"},{"t":"guide","v":"講不出來的那一題，回去那一站再看一次卡片，再回來寫。"}]},{"h":"📤 最後一步：傳給爸爸","body":[{"t":"submit","how":"按下面的按鈕 → 選 <b>LINE<\/b> → 選爸爸 → 傳送。平板會把你這份的闖關成績、猜謎、填空、手寫和出場券整理成一張圖傳出去。"},{"t":"guide","v":"傳完這一份就結束了！下週的考前衝刺包會把第 3、4 章再整個跑一次，加油 👋"}]}]}],"flash":[["折射","光從一種介質斜射入另一種介質，因速率改變而偏折"],["折射的原因","光在不同介質中的速率不同"],["光速大小","空氣（真空）＞ 水 ＞ 玻璃"],["折射角","折射線和法線的夾角"],["空氣 → 水（快 → 慢）","偏向法線，折射角 ＜ 入射角"],["水 → 空氣（慢 → 快）","偏離法線，折射角 ＞ 入射角"],["光垂直射入界面","不偏折，但速率仍然改變"],["折射時不變的是","頻率"],["視深和實深","從空氣看水中的物體：視深 ＜ 實深（看起來比較淺）"],["水中的筷子看起來","在水面折斷、水裡的部分往上彎"],["凸透鏡","中間厚、邊緣薄，會聚光線"],["凹透鏡","中間薄、邊緣厚，發散光線"],["焦距","焦點到鏡心的距離"],["平行主軸的光通過凸透鏡","折射後通過另一側的焦點"],["通過鏡心的光","不偏折，直直走"],["凸透鏡：物體在 2F 外","倒立、縮小、實像（照相機、眼睛）"],["凸透鏡：物體在 2F 上","倒立、相等、實像（像也在 2F）"],["凸透鏡：物體在 F～2F","倒立、放大、實像（投影機）"],["凸透鏡：物體在 F 上","不成像（折射後成平行光）"],["凸透鏡：物體在 F 內","正立、放大、虛像（放大鏡）"],["凹透鏡成的像","一律是正立、縮小、虛像"],["實像和虛像怎麼分","實像倒立、紙屏接得到；虛像正立、紙屏接不到"],["一倍焦距、兩倍焦距","一倍焦距分虛實，兩倍焦距分大小"],["遮住凸透鏡的一半","像仍然完整，只是變暗"],["眼睛的水晶體、視網膜","相當於相機的鏡頭（凸透鏡）、底片"],["近視","像在視網膜前，戴凹透鏡"],["遠視、老花","像在視網膜後，戴凸透鏡"],["複式顯微鏡看到的像","上下顛倒、左右相反的放大虛像"],["色散","白光通過三稜鏡分成紅橙黃綠藍靛紫"],["色散時偏折最大、最小","紫光最大、紅光最小"],["光的三原色","紅、綠、藍；三色等量混合成白光"],["紅光 ＋ 綠光","黃光"],["不透明物體的顏色","由它反射的色光決定"],["透明物體的顏色","由能通過它的色光決定"],["白色物體、黑色物體","白色反射所有色光；黑色吸收所有色光"],["紅光照綠葉","看起來是黑色（沒有綠光可以反射）"]],"order":[{"t":"透鏡成像實驗的步驟","items":["用平行光量出凸透鏡的焦距","在光具座上依序放蠟燭、凸透鏡、紙屏","把燭焰、透鏡中心、紙屏中心調到同一個高度","移動紙屏，直到像最清楚","記錄像的大小、正倒和像距"]},{"t":"蠟燭從遠處移向凸透鏡，依序看到的像","items":["倒立縮小實像（2F 外）","倒立相等實像（2F 上）","倒立放大實像（F～2F）","不成像（F 上）","正立放大虛像（F 內）"]},{"t":"色散後的色光：偏折由小到大","items":["紅","橙","黃","綠","藍","靛","紫"]},{"t":"光的速率：由快到慢","items":["在空氣中","在水中","在玻璃中"]}],"quizHow":"📝 怎麼作答：每題<b>點一個<\/b>你覺得對的答案，答對就打中小偷一下，馬上會告訴你原因，再按「下一關」。三個對手：🌱 歪歪水怪 → 📘 顛倒鏡片師 → 🔥 偷色大王，<b>越後面越難，最後一個就是段考程度<\/b>，被躲開很正常！沒答對的題目會放進「📕 錯題」，回去重做到對就能補刀。一共 30 題，做不完沒關係，進度會自動存起來，下次接著打。","quiz":[{"tag":"看懂","s":"筷子斜插進水杯裡，看起來好像在水面折斷了。這是光的哪一種現象？","o":["反射","折射","直進","色散"],"a":1,"e":"水裡那段筷子的光從水進到空氣時偏折（折射），看起來的位置比實際的高，所以像是折斷。"},{"tag":"看懂","s":"光在下列哪一個地方跑得最快？","o":["空氣","水","玻璃","三個地方都一樣快"],"a":0,"e":"光速：空氣（接近真空）＞ 水 ＞ 玻璃。就是因為速率不一樣，光才會折射。"},{"tag":"看懂","s":"站在岸邊看游泳池的池底，覺得池水的深度和實際比起來怎樣？","o":["比實際的深","和實際一樣","有時深有時淺","比實際的淺"],"a":3,"e":"池底的光從水進到空氣時偏離法線，大腦順著光線往回找，找到的位置比較淺。所以視深小於實深，下水要小心。"},{"tag":"看懂","s":"放大鏡是用哪一種鏡片做的？","o":["凹透鏡","平面玻璃","凸透鏡","凸面鏡"],"a":2,"e":"放大鏡是凸透鏡：中間厚、邊緣薄。東西放在焦點內，就看到正立放大的虛像。"},{"tag":"看懂","s":"太陽光通過凸透鏡之後會怎樣？","o":["會聚到一點","往四周散開","沿原路折回去","分成七種顏色"],"a":0,"e":"凸透鏡會把平行光會聚到焦點。往四周散開是凹透鏡；分成七色要用三稜鏡。"},{"tag":"看懂","s":"近視的人戴的眼鏡，是哪一種透鏡？","o":["凸透鏡","凹透鏡","凹面鏡","平面鏡"],"a":1,"e":"近視的像落在視網膜前面，要用凹透鏡先把光發散一點，像才會往後移到視網膜上。"},{"tag":"看懂","s":"太陽光通過三稜鏡，被分成紅橙黃綠藍靛紫。這個現象叫做什麼？","o":["反射","漫射","色散","會聚"],"a":2,"e":"白光被分成各種色光叫做色散，原因是不同色光在玻璃裡的速率不同、偏折程度不同。"},{"tag":"看懂","s":"光的三原色是哪三種？","o":["紅、黃、藍","紅、橙、黃","黃、綠、紫","紅、綠、藍"],"a":3,"e":"色光的三原色是紅、綠、藍，三種等量疊在一起是白光。紅、黃、藍是顏料的說法，不是光。"},{"tag":"看懂","s":"在白光下，蘋果看起來是紅色的，是因為蘋果怎麼樣？","o":["反射紅光，吸收其他色光","吸收紅光，反射其他色光","自己會發出紅光","讓紅光穿過去"],"a":0,"e":"不透明物體的顏色由它反射的色光決定。蘋果反射紅光、吸收其他色光，所以看起來是紅的。"},{"tag":"課本","s":"光從空氣<b>斜向<\/b>射入水中，下列敘述何者正確？","o":["折射線偏離法線，折射角大於入射角","折射線偏向法線，折射角小於入射角","光不會偏折，直直前進","折射角等於入射角"],"a":1,"e":"空氣 → 水是快 → 慢，折射線偏向法線，折射角比入射角小。偏離法線是水 → 空氣的情形。"},{"tag":"課本","s":"光從空氣<b>垂直<\/b>射入水中，下列敘述何者正確？","o":["方向不變，速率也不變","方向改變，速率不變","方向不變，速率變慢","方向改變，速率變慢"],"a":2,"e":"垂直射入時入射角是 0°，光不偏折；但是進到水裡，速率還是變慢了。"},{"tag":"課本","s":"關於實像和虛像，下列敘述何者正確？","o":["實像是正立的，虛像是倒立的","虛像用眼睛看不到","實像和虛像都可以用紙屏接到","實像可以用紙屏接到，虛像不行"],"a":3,"e":"實像是光線真的會聚而成，紙屏接得到，而且是倒立的。虛像是反向延長線的交點，紙屏接不到，但眼睛看得到（例如平面鏡裡的你）。"},{"tag":"課本","s":"凸透鏡的焦距是 10 cm。把蠟燭放在透鏡前 <b>30 cm<\/b> 的地方，紙屏上的像是？","o":["倒立、縮小、實像","倒立、放大、實像","正立、放大、虛像","倒立、一樣大、實像"],"a":0,"e":"F ＝ 10、2F ＝ 20。30 比 20 遠，在 2F 外：倒立、縮小、實像。一樣大要剛好放在 20 cm。"},{"tag":"課本","s":"用放大鏡看螞蟻，想看到放大的螞蟻，螞蟻要放在哪裡？","o":["兩倍焦距外","一倍和兩倍焦距之間","焦點內（一倍焦距以內）","剛好在兩倍焦距上"],"a":2,"e":"放大鏡要成正立放大的虛像，物體必須在焦點內。放在 F～2F 之間雖然也會放大，但那是倒立的實像，要用紙屏接。"},{"tag":"課本","s":"把物體放在<b>凹透鏡<\/b>前面，不管放在哪裡，看到的像都是？","o":["倒立、縮小、實像","正立、縮小、虛像","正立、放大、虛像","要看物體放在哪一區"],"a":1,"e":"凹透鏡只會成正立、縮小的虛像，不用分區。正立放大虛像是凸透鏡（物體在焦點內）。"},{"tag":"課本","s":"眼睛的構造和照相機很像。眼睛裡相當於「底片（感光元件）」的是哪一個部位？","o":["水晶體","瞳孔","角膜","視網膜"],"a":3,"e":"視網膜負責接住像，相當於底片。水晶體相當於鏡頭（凸透鏡），瞳孔相當於光圈。"},{"tag":"課本","s":"遠視眼的成像位置和應該配戴的鏡片，下列何者正確？","o":["像在視網膜後方，戴凸透鏡","像在視網膜前方，戴凹透鏡","像在視網膜後方，戴凹透鏡","像在視網膜前方，戴凸透鏡"],"a":0,"e":"遠視的光來不及會聚，像落在視網膜後面，要戴凸透鏡幫忙會聚。像在前方、戴凹透鏡是近視。"},{"tag":"課本","s":"白光通過三稜鏡發生色散。偏折程度<b>最大<\/b>的是哪一種色光？","o":["紅光","黃光","紫光","綠光"],"a":2,"e":"紫光在玻璃中速率最慢，偏折最大；紅光速率最快，偏折最小。"},{"tag":"課本","s":"在暗室裡，只用<b>紅光<\/b>照一張白紙。白紙看起來是什麼顏色？","o":["白色","紅色","黑色","粉紅色"],"a":1,"e":"白紙會反射所有色光。現在只有紅光照它，它就反射紅光，所以看起來是紅色。"},{"tag":"課本","s":"把紅光和綠光一樣強地照在白色牆上的同一個地方，看起來是什麼顏色？","o":["洋紅色","青色","白色","黃色"],"a":3,"e":"紅光 ＋ 綠光 ＝ 黃光。紅 ＋ 藍是洋紅，綠 ＋ 藍是青，三種都有才是白。"},{"tag":"課本","s":"做凸透鏡成像實驗，紙屏上已經有清楚的像。用一張不透明的紙遮住透鏡的<b>上半部<\/b>，紙屏上的像會怎樣？","o":["像仍然完整，但是變暗","只剩下半部的像","只剩上半部的像","像完全消失"],"a":0,"e":"物體每一點發出的光，仍然可以從沒被遮住的下半部通過、會聚成像，所以像還是完整的；只是通過的光變少，像變暗。"},{"tag":"段考挑戰","s":"【題組】一道光從空氣射向水面，入射線和<b>水面<\/b>的夾角是 40°，如下圖。甲、乙、丙、丁是四條可能的路徑，其中乙是入射線的延長線，丁和法線重合。","src":"<svg viewBox=\"0 0 470 236\" role=\"img\" aria-label=\"一道光從空氣斜射入水中，入射線和水面夾四十度，水中有甲乙丙丁四條可能的路徑；乙是原方向的延長線，甲比乙更遠離法線，丙在乙和法線之間，丁和法線重合\"><defs><marker id=\"q1\" markerUnits=\"userSpaceOnUse\" markerWidth=\"13\" markerHeight=\"13\" viewBox=\"0 0 8 8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#3E3A39\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"470\" height=\"236\" rx=\"14\" f
