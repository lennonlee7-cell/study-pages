<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFCF6">
<title>學習教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 繪本風（和紙白、3px 墨灰框、珊瑚粉／山吹黃／水色／若竹綠平塗、Huninn 粉圓）。只用淺色底，不做深色模式。 */
:root{--ink:#3E3A39;--paper:#FFFCF6;--coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--green:#B9DAA5;
 --coral-soft:#FCE7E2;--yellow-soft:#FDF3D6;--mizu-soft:#E2F1F7;--green-soft:#E8F3E0;
 --bg-2:#F5EEE2;--muted:#7C7571;--line:#E8DFD2;--accent-text:#B65544;--bw:3px;--r:24px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 "Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
h1,h2,h3,h4,b,strong,th{font-weight:400}
button{font-family:inherit}
/* ---- 頂部 ---- */
header{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:10px 16px 4px}
.logo{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:21px;line-height:1}
.top h1{margin:0;font-size:19px;line-height:1.5;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{flex:none;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:8px;max-width:880px;margin:0 auto;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
nav button.on{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
main{max-width:880px;margin:0 auto;padding:18px 16px 48px}
section{display:none}section.on{display:block;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.97);opacity:0}60%{transform:scale(1.008);opacity:1}100%{transform:scale(1)}}
/* ---- 插圖 ---- */
.art{display:block;width:72px;height:72px;flex:none}
.art.sm{width:40px;height:40px}.art.md{width:54px;height:54px}.art.lg{width:104px;height:104px}
.stamp{display:grid;place-items:center;background:#fff;border:var(--bw) solid var(--ink);border-radius:50%}
.float{animation:float 3.4s ease-in-out infinite;transform-origin:50% 90%}
.float.d2{animation-delay:-1.2s}.float.d3{animation-delay:-2.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
/* ---- 首頁橫幅 ---- */
.hero{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border:var(--bw) solid var(--ink);border-radius:28px;padding:16px 18px;margin:0 0 18px}
.hero .txt{flex:1;min-width:0}
.hero h2{font-size:25px;line-height:1.4;margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:13.5px;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.chip.y{background:var(--yellow)}.chip.c{background:var(--coral)}
.pics{flex:none;position:relative;width:140px;height:124px}
.pics .stamp{position:absolute;right:4px;bottom:0;width:104px;height:104px}
.pics .stamp .art{width:80px;height:80px}
.pics .s1{position:absolute;left:0;top:0}.pics .s2{position:absolute;right:-6px;top:-10px}
/* ---- 卡片與文字 ---- */
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px 20px;margin:0 0 18px}
h2{font-size:23px;line-height:1.45;margin:0 0 8px}
h3{font-size:19px;line-height:1.5;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
h3:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
b{box-shadow:inset 0 -.42em 0 var(--yellow);padding:0 2px}/* 用 box-shadow 畫螢光筆：透明漸層在 PDF 會多一條黑線 */
.card ul,.card ol{padding-left:1.4em}li::marker{color:var(--accent-text)}
.guide{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px}
.who{flex:none;width:60px;text-align:center}
.ava{width:58px;height:58px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:30px;line-height:1;animation:float 3.4s ease-in-out infinite}
.who small{display:block;font-size:12px;line-height:1.3;margin-top:4px;color:var(--muted)}
.bubble{background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;position:relative;min-width:0;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:19px;width:14px;height:14px;background:#fff;border-left:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);transform:rotate(45deg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.tile{border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 14px;background:var(--coral-soft)}
.tile:nth-child(4n+2){background:var(--mizu-soft)}.tile:nth-child(4n+3){background:var(--yellow-soft)}.tile:nth-child(4n){background:var(--green-soft)}
.tile .em{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:25px;line-height:1;margin-bottom:6px}
.tile .em:empty{display:none}
.tile h4{margin:0 0 2px;font-size:18px;line-height:1.5}.tile p{margin:0;font-size:15.5px}
.chant{background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0 18px;font-size:19px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.chant small{display:block;font-size:14.5px;opacity:.85}
.chant b{box-shadow:inset 0 -.42em 0 #fff}
.trap{background:var(--coral-soft);border:var(--bw) dashed var(--ink);border-radius:18px;padding:10px 14px;margin:12px 0;font-size:15.5px}
.trap:before{content:"⚠️ 陷阱題注意";display:inline-block;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin:0 8px 4px 0;font-size:14px;line-height:1.7}
.lab{background:var(--mizu-soft);border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 16px;margin:12px 0}
.lab h4{margin:2px 0 4px;font-size:18px}
.fig{max-width:580px;margin:10px auto;background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden}
.fig svg{width:100%;height:auto;display:block}
main svg:not(.art){max-width:100%;height:auto}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.vs>div{border:var(--bw) solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15.5px;background:var(--coral-soft)}
.vs>div:nth-child(2n){background:var(--mizu-soft)}
.vs h4{margin:0 0 4px;font-size:18px;line-height:1.5}
.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden}
th,td{padding:7px 10px;vertical-align:top;text-align:left;border-bottom:2px solid var(--line)}
th{background:var(--yellow-soft);border-bottom:2px solid var(--ink)}
td+td,th+th{border-left:2px solid var(--line)}
tr:last-child td{border-bottom:0}
.tl{position:relative;padding-left:32px;margin:10px 0}
.tl:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.tl div{position:relative;margin:0 0 12px}
.tl div:before{content:"";position:absolute;left:-31px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink)}
.tl span{display:inline-block;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin-right:6px;font-size:15px}
.vid{width:100%;display:block;background:var(--ink);border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 影片放大、YouTube 名師影片 ---- */
.vbox{position:relative}
.zoom{position:absolute;right:10px;top:10px;z-index:2;font-size:15px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.yt{border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;margin:12px 0}
.yt .scr{position:relative;display:block;width:100%;aspect-ratio:16/9;background:var(--ink);cursor:pointer;overflow:hidden}
.yt .scr img{width:100%;height:100%;object-fit:cover;display:block}
.yt .scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:var(--coral);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:28px;line-height:1;box-shadow:0 4px 0 var(--ink);padding-left:5px}
.yt .dur{position:absolute;left:10px;bottom:10px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;line-height:1.7}
.yt .scr .zoom{top:auto;bottom:10px}.yt .scr.live .zoom{top:10px;bottom:auto}
.ytm{padding:10px 16px 12px;border-top:var(--bw) solid var(--ink)}
.ytm h4{margin:0;font-size:17.5px;line-height:1.5}
.ytm p{margin:2px 0 0;font-size:14.5px;line-height:1.6;color:var(--muted)}
.ytm .tag{color:var(--ink)}
#big{position:fixed;inset:0;z-index:200;background:rgba(40,36,35,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 12px 16px}
#big.on{display:flex}
#big .stage{width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;background:#000;border:var(--bw) solid #fff;border-radius:16px;overflow:hidden}
#big .stage iframe,#big .stage video{width:100%;height:100%;border:0;display:block;background:#000}
#big .bt{color:#fff;font-size:16px;text-align:center;max-width:880px}
#big .x{position:absolute;top:10px;right:12px;font-size:18px;line-height:1.5;border:2px solid var(--ink);background:var(--coral);color:var(--ink);border-radius:999px;padding:4px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
body.big{overflow:hidden}
.pic{max-width:100%;border:var(--bw) solid var(--ink);border-radius:20px}
/* ---- 記憶卡 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.flip{perspective:900px;height:140px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .k{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--ink);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;overflow:auto}
.flip .f{background:var(--mizu);font-size:19px}
.flip:nth-child(4n+2) .f{background:var(--coral)}.flip:nth-child(4n+3) .f{background:var(--green)}.flip:nth-child(4n) .f{background:var(--yellow)}
.flip .k{background:#fff;font-size:15.5px;transform:rotateY(180deg)}
/* ---- 闖關 ---- */
.qbox{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:18px;margin-bottom:14px}
.prog{height:16px;background:var(--bg-2);border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink);transition:width .4s}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted)}
.stem{font-size:19px;white-space:pre-line;margin:8px 0}
.src{background:var(--mizu-soft);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;margin:10px 0;font-size:16px}
.opt{display:block;width:100%;text-align:left;font-size:17px;line-height:1.6;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:10px 16px;margin:10px 0;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.ok{background:var(--green)}
.opt.bad{background:var(--coral);animation:shake .3s}
.opt.pick{background:var(--yellow-soft);box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--ink)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-top:10px;font-size:16px}
.fb.ok{display:block;background:var(--green-soft)}.fb.bad{display:block;background:var(--coral-soft)}
.btn{display:inline-block;font-size:16px;line-height:1.5;border:var(--bw) solid var(--ink);background:var(--coral);color:var(--ink);border-radius:16px;padding:8px 20px;margin-top:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--mizu)}
.say{font-size:14px;line-height:1.5;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:middle;cursor:pointer}
.combo{background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 10px;color:var(--ink)}
.combo:empty{display:none}
.rank{text-align:center;padding:6px 4px}
.rank .deco{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.rank .big{width:116px;height:116px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:58px;line-height:1}
.empty{text-align:center}.empty .art{margin:4px auto 0}
.lvl{border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:2px 0 10px;background:var(--yellow-soft)}
.lvl b{display:block;font-size:18px;box-shadow:none;padding:0}.lvl small{display:block;font-size:14.5px;color:var(--muted);line-height:1.5}
.lv-g{background:var(--green-soft)}.lv-m{background:var(--mizu-soft)}.lv-c{background:var(--coral-soft)}
.lvsum{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0}
.lvchip{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px}
.src svg{display:block;width:100%;max-width:520px;margin:4px auto}
.order{padding:0;margin:8px 0}
.order li{list-style:none;display:flex;align-items:center;border:var(--bw) solid var(--ink);background:#fff;border-radius:16px;padding:8px 14px;margin:10px 0;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.order li.pick{background:var(--yellow-soft);box-shadow:0 0 0 var(--ink);transform:translateY(3px)}
.order li .n{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;margin-right:10px;font-size:15px;line-height:1}
.order li.pick .n{background:var(--yellow)}
.tag{display:inline-block;font-size:13px;line-height:1.6;background:var(--mizu-soft);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
.srcs{font-size:13px;color:var(--muted);margin-top:8px}.srcs a{color:var(--accent-text)}
#boom{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;width:max-content;max-width:calc(100% - 32px);background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-size:16px}
/* ---- 作答區塊 ---- */
.how{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin:10px 0 8px;font-size:15px}
.ask,.fill,.wbox,.tbox,.sub{background:var(--paper);border:var(--bw) dashed var(--ink);border-radius:20px;padding:12px 16px;margin:14px 0}
.fill .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fill .row .btn{margin-top:0}
.fill input,.tbox textarea{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);outline:0}
.fill input:focus,.tbox textarea:focus{box-shadow:0 0 0 3px var(--yellow)}
.fill input{width:9em}.tbox textarea{width:100%;min-height:80px;resize:vertical}
.wcan{width:100%;height:300px;background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;touch-action:none;display:block}
.wtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.wtools .btn{margin-top:0}
.wphoto,.subimg{max-width:100%;border:var(--bw) solid var(--ink);border-radius:16px;margin-top:10px;display:none}
.reveal{background:var(--green-soft);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;margin:12px 0}
@media (max-width:520px){
 body{font-size:16.5px}.card{padding:16px}.qbox{padding:16px}
 .hero{padding:14px}.hero h2{font-size:21px}
 .pics{width:96px;height:100px}.pics .stamp{width:84px;height:84px;right:0}.pics .stamp .art{width:62px;height:62px}
 .pics .s1{width:34px;height:34px}.pics .s2{display:none}
}
@media (prefers-reduced-motion:reduce){
 section.on,.float,.ava,.opt.bad{animation:none}
 .flip .in,.btn,.opt,.order li,.prog i{transition:none}
}
/* ---- 列印（PDF） ---- */
.print body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print header{position:static}.print nav,.print .xp{display:none}
.print .top h1{white-space:normal}
.print section{display:block;animation:none}
.print .float,.print .ava{animation:none}
.print .card{break-inside:auto}
.print h2,.print h3{break-after:avoid}
.print .qbox,.print .tile,.print .fig,.print .chant,.print .trap,.print .vs,.print table,.print .hero{break-inside:avoid}
.print .chant,.print .btn,.print .opt{box-shadow:none}
.print .pbreak{break-before:page}
.print .cards{grid-template-columns:1fr 1fr}
.print .fc{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:15px}
.print .wcan,.print .wtools,.print .sub{display:none}.print .wprint{height:220px;border:2px solid var(--ink);border-radius:12px;background:#fff}
@page{size:A4;margin:12mm}
</style>
</head>
<body>
<canvas id="boom"></canvas>
<header><div class="top"><span class="logo" id="logo">📚</span><h1 id="ttl"></h1><span class="xp" id="xp">⭐ 0</span></div><nav id="nav"></nav></header>
<main id="main"></main>
<script>
// 繪本風插圖（原創 SVG）：墨灰 3px 線框＋四色平塗，不用漸層。
// 網頁範本（renderPage 會把整份檔案嵌進 page.html）與首頁目錄（node require）共用這一份。
const INK = "#3E3A39", CORAL = "#F2A497", YELLOW = "#F6D27A", MIZU = "#A8D3E6", GREEN = "#B9DAA5", PAPER = "#FFFCF6";
const SK = `stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
const FACE = (x, y) => `<circle cx="${x - 6}" cy="${y}" r="2.8" fill="${INK}"/><circle cx="${x + 6}" cy="${y}" r="2.8" fill="${INK}"/><path d="M${x - 4} ${y + 7}c2.5 2.5 5.5 2.5 8 0" ${SK} fill="none"/>`;

const ART = {
  book: `<g ${SK}>
    <path d="M50 30c-8-6-20-6-30-2v50c10-4 22-4 30 2z" fill="${YELLOW}"/>
    <path d="M50 30c8-6 20-6 30-2v50c-10-4-22-4-30 2z" fill="${MIZU}"/>
    <path d="M28 42h14M28 52h14M58 42h14M58 52h14" fill="none"/></g>`,

","how":"寫完可以按「📷 拍紙本」改拍紙本。"}]},{"h":"💡 語詞和成語","body":[{"t":"table","head":["語詞","意思","怎麼用"],"rows":[["成群結隊","一群一群的人或動物聚在一起行動","螞蟻成群結隊的搬餅乾。"],["忠實","忠誠可靠","小狗是我忠實的朋友。"],["守衛","看守、保衛","警衛守衛著大門。"],["甜蜜","快樂幸福的感覺，也可說味道很甜","全家人笑得好甜蜜。"],["王國","課文指某方面特別優秀、特別多的地方","糖的王國、動漫王國。"],["唾手可得","比喻很容易得到（課外補充，考過）","這次冠軍對他來說唾手可得。"]]},{"t":"trap","v":"「唾手可得」是<b>很容易<\/b>得到。像「筆跡唾手可得」「讓他唾手可得所以不服氣」都是亂用，要看句子說的是不是「輕輕鬆鬆就能得到」。"},{"t":"vs","v":[{"h":"📌 短語練習","p":"（伸）著（大手掌）的（椰子樹）<br>（抱）著（小貓咪）的（妹妹）"},{"h":"🗣️ 詞語小心","p":"<b>心寒<\/b>：心裡失望難過<br><b>寒流<\/b>：天氣變很冷的冷空氣<br>兩個都有寒，意思差很多"}]}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「白色的唾沫」是指？→ <b>浪花<\/b>。","「緊緊的拉住親愛的春天」的是誰？→ <b>椰子樹<\/b>，不是鳳梨。","「美麗島的小朋友都像麻雀一樣快樂。」→ ❌ 是<b>雲雀<\/b>。","「下面哪一組部首相同？」→ 隊／隔 都是左耳旁（阜）。","「平時忠實的『忠』和哪個字讀音不同？」→ 忠、中、終、鐘都念 ㄓㄨㄥ，<b>重要的重<\/b>念 ㄓㄨㄥˋ。"]}]}]},{"id":"l2","nav":"📮 我的家鄉","intro":"第二課是<b>書信<\/b>！表姐柔柔住臺南，表妹安安住宜蘭。兩個人寫了<b>四封信<\/b>，把自己家鄉好玩的地方介紹給對方。這課一定會考「信怎麼寫」。","cards":[{"h":"🎬 動畫課第 2 集","body":[{"t":"video","v":"lang4a-ep2.mp4?v=1101","poster":"lang4a-ep2.jpg","cap":"四封信、水火同源、冷泉、化石園區、打陀螺，還有信的六個部分。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"<b>導讀<\/b>那支最短；<b>考前<\/b>那支是語詞解釋題目，有點長，可以分兩次看。"},{"t":"yt","id":"dJagP_gPFjs","title":"課本 P14、P15 導讀：課文大意","who":"市隱","len":"5 分半","tag":"導讀"},{"t":"yt","id":"23YoF5vFKqQ","title":"課本 P14、P15 修辭：映襯、轉折複句、轉化","who":"市隱","len":"3 分半","tag":"修辭"},{"t":"yt","id":"Oc29WrvMeAg","title":"第二課語詞解釋抽考題目","who":"市隱","len":"14 分","tag":"考前"}]},{"h":"📮 四封信在講什麼","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 262\" role=\"img\" aria-label=\"四封信的來回\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"262\" rx=\"14\" fill=\"#FFFCF6\"/><defs><marker id=\"arL\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#3E3A39\"/><\/marker><\/defs><rect x=\"16\" y=\"16\" width=\"120\" height=\"66\" rx=\"10\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"76\" y=\"42\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">表姐 <\/b>；約好<b>團聚<\/b>時一起玩"]]},{"t":"reveal","ref":"g2","v":"水裡真的會冒出火！那就是臺南白河關子嶺的<b>水火同源<\/b>。柔柔本來以為水火不相容，沒想到水和火竟然是好朋友。"},{"t":"vs","v":[{"h":"🟡 柔柔的臺南","p":"關子嶺<b>溫泉<\/b>、水火同源<br>左鎮<b>化石<\/b>園區"},{"h":"🔵 安安的宜蘭","p":"蘇澳<b>冷泉<\/b><br>國立<b>傳統藝術中心<\/b>、陀螺"}]},{"t":"chant","v":"臺南溫泉挖化石，宜蘭冷泉打陀螺"}]},{"h":"✉️ 信的六個部分（一定考）","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 280\" role=\"img\" aria-label=\"書信的六個部分\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"280\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"30\" y=\"16\" width=\"410\" height=\"250\" fill=\"#fff\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"46\" y=\"46\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">親愛的安安：<\/text><text x=\"430\" y=\"46\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"end\">① 稱呼（開頭頂格）<\/text><text x=\"70\" y=\"80\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">好久不見，近來好嗎？<\/text><text x=\"430\" y=\"80\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"end\">② 問候<\/text><text x=\"70\" y=\"114\" font-size=\"16\"  fill=\"#3E3A39\" text-anchor=\"start\">（介紹家鄉的事……）<\/text><text x=\"430\" y=\"114\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"end\">③ 正文<\/text><text x=\"70\" y=\"148\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">祝<\/text><text x=\"46\" y=\"178\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">身體健康<\/text><text x=\"430\" y=\"162\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"end\">④ 祝福<\/text><text x=\"260\" y=\"214\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">表姐柔柔上<\/text><text x=\"430\" y=\"214\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"end\">⑤ 署名<\/text><text x=\"260\" y=\"246\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"start\">八月二日<\/text><text x=\"430\" y=\"246\" font-size=\"15\"  fill=\"#B5533C\" text-anchor=\"end\">⑥ 日期<\/text><\/svg>"},{"t":"tiles","v":[{"em":"🙋","h":"稱呼","p":"收信的人，後面加<b>冒號<\/b>。寫給長輩要有禮貌。"},{"em":"👋","h":"問候","p":"好久不見，近來好嗎？"},{"em":"📖","h":"正文","p":"真正要說的事。"},{"em":"🌸","h":"祝福","p":"「祝」後面換行，再寫身體健康。"},{"em":"✍️","h":"署名","p":"寫信的人。柔柔是表姐，寫「上」；安安是表妹，寫「<b>敬上<\/b>」。"},{"em":"📅","h":"日期","p":"寫信那一天。"}]},{"t":"chant","v":"稱呼問候說正文，祝福署名加日期"},{"t":"trap","v":"寫給<b>比自己大<\/b>的人，署名用<b>敬上<\/b>，比較有禮貌。"}]},{"h":"✏️ 第二課生字","body":[{"t":"table","head":["字","注音","課文語詞","字","注音","課文語詞"],"rows":[["泉","ㄑㄩㄢˊ","溫泉","抹","ㄇㄛˇ","抹在臉上"],["訝","ㄧㄚˋ","驚訝","牙","ㄧㄚˊ","牙齒"],["齒","ㄔˇ","牙齒","架","ㄐㄧㄚˋ","打架"],["速","ㄙㄨˋ","快速","彷","ㄈㄤˇ","彷彿"],["彿","ㄈㄨˊ","彷彿","汽","ㄑㄧˋ","汽水"],["區","ㄑㄩ","園區","恐","ㄎㄨㄥˇ","恐龍"],["陀","ㄊㄨㄛˊ","陀螺","螺","ㄌㄨㄛˊ","陀螺"],["聚","ㄐㄩˋ","團聚","","",""]]},{"t":"table","head":["最容易錯","這樣分"],"rows":[["<b>抹<\/b>／泡<b>沫<\/b>","用手抹，所以提手旁；有水的泡沫是三點水。兩個都念 ㄇㄛ，右邊都是「末」"],["驚<b>訝<\/b>／發<b>芽<\/b>","說話驚訝用言字旁；草發芽用草字頭。右邊都是「牙」"],["<b>彷彿<\/b>","兩個字都是<b>雙人旁<\/b>（彳），不是單人旁"],["<b>汽<\/b>水／<b>氣<\/b>泡","汽水的汽是三點水；空氣的氣是「气」"],["<b>陀螺<\/b>","陀是左耳旁、螺是虫字旁（田螺的螺）"]]},{"t":"write","id":"w2","q":"把這五個語詞各寫一遍：溫泉、驚訝、彷彿、陀螺、團聚","how":"用手指寫在白板上；寫在紙上的話按「📷 拍紙本」。"}]},{"h":"💡 句型和修辭","body":[{"t":"table","head":["句型","意思","例句"],"rows":[["以為……沒想到……","本來這樣想，結果不是這樣","我以為考試很難，沒想到都會寫。"],["實在太……了","非常、真的很","這個遊戲實在太有趣了。"],["……到底有多……呢？","很想知道答案","這條河到底有多長呢？"]]},{"t":"tiles","v":[{"em":"🤝","h":"轉化","p":"水和火竟然是<b>好朋友<\/b>：水火不是人，卻當成朋友。"},{"em":"🥤","h":"譬喻","p":"<b>彷彿<\/b>泡在汽水裡：彷彿＝好像。"},{"em":"⚖️","h":"映襯","p":"本來以為水火<b>不相容<\/b>，結果卻是<b>好朋友<\/b>，兩個相反的放一起。"}]}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「水火同源在哪裡？」→ <b>臺南<\/b>白河區關子嶺。","「蘇澳冷泉在哪裡？」→ <b>宜蘭<\/b>。","「『好久不見，近來好嗎？』是信的哪一部分？」→ <b>問候<\/b>。","「用『以為……沒想到……』造句。」→ 前後要相反才對。","「『彷彿』可以換成哪個詞？」→ <b>好像<\/b>。"]}]}]},{"id":"l3","nav":"📷 鏡頭下","intro":"第三課作者<b>沈芯菱<\/b>背著相機回到家鄉<b>雲林<\/b>，拍下辛苦工作的人。這課的字最容易錯，所以這站要<b>慢慢寫<\/b>。","cards":[{"h":"🎬 動畫課第 3 集","body":[{"t":"video","v":"lang4a-ep3.mp4?v=1101","poster":"lang4a-ep3.jpg","cap":"火車回雲林、城市像動物鄉村像植物、拍照記錄、金粉般的柳丁園。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"<b>考前<\/b>那支老師整理語詞解釋，最值得看；字形那支專門講「與」和「網」。"},{"t":"yt","id":"vjTjXeodF80","title":"第三課語詞解釋抽考題目","who":"市隱","len":"9 分","tag":"考前"},{"t":"yt","id":"C4qN3e0JCwQ","title":"課本 P28、P29：字形、多音字、我會辨字","who":"市隱","len":"10 分","tag":"字形"},{"t":"yt","id":"A1odOq-akRI","title":"課本 P24、P25 講解","who":"市隱","len":"10 分","tag":"課本"}]},{"h":"🗺️ 五段重點","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 230\" role=\"img\" aria-label=\"城市和鄉村的比較\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"230\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"14\" y=\"14\" width=\"212\" height=\"100\" rx=\"10\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"120\" y=\"40\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">🏙️ 城市的人<\/text><text x=\"120\" y=\"62\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">像動物般<\/text><text x=\"120\" y=\"84\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">總是忙碌，來來去去<\/text><rect x=\"244\" y=\"14\" width=\"212\" height=\"100\" rx=\"10\" fill=\"#B9DAA5\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"350\" y=\"40\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">🌾 鄉村的農人<\/text><text x=\"350\" y=\"62\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">像植物般<\/text><text x=\"350\" y=\"84\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">離不開耕耘的土地<\/text><path d=\"M20,160 Q120,130 235,160 T450,160\" fill=\"none\" stroke=\"#A8D3E6\" stroke-width=\"12\"/><text x=\"235\" y=\"150\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">濁水溪<\/text><text x=\"235\" y=\"188\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">茶葉、水果、地瓜、稻米和蔬菜<\/text><text x=\"235\" y=\"214\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">用鏡頭記錄家鄉的容顏，上網推廣農特產<\/text><\/svg>"},{"t":"table","head":["段","重點"],"rows":[["第一段","搭火車<b>南下<\/b>，高樓慢慢變成平房和農田，越過<b>濁水溪<\/b>就回到家鄉<b>雲林<\/b>。"],["第二段","城市人像<b>動物<\/b>般忙碌，農人像<b>植物<\/b>般離不開土地；沿著濁水溪種茶葉、水果、地瓜、稻米和蔬菜。"],["第三段","小時候和爸媽四處<b>走訪<\/b>，放學也<b>背著相機<\/b>到處走走，拍下辛苦工作的人。"],["第四段","十一月陽光照著<b>柳丁園<\/b>，像<b>金粉<\/b>從天上落下；柳丁是農人深切的<b>希望<\/b>。"],["第五段","<b>下田看農事、上網推廣農特產<\/b>，用<b>鏡頭記錄<\/b>家鄉的容顏。"]]},{"t":"tiles","v":[{"em":"🍭","h":"賣棉花糖","p":"作者拍下賣棉花糖的老先生。"},{"em":"🥁","h":"樂隊","p":"用力吹樂器，<b>鼓著腮幫子<\/b>。"},{"em":"🔧","h":"修單車","p":"辛苦修理單車的人。"},{"em":"🐟","h":"賣魚","p":"賣魚的年輕人。"},{"em":"📰","h":"撿字紙","p":"撿字紙的奶奶。"},{"em":"🌭","h":"烤香腸","p":"烤香腸的阿公。"}]},{"t":"guide","v":"為什麼要上網推廣？因為農產品賣不出去（<b>滯銷<\/b>），農人就沒有收入。作者用照片和網路幫農人的忙。"},{"t":"chant","v":"火車南下回雲林，動物植物比一比，背著相機拍辛苦，金粉柳丁是希望"}]},{"h":"✏️ 第三課生字（複習卷最多錯在這裡）","body":[{"t":"table","head":["字","注音","課文語詞","字","注音","課文語詞"],"rows":[["鏡","ㄐㄧㄥˋ","鏡頭","軌","ㄍㄨㄟˇ","軌道"],["樓","ㄌㄡˊ","高樓","與","ㄩˇ","平房與農田"],["耕","ㄍㄥ","耕耘","耘","ㄩㄣˊ","耕耘"],["蔬","ㄕㄨ","蔬菜","鼓","ㄍㄨˇ","鼓著"],["腮","ㄙㄞ","腮幫子","烤","ㄎㄠˇ","烤香腸"],["柳","ㄌㄧㄡˇ","柳丁","丁","ㄉㄧㄥ","柳丁"],["粉","ㄈㄣˇ","金粉","網","ㄨㄤˇ","上網"],["錄","ㄌㄨˋ","記錄","","",""]]},{"t":"table","head":["最容易錯","這樣分"],"rows":[["印<b>象<\/b>／好<b>像<\/b>","印象深刻的象<b>沒有<\/b>單人旁；好像、人像才有人。<b>不要寫成「印像」<\/b>"],["記<b>錄<\/b>／<b>綠<\/b>色／忙<b>碌<\/b>","記錄用金字旁；綠色用糸字旁；忙碌用石字旁"],["<b>烤<\/b>肉／手<b>銬<\/b>／<b>拷<\/b>貝","用火烤是火字旁；金屬手銬是金字旁；用手拷貝是提手旁"],["<b>鼓<\/b>勵","左邊是「壴」，右邊是「支」，不要寫成皮"],["<b>耕<\/b>作／水<b>井<\/b>","耕是耒字旁加井"],["<b>腮<\/b>幫子","臉上的肉，所以<b>月字旁（肉）<\/b>加思考的思"],["<b>軌<\/b>道／出<b>軌<\/b>","跟車有關，車字旁加九"],["身<b>影<\/b>","影子的影，右邊是三撇"]]},{"t":"write","id":"w3","q":"把這八個字各寫兩遍：樓、與、烤、鼓、耕、腮、影、象","how":"這幾個字卷子上錯過，寫完念給爸爸聽。"}]},{"h":"💡 語詞和成語","body":[{"t":"table","head":["語詞","意思"],"rows":[["軌道","供火車、電車行駛的鐵軌"],["高樓","高大的建築物"],["鏡頭","照相機或攝影機上，由透鏡組成的裝置"],["腮幫子","臉頰"],["容顏","面貌、相貌"],["推廣","擴充、開展，讓更多人知道"],["身影","人的影子、身體的樣子"],["印象","看過之後留在腦子裡的樣子"],["如詩如畫","景色美得像詩和畫"],["揮汗如雨","汗流得像下雨，形容很熱或很辛苦"],["走訪","親自去拜訪，跟「探訪」意思相近"]]},{"t":"vs","v":[{"h":"✅ 意思相近","p":"走訪 ≈ 探訪<br>聊天 ≈ 談天<br>揮汗如雨 ≈ 汗如雨下"},{"h":"❌ 意思相反","p":"飽滿 ↔ 乾枯<br>耕耘 ↔ 收穫<br>鄉村 ↔ 城市"}]},{"t":"trap","v":"「我下田看農事」不是去田裡玩，也不是抓昆蟲，是<b>看農田的生產活動<\/b>。「揮汗如雨」是真的流很多汗，像炎熱的夏天上完體育課才用得上。"},{"t":"table","head":["多音字","這樣念"],"rows":[["樂","樂隊 ㄩㄝˋ／快樂 ㄌㄜˋ"],["種","種植 ㄓㄨㄥˋ／種子 ㄓㄨㄥˇ"],["背","背著相機 ㄅㄟ／背後 ㄅㄟˋ"],["處","到處 ㄔㄨˋ／處理 ㄔㄨˇ"],["空","天空 ㄎㄨㄥ／有空 ㄎㄨㄥˋ"]]}]},{"h":"🧩 句型和修辭","body":[{"t":"tiles","v":[{"em":"🪞","h":"譬喻","p":"如<b>金粉<\/b>從天上落下般美麗；像<b>動物<\/b>般、像<b>植物<\/b>般。"},{"em":"⚖️","h":"映襯","p":"城市忙碌來去 vs 鄉村離不開土地，兩邊對比。"},{"em":"🔁","h":"類疊","p":"一<b>顆顆<\/b>、一<b>張張<\/b>、冷風<b>陣陣<\/b>。"}]},{"t":"table","head":["句型","例句"],"rows":[["即使……也……","<b>即使<\/b>冷風陣陣，<b>也<\/b>能感受到溫暖。<br>即使下大雨，我也要去上課。"],["一（顆顆）（香甜飽滿）的（柳丁）","一（朵朵）（美麗）的（小花）"]]},{"t":"text","id":"x3","q":"用「即使……也……」造一個句子。","how":"打一句話就好，前面是困難，後面是還是會做。"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「高高的（高樓）」「火車行駛的鐵軌（軌道）」「臉頰（腮幫子）」→ 語詞解釋題要背。","「作者走過村裡的石子路，拍下照片，用鏡頭（記錄）家鄉。」→ 記<b>錄<\/b>。","「他的髮色讓我留下深刻的（印象）。」→ 印<b>象<\/b>。","「下面哪一組部首相同？」→ 選項要一個一個查：<b>烤<\/b>是火部，<b>考<\/b>是老部，長得像也不一定同部首。","「『我下田看農事』是做什麼？」→ <b>看農田的生產活動<\/b>。"]}]}]},{"id":"l4","nav":"✈️ 飛行夢","intro":"第四課講<b>萊特兄弟<\/b>怎麼發明飛機。別人都笑他們，他們還是一次又一次試驗。這課的考點是<b>順序<\/b>和<b>成語<\/b>。","cards":[{"h":"🎬 動畫課第 4 集","body":[{"t":"video","v":"lang4a-ep4.mp4?v=1101","poster":"lang4a-ep4.jpg","cap":"老鷹、自行車行、研究鳥類、汽車動力、1903 年 12 月 17 日、紀念碑。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"<b>預習題目<\/b>那支最短；生字和多音字看第二支；成語造句看第三支。"},{"t":"yt","id":"-SElhx45Tc4","title":"課本 P40、P41 預習題目","who":"市隱","len":"6 分","tag":"題目"},{"t":"yt","id":"c4jwKHBlKEI","title":"課本 P44、P45：字形、多音字、成語造句","who":"市隱","len":"13 分","tag":"字形"},{"t":"yt","id":"3zD1GgDUAjs","title":"課本 P42-2、P43 講解：成語、修辭","who":"市隱","len":"9 分","tag":"課本"}]},{"h":"🛫 飛機誕生的順序","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 236\" role=\"img\" aria-label=\"飛機發明的過程\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"236\" rx=\"14\" fill=\"#FFFCF6\"/><defs><marker id=\"arP\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#3E3A39\"/><\/marker><\/defs><text x=\"235\" y=\"26\" font-size=\"18\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">萊特兄弟的飛行夢<\/text><rect x=\"12\" y=\"44\" width=\"78\" height=\"118\" rx=\"10\" fill=\"#FFF3D6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"51\" y=\"82\" font-size=\"28\"  fill=\"#3E3A39\" text-anchor=\"middle\">🦅<\/text><text x=\"51\" y=\"112\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">看老鷹<\/text><text x=\"51\" y=\"136\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">夢想飛<\/text><line x1=\"91\" y1=\"102\" x2=\"103\" y2=\"102\" stroke=\"#3E3A39\" stroke-width=\"2\" marker-end=\"url(#arP)\"/><rect x=\"104\" y=\"44\" width=\"78\" height=\"118\" rx=\"10\" fill=\"#FFF3D6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"143\" y=\"82\" font-size=\"28\"  fill=\"#3E3A39\" text-anchor=\"middle\">🚲<\/text><text x=\"143\" y=\"112\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">自行車行<\/text><text x=\"143\" y=\"136\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">沒忘記夢想<\/text><line x1=\"183\" y1=\"102\" x2=\"195\" y2=\"102\" stroke=\"#3E3A39\" stroke-width=\"2\" marker-end=\"url(#arP)\"/><rect x=\"196\" y=\"44\" width=\"78\" height=\"118\" rx=\"10\" fill=\"#FFF3D6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"235\" y=\"82\" font-size=\"28\"  fill=\"#3E3A39\" text-anchor=\"middle\">🐦<\/text><text x=\"235\" y=\"112\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">研究鳥<\/text><text x=\"235\" y=\"136\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">控制方向<\/text><line x1=\"275\" y1=\"102\" x2=\"287\" y2=\"102\" stroke=\"#3E3A39\" stroke-width=\"2\" marker-end=\"url(#arP)\"/><rect x=\"288\" y=\"44\" width=\"78\" height=\"118\" rx=\"10\" fill=\"#FFF3D6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"327\" y=\"82\" font-size=\"28\"  fill=\"#3E3A39\" text-anchor=\"middle\">🚗<\/text><text x=\"327\" y=\"112\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">靈光一閃<\/text><text x=\"327\" y=\"136\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">加汽車動力<\/text><line x1=\"367\" y1=\"102\" x2=\"379\" y2=\"102\" stroke=\"#3E3A39\" stroke-width=\"2\" marker-end=\"url(#arP)\"/><rect x=\"380\" y=\"44\" width=\"78\" height=\"118\" rx=\"10\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"419\" y=\"82\" font-size=\"28\"  fill=\"#3E3A39\" text-anchor=\"middle\">✈️<\/text><text x=\"419\" y=\"112\" font-size=\"14\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">1903<\/text><text x=\"419\" y=\"136\" font-size=\"13\"  fill=\"#3E3A39\" text-anchor=\"middle\">12 月 17 日<\/text><text x=\"235\" y=\"194\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">弟弟開飛機，地點：美國北卡羅萊納州小鷹鎮<\/text><text x=\"235\" y=\"220\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">別人笑他們異想天開，他們仍然一次又一次試驗<\/text><\/svg>"},{"t":"table","head":["順序","發生什麼事"],"rows":[["1","小時候看到天空飛翔的<b>老鷹<\/b>，夢想像老鷹一樣飛。"],["2","長大後在<b>自行車行<\/b>工作，無論多忙碌，都沒有忘記夢想。"],["3","當時用<b>滑翔機<\/b>做實驗，但無法精準控制方向，常發生意外。"],["4","他們以<b>安全<\/b>為目標改良，細心研究<b>鳥類<\/b>控制方向的原理。"],["5","哥哥看到<b>汽車<\/b>，靈光一閃：把汽車的<b>動力<\/b>用在滑翔機上。"],["6","別人說他們<b>異想天開<\/b>，他們仍然一次又一次試驗。"],["7","<b>1903 年 12 月 17 日<\/b>早上，在美國<b>北卡羅萊納州小鷹鎮<\/b>，弟弟開著飛機升空成功。"],["8","人們立了<b>紀念碑<\/b>；一百年後，美國總統小布希也特別感謝他們。"]]},{"t":"vs","v":[{"h":"👦 哥哥","p":"威爾伯・萊特<br>靈光一閃想到汽車動力"},{"h":"🧒 弟弟","p":"奧維爾・萊特<br>第一次開飛機升空的人"}]},{"t":"chant","v":"看老鷹，修單車，研究鳥兒裝引擎，一九〇三飛上天"},{"t":"trap","v":"複習卷的陷阱：萊特兄弟<b>不是英國人<\/b>，是美國人；讓他們想飛的是<b>老鷹<\/b>，不是鴿子。"}]},{"h":"✏️ 第四課生字","body":[{"t":"table","head":["字","注音","課文語詞","字","注音","課文語詞"],"rows":[["兄","ㄒㄩㄥ","兄弟","翔","ㄒㄧㄤˊ","飛翔"],["鷹","ㄧㄥ","老鷹","論","ㄌㄨㄣˋ","無論"],["控","ㄎㄨㄥˋ","控制","制","ㄓˋ","控制"],["命","ㄇㄧㄥˋ","生命","義","ㄧˋ","意義"],["標","ㄅㄧㄠ","目標","良","ㄌㄧㄤˊ","改良"],["研","ㄧㄢˊ","研究","靈","ㄌㄧㄥˊ","靈光一閃"],["升","ㄕㄥ","升空","紀","ㄐㄧˋ","紀念碑"],["碑","ㄅㄟ","紀念碑","","",""]]},{"t":"table","head":["最容易錯","這樣分"],"rows":[["老<b>鷹<\/b>／<b>應<\/b>該","老鷹是鳥，下面是「鳥」；應該是心裡的事，下面是「心」"],["無<b>論<\/b>／<b>倫<\/b>理／車<b>輪<\/b>","說話討論用言字旁；人的倫理用單人旁；車子的輪用車字旁"],["<b>紀<\/b>念／<b>記<\/b>得","紀律、紀念用糸字旁；記得、日記用言字旁"],["<b>碑<\/b>／招<b>牌<\/b>","石頭刻的碑是石字旁；木片做的牌是片字旁"],["意<b>義<\/b>／會<b>議<\/b>","意義沒有偏旁；開會討論的會議有言字旁"],["控<b>制<\/b>／<b>製<\/b>造","制度、控制是刀（刂）；做衣服、製造下面有「衣」"],["<b>靈<\/b>巧","上面雨字頭、中間三個口、下面巫，一筆一筆寫"],["優<b>良<\/b>／目<b>標<\/b>","改錯字題常考，良不要多一撇，標是木字旁"]]},{"t":"write","id":"w4","q":"把這六個語詞各寫一遍：意義、紀念碑、靈光一閃、老鷹、控制、目標","how":"用手指寫在白板上；寫在紙上的話按「📷 拍紙本」。"}]},{"h":"💡 成語和句型","body":[{"t":"table","head":["成語","意思","對的用法"],"rows":[["靈光一閃","突然想到好主意","他靈光一閃，想出解題的方法。"],["異想天開","想法奇特、不符合實際","想用雨傘飛上天，真是異想天開。"],["左思右想","反覆的想了又想","這題很難，我左思右想才寫出來。"],["良藥苦口","勸人的話不好聽，卻對人有益（課外補充）","媽媽的話是良藥苦口，要聽進去。"]]},{"t":"trap","v":"題目問「用法錯誤」時，要看後面合不合理：「大家都說她異想天開，但她不斷嘗試，最後成功」✅。「爸爸不管多忙，<b>都會<\/b>回家陪我們吃晚餐」✅。「聽到獲獎所有人為他歡呼」✅。「他左思右想，<b>沒有猶豫的立刻<\/b>做了決定」❌ 想了又想怎麼會立刻？"},{"t":"table","head":["句型","例句"],"rows":[["無論……都……","<b>無論<\/b>工作多忙碌，他們<b>都<\/b>沒有忘記夢想。"],["讓（誰）能夠（做什麼）","讓<b>我們<\/b>能夠<b>飛上天空<\/b>。"],["一次又一次的（試驗）","一次又一次的<b>練習<\/b>"]]},{"t":"table","head":["多音字","這樣念"],"rows":[["行","飛行 ㄒㄧㄥˊ／自行車行 ㄏㄤˊ／銀行 ㄏㄤˊ"],["長","長大 ㄓㄤˇ／長短 ㄔㄤˊ"],["當","當時 ㄉㄤ／上當 ㄉㄤˋ"]]},{"t":"text","id":"x4","q":"用「無論……都……」造一個句子。","how":"打一句話就好。"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「『如果失去生命，飛翔還有什麼意義？』」→ 用問句強調生命最重要（設問）。","「他像羚羊一樣，快速的跑到終點。」→ <b>譬喻<\/b>。","「人們在第一次試飛的地方立了紀念碑。」→ ⭕ 對。","「萊特兄弟曾經改良滑翔機控制方向的精準度。」→ ⭕ 對。","「只要（運用）公式，就能解出這題。」「活動時，請遵守（秩序）。」→ 選詞填寫看前後文。"]}]}]},{"id":"l5","nav":"🌙 月光下","intro":"第五課作者<b>林茵<\/b>和家人晚上到河邊散步，看著月亮想了好多問題。這課最美的是<b>描寫月光的句子<\/b>，考試很愛考。","cards":[{"h":"🎬 動畫課第 5 集","body":[{"t":"video","v":"lang4a-ep5.mp4?v=1101","poster":"lang4a-ep5.jpg","cap":"黑色布幕、皎潔、水中月影、叔叔和古人看到的月亮、白玉盤和妝鏡。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"這課影片比較長，<b>字形<\/b>那支最短，先看它；課文深究那支可以分兩次看。"},{"t":"yt","id":"MFftcrO-24s","title":"課本 P54、P55：生字、字形、多音字","who":"市隱","len":"7 分","tag":"字形"},{"t":"yt","id":"XUOYStkPDvc","title":"課本 P48～P51 預習題目","who":"市隱","len":"9 分","tag":"題目"},{"t":"yt","id":"OGUk7_v4clM","title":"課本 P50-1 講解","who":"市隱","len":"9 分","tag":"課本"}]},{"h":"🌙 一家人在河邊","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 270\" role=\"img\" aria-label=\"月光下的河邊\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"270\" rx=\"14\" fill=\"#FFFCF6\"/><rect x=\"10\" y=\"10\" width=\"450\" height=\"130\" fill=\"#5B5F73\"/><rect x=\"10\" y=\"140\" width=\"450\" height=\"120\" fill=\"#A8D3E6\"/><circle cx=\"235\" cy=\"66\" r=\"36\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2\"/><ellipse cx=\"235\" cy=\"190\" rx=\"32\" ry=\"14\" fill=\"#F6D27A\" opacity=\".85\"/><path d=\"M170,214 q16,-8 32,0 t32,0 t32,0 t32,0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"235\" y=\"120\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">像掛在黑色布幕上<\/text><text x=\"235\" y=\"246\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">水中也有一個月亮：倒映的月影<\/text><text x=\"90\" y=\"60\" font-size=\"16\"  fill=\"#fff\" text-anchor=\"middle\">皎潔的<\/text><text x=\"90\" y=\"84\" font-size=\"16\"  fill=\"#fff\" text-anchor=\"middle\">光芒<\/text><text x=\"385\" y=\"60\" font-size=\"16\"  fill=\"#fff\" text-anchor=\"middle\">天地<\/text><text x=\"385\" y=\"84\" font-size=\"16\"  fill=\"#fff\" text-anchor=\"middle\">無聲<\/text><\/svg>"},{"t":"table","head":["段","重點"],"rows":[["看景色","月白風清的夜晚，一家人在<b>河邊散步<\/b>。月亮像掛在<b>黑色布幕<\/b>上，散發<b>皎潔<\/b>的光芒；水中也有一個月亮。"],["想問題","想起中秋<b>團圓<\/b>賞月，<b>人在國外的叔叔<\/b>看到的月亮和我們一樣嗎？<b>古人<\/b>也看過同一個月亮嗎？"],["聽回答","爸爸說：無論在哪裡，看到的都是<b>同一個月亮<\/b>。媽媽說：古人也看過這個月亮，它是作詩的<b>靈感<\/b>。"],["文學的月亮","<b>李白<\/b>把月亮比成<b>白玉盤<\/b>，又像是<b>仙人手中的妝鏡<\/b>。文學家筆下的月亮美妙動人。"],["新的問題","科學家眼中的月球如何？太空人看到什麼？作者決定<b>明天<\/b>再去尋找答案。"]]},{"t":"chant","v":"布幕掛月亮，水中有月影，白玉盤和妝鏡，明天找答案"}]},{"h":"🪞 美麗的句子這樣寫","body":[{"t":"table","head":["修辭","課文的例子"],"rows":[["譬喻","月亮<b>像<\/b>掛在黑色布幕上；像是白玉盤，又像是仙人手中的妝鏡"],["轉化","好作品<b>吸收<\/b>了月光，靜靜的在書中發亮；河水搖動著波光"],["設問","古人也曾見過嗎？科學家眼中的月球，又是如何呢？"],["類疊","<b>靜靜<\/b>的在書中發亮"]]},{"t":"table","head":["句型","例句"],"rows":[["像是……又像是……","雲朵<b>像是<\/b>棉花，<b>又像是<\/b>棉花糖。"],["不只……而且……","月亮<b>不只<\/b>美麗，<b>而且<\/b>讓人想很多事。"],["散發著（皎潔）的（光芒）","散發著（迷人）的（香味）"]]},{"t":"guide","v":"作者「踩著銀白色的月光」回家，月光踩不到，這樣寫是不是很美？"}]},{"h":"✏️ 第五課生字","body":[{"t":"table","head":["字","注音","課文語詞","字","注音","課文語詞"],"rows":[["掛","ㄍㄨㄚˋ","掛在","皎","ㄐㄧㄠˇ","皎潔"],["凝","ㄋㄧㄥˊ","凝視","曾","ㄘㄥˊ","曾經"],["考","ㄎㄠˇ","思考","輪","ㄌㄨㄣˊ","一輪"],["徘","ㄆㄞˊ","徘徊","徊","ㄏㄨㄞˊ","徘徊"],["瑤","ㄧㄠˊ","瑤臺","妝","ㄓㄨㄤ","妝鏡"],["科","ㄎㄜ","科學家","登","ㄉㄥ","登上"],["循","ㄒㄩㄣˊ","循路","尋","ㄒㄩㄣˊ","尋找"],["案","ㄢˋ","答案","","",""]]},{"t":"table","head":["最容易錯","這樣分"],"rows":[["<b>皎<\/b>潔／學<b>校<\/b>","白色發亮是白字旁；皎念第三聲 ㄐㄧㄠˇ，不是ㄐㄧㄠ"],["<b>凝<\/b>視／懷<b>疑<\/b>","凝是兩點水（冰），念 ㄋㄧㄥˊ；懷疑沒有兩點水"],["<b>循<\/b>路／<b>尋<\/b>找","兩個都念 ㄒㄩㄣˊ：循是雙人旁，順著路走；尋是手找東西"],["<b>徘徊<\/b>","兩個都是<b>雙人旁<\/b>，意思是走來走去"],["<b>妝<\/b>鏡／化<b>妝<\/b>","跟女生打扮有關，所以右邊是女"],["<b>案<\/b>／<b>安<\/b>","答案的案下面有木"]]},{"t":"table","head":["多音字","這樣念"],"rows":[["曾","曾經 ㄘㄥˊ／姓曾 ㄗㄥ"],["倒","倒映 ㄉㄠˋ／跌倒 ㄉㄠˇ"]]},{"t":"write","id":"w5","q":"把這五個語詞各寫一遍：皎潔、凝視、曾經、徘徊、尋找","how":"用手指寫在白板上；寫在紙上的話按「📷 拍紙本」。"}]},{"h":"💡 語詞意思","body":[{"t":"table","head":["語詞","意思"],"rows":[["皎潔","明亮潔白，常用來形容月光"],["凝視","聚精會神的看"],["思考","仔細的想"],["徘徊","在一個地方走來走去"],["瑤臺","傳說中仙人住的地方"],["循路","順著路走"],["浮現","腦海裡出現"],["動人","很美，讓人感動"]]}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「作者和家人在哪裡看月亮？」→ <b>河邊<\/b>。","「作者想知道的兩件事？」→ <b>國外的叔叔<\/b>和<b>古人<\/b>看到的是不是同一個月亮。","「李白把月亮比成什麼？」→ <b>白玉盤<\/b>、<b>仙人的妝鏡<\/b>。","「『月亮像掛在黑色布幕上』是什麼修辭？」→ <b>譬喻<\/b>。","「作者最後決定？」→ <b>早點睡覺，明天再去尋找答案<\/b>。"]}]}]},{"id":"l6","nav":"🌕 又遠又近","intro":"第六課接著第五課！作者第二天去<b>圖書館<\/b>查資料，發現科學的月球和文學的月亮完全不一樣。我的家也在這課喔，是<b>玉兔搗藥<\/b>！","cards":[{"h":"🎬 動畫課第 6 集","body":[{"t":"video","v":"lang4a-ep6.mp4?v=1101","poster":"lang4a-ep6.jpg","cap":"45 億歲、隕石撞坑、38 萬公里、騎單車三年、阿姆斯壯的玩笑、又遠又近。"}]},{"h":"📺 換老師再講一次","body":[{"t":"guide","v":"這課老師目前只上到前面，兩支都講生字和題目，挑一支看就好。"},{"t":"yt","id":"yEr_Aj9Ho20","title":"課本 P59～P63 預習題目","who":"市隱","len":"15 分","tag":"題目"},{"t":"yt","id":"_E-QT9eEfVk","title":"課本 P58、P59 講解：字形、課文深究","who":"市隱","len":"14 分","tag":"課本"}]},{"h":"🚀 作者查到了什麼","body":[{"t":"svg","v":"<svg viewBox=\"0 0 470 262\" role=\"img\" aria-label=\"地球到月球的距離\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"262\" rx=\"14\" fill=\"#FFFCF6\"/><defs><marker id=\"arD\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#3E3A39\"/><\/marker><\/defs><circle cx=\"52\" cy=\"84\" r=\"34\" fill=\"#A8D3E6\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><text x=\"52\" y=\"90\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">地球<\/text><circle cx=\"412\" cy=\"84\" r=\"20\" fill=\"#F6D27A\" stroke=\"#3E3A39\" stroke-width=\"2.5\"/><text x=\"412\" y=\"90\" font-size=\"16\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">月<\/text><line x1=\"90\" y1=\"84\" x2=\"388\" y2=\"84\" stroke=\"#3E3A39\" stroke-width=\"2.5\" marker-end=\"url(#arD)\"/><text x=\"235\" y=\"34\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">最近 36 萬公里 ⇄ 最遠 40 萬公里<\/text><text x=\"235\" y=\"70\" font-size=\"18\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">平均 38 萬公里<\/text><rect x=\"40\" y=\"124\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#FFF3D6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"130\" y=\"150\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">✈️ 搭飛機<\/text><text x=\"130\" y=\"172\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">要花上半個月<\/text><rect x=\"250\" y=\"124\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#FFF3D6\" stroke=\"#3E3A39\" stroke-width=\"2\"/><text x=\"340\" y=\"150\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">🚲 騎單車<\/text><text x=\"340\" y=\"172\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">要騎三年<\/text><text x=\"235\" y=\"226\" font-size=\"15\" font-weight=\"700\" fill=\"#3E3A39\" text-anchor=\"middle\">科學的月球：很遠　文學的月亮：好像近在身邊<\/text><text x=\"235\" y=\"248\" font-size=\"15\"  fill=\"#3E3A39\" text-anchor=\"middle\">所以叫「又遠又近」<\/text><\/svg>"},{"t":"tiles","v":[{"em":"📰","h":"新聞","p":"作者第二天去<b>圖書館<\/b>，看到書上報導的<b>登月<\/b>新聞。"},{"em":"🪨","h":"坑洞","p":"月球約 <b>45 億歲<\/b>，沒有水和空氣保護，常被<b>隕石撞擊<\/b>，所以到處是坑洞。"},{"em":"🐰","h":"黑影","p":"坑洞在陽光照射下有各種<b>黑影<\/b>，作者猜這也許就是古人想像「<b>玉兔搗藥<\/b>」的原因。"},{"em":"👨‍🚀","h":"趣聞","p":"老師說：<b>阿姆斯壯<\/b>登月時，管制中心開玩笑要他找找看有沒有漂亮姑娘帶著兔子。"},{"em":"🥮","h":"中秋","p":"科學揭開真相，美麗的<b>神話<\/b>會不會消失呢？作者覺得不會。"}]},{"t":"reveal","ref":"g3","v":"騎單車要騎<b>三年<\/b>！搭飛機也要半個月。月球距離地球平均 <b>38 萬公里<\/b>。"},{"t":"vs","v":[{"h":"🔭 科學的月球（遠）","p":"離地球平均 38 萬公里<br>坑洞、隕石<br>用研究和資料認識"},{"h":"📜 文學的月亮（近）","p":"嫦娥、玉兔、李白的詩<br>中秋節吃月餅時聊著<br>好像就在身邊"}]},{"t":"chant","v":"三十六四十，平均三十八；飛機半個月，單車騎三年"}]},{"h":"✏️ 第六課生字","body":[{"t":"table","head":["字","注音","課文語詞","字","注音","課文語詞"],"rows":[["館","ㄍㄨㄢˇ","圖書館","億","ㄧˋ","四十五億"],["隕","ㄩㄣˇ","隕石","撞","ㄓㄨㄤˋ","撞擊"],["擊","ㄐㄧ","撞擊","坑","ㄎㄥ","坑洞"],["射","ㄕㄜˋ","照射","狀","ㄓㄨㄤˋ","形狀"],["距","ㄐㄩˋ","距離","萬","ㄨㄢˋ","萬公里"],["里","ㄌㄧˇ","公里","均","ㄐㄩㄣ","平均"],["騎","ㄑㄧˊ","騎單車","餅","ㄅㄧㄥˇ","月餅"],["揭","ㄐㄧㄝ","揭開","","",""]]},{"t":"table","head":["最容易錯","這樣分"],"rows":[["形<b>狀<\/b>／阿姆斯<b>壯<\/b>","形狀右邊是犬；強壯右邊是士。兩個都念 ㄓㄨㄤˋ"],["圖書<b>館<\/b>／<b>管<\/b>制","放書吃飯的地方是食字旁；管東西是竹字頭"],["<b>撞<\/b>擊／兒<b>童<\/b>","用手去撞，提手旁加童"],["<b>揭<\/b>開／口<b>渴<\/b>／<b>喝<\/b>水","用手揭，提手旁；渴是水、喝是口，右邊都是「曷」"],["<b>距<\/b>離／<b>拒<\/b>絕","距離跟腳步有關，足字旁；拒絕是提手旁"],["<b>隕<\/b>石／<b>圓<\/b>形","隕是左耳旁（從高處掉下來），不是圓形的圓"],["平<b>均<\/b>／土<b>地<\/b>","均是土字旁加勻"]]},{"t":"write","id":"w6","q":"把這五個語詞各寫一遍：隕石、撞擊、形狀、距離、揭開","how":"用手指寫在白板上；寫在紙上的話按「📷 拍紙本」。"}]},{"h":"💡 句型和修辭","body":[{"t":"table","head":["句型","意思","例句"],"rows":[["由於……因而……","因為這樣，所以那樣","<b>由於<\/b>表面沒有保護，<b>因而<\/b>到處都是坑洞。"],["就算……也……","再怎麼樣還是","<b>就算<\/b>搭飛機，<b>也<\/b>要花上半個月。"],["既然……那麼……","已經這樣，接下來","<b>既然<\/b>這麼遠，<b>那麼<\/b>嫦娥是怎麼去的呢？"]]},{"t":"tiles","v":[{"em":"⚖️","h":"映襯","p":"科學的月球<b>遠<\/b> vs 文學的月亮<b>近<\/b>，兩個相反的放在一起。"},{"em":"❓","h":"設問","p":"嫦娥是怎樣到月亮的呢？神話會不會消失呢？"}]},{"t":"trap","v":"題目問「又遠又近」的意思：<b>遠<\/b>是真正的距離，<b>近<\/b>是心裡的感覺，不是月亮一下子靠近一下子離開。"}]},{"h":"📝 考試會這樣問","body":[{"t":"list","v":["「月球表面為什麼有坑洞？」→ <b>沒有水和空氣保護，被隕石撞擊<\/b>。","「月球離地球平均多遠？」→ <b>38 萬公里<\/b>。","「作者猜玉兔搗藥是怎麼想像出來的？」→ 坑洞在<b>陽光照射下的黑影<\/b>。","「為什麼說月亮又遠又近？」→ 科學上很遠，文學上好像<b>近在身邊<\/b>。","「用『由於……因而……』造句。」→ 前面原因，後面結果。"]}]}]},{"id":"fin","nav":"✍️ 出場券","intro":"第 5 天：闖關和錯題本都做完了嗎？最後完成這三題，再按「📤 傳給爸爸」，你就是語文小冒險家了！","cards":[{"h":"✍️ 出場券第 1 題：易錯字大考驗","body":[{"t":"write","id":"wf","q":"不要看書，把這十個語詞 拉住親愛的春天」的是誰？","o":["鳳梨","香蕉","椰子樹","小朋友"],"a":2,"e":"綠色的椰子樹伸著大手掌，拉住春天。"},{"tag":"看懂","s":"課文說，月球表面為什麼到處都是坑洞？","o":["太空人挖的","下雨沖出來的","火山一直噴發","被無數隕石撞擊"],"a":3,"e":"月球沒有水和空氣保護，每天受到隕石撞擊。"},{"tag":"看懂","s":"第二課裡，「水火同源」在哪裡？","o":["宜蘭蘇澳","臺南關子嶺","雲林濁水溪","美國小鷹鎮"],"a":1,"e":"水火同源在臺南白河區的關子嶺。蘇澳是冷泉。"},{"tag":"課本","s":"哪一句的字完全正確？","o":["這張照片讓我留下深刻的印像。","他用鏡頭記綠家鄉的樣子。","他們坐在屋頂上烤肉，印象深刻。","老師鼓勵我把文章投稿，我感到很驚呀。"],"a":2,"e":"印象的象沒有單人旁、記錄用金字旁、驚訝用言字旁。"},{"tag":"課本","s":"「喝了一杯有泡（　）的紅茶。」括號要填哪個字？","o":["未","末","抹","沫"],"a":3,"e":"泡沫有水，所以三點水。抹是用手抹，提手旁。"},{"tag":"課本","s":"下面「　」中的字，哪一個讀音和其他三個不同？","o":["「忠」實","始「終」","「重」要","時「鐘」"],"a":2,"e":"忠、終、鐘都念 ㄓㄨㄥ，重要的重念 ㄓㄨㄥˋ。"},{"tag":"課本","s":"哪一組字的部首相同？","o":["隊／隔","甜／話","椰／伴","唾／如"],"a":0,"e":"隊和隔都是左耳旁（阜）。甜是甘、話是言；椰是木、伴是人；唾是口、如是女。"},{"tag":"課本","s":"在信裡，「好久不見，近來好嗎？」屬於哪一部分？","o":["稱呼","問候","祝福","署名"],"a":1,"e":"開頭跟對方打招呼，就是問候。"},{"tag":"課本","s":"安安寫信給表姐柔柔，最後署名怎麼寫最有禮貌？","o":["安安","表妹安安上","你的安安","表妹安安敬上"],"a":3,"e":"寫給比自己大的人用「敬上」。課文裡安安就是這樣寫的。"},{"tag":"課本","s":"安安泡蘇澳冷泉，怎麼形容那種感覺？","o":["泡完皮膚變白白","牙齒打架，彷彿泡在汽水裡","水裡不斷冒出火","可以把泥抹在臉上"],"a":1,"e":"冷到牙齒打架，氣泡布滿全身像汽水。冒火和抹泥是臺南的事。"},{"tag":"課本","s":"哪一組語詞意思相近？","o":["飽滿／乾枯","耕耘／收穫","走訪／探訪","鄉村／城市"],"a":2,"e":"走訪和探訪都是親自去看。其他三組意思不同或相反。"},{"tag":"課本","s":"「我下田看農事」是什麼意思？","o":["看農田的生產活動","和朋友到田裡玩","幫工人拍照","到田裡捉昆蟲"],"a":0,"e":"農事就是農田的工作，也就是生產活動。"},{"tag":"課本","s":"哥哥「靈光一閃」想到了什麼？","o":["研究老鷹的羽毛","把滑翔機改成腳踏車","把汽車的動力應用在滑翔機上","在小鷹鎮立紀念碑"],"a":2,"e":"他看到汽車經過，想到把汽車的動力來源用在滑翔機。"},{"tag":"課本","s":"「自行車行」最後一個字「行」要念什麼？","o":["ㄒㄧㄥˊ","ㄒㄧㄥˋ","ㄏㄤˊ","ㄏㄤˋ"],"a":2,"e":"車行、銀行的行念 ㄏㄤˊ；飛行、自行車的「自行」念 ㄒㄧㄥˊ。"},{"tag":"課本","s":"〈月光下〉提到李白把月亮比成什麼？","o":["白玉盤","黑色布幕","銀白色的路","大月餅"],"a":0,"e":"白玉盤是李白的比喻，也像仙人手中的妝鏡。黑色布幕是作者自己的比喻。"},{"tag":"挑戰","s":"「唾手可得」是比喻很容易得到。哪一句用對了？","o":["將軍對國君唾手可得，不能做出叛亂的事。","憑他的實力，第一志願對他而言是唾手可得，不用替他操心。","弟弟的筆跡唾手可得，媽媽要他擦掉重寫。","姐姐練了十年才唾手可得這個獎。"],"a":1,"e":"實力很好所以很容易錄取，用得正確。練十年就不是「很容易」了。"},{"tag":"挑戰","s":"「網開一面」比喻寬大仁厚，對犯錯的人從寬處置。哪一句用對了？","o":["面對犯人誠心的悔悟，法官決定網開一面，再給他改過的機會。","這件案子居然還有網開一面，沒有受到制裁。","宰相利用權勢，將不贊成自己的人網開一面。","他網開一面的抓了很多魚。"],"a":0,"e":"悔悟後從寬處理，才是網開一面的意思。"},{"tag":"挑戰","s":"哪一句前後意思矛盾，不合理？","o":["大家都說她異想天開，但她不斷嘗試，最後成功了。","聽到他獲獎的消息，所有人都為他高聲歡呼。","爸爸無論再怎麼忙，都會回家陪我們吃晚餐。","他左思右想，沒有猶豫的立刻做了決定。"],"a":3,"e":"左思右想是想了又想，和「沒有猶豫、立刻」互相矛盾。"},{"tag":"挑戰","s":"哪一句用了「轉化」的寫法？","o":["便利商店就在郵局的右邊。","星星頑皮的眨著眼睛。","小嘉看到一隻很可愛的螃蟹。","妹妹的臉像蘋果一樣紅。"],"a":1,"e":"星星不會頑皮、不會眨眼，把它當成人來寫。妹妹那句有「像」，是譬喻。"},{"tag":"挑戰","s":"「柳丁園的景象，如金粉從天上落下般美麗。」這句是什麼修辭？","o":["設問","轉化","類疊","譬喻"],"a":3,"e":"把柳丁園的景象比成金粉，有「如」，是譬喻。"},{"tag":"挑戰","s":"哪一句「即使……也……」用得正確？","o":["即使天氣很好，我也去操場玩。","即使我吃飽了，所以不想吃。","即使很累，他也要把功課寫完。","即使考一百分，媽媽很開心。"],"a":2,"e":"即使後面接困難，也後面接還是會做。第二、四句少了「也」或接錯，第一句沒有困難。"},{"tag":"挑戰","s":"閱讀後回答：","src":"科學告訴我們，月球是一個布滿坑洞的星球，距離地球大約 38 萬公里。可是每到中秋節，大家一邊吃月餅，一邊聊著嫦娥和玉兔。","s2":"為什麼作者說月亮「又遠又近」？","o":["月亮有時候離地球遠，有時候馬上變到身邊","科學上距離很遠，文學和生活裡卻好像就在身邊","望遠鏡看很近，用眼睛看很遠","白天很遠，晚上很近"],"a":1,"e":"遠是真實距離，近是心裡的感覺。"},{"tag":"挑戰","s":"「（　）月球沒有水和空氣保護，（　）到處都是坑洞。」括號應填哪一組？","o":["由於／因而","雖然／但是","如果／就","不但／而且"],"a":0,"e":"前面是原因，後面是結果，用「由於……因而……」。"},{"tag":"挑戰","s":"老師請同學說課文內容，誰說對了？","o":["小安：萊特兄弟是英國人。","小傑：安安住在臺南。","小美：作者用鏡頭記錄家鄉，也上網推廣農特產。","小花：〈月光下〉作者當晚就在網路查到答案。"],"a":2,"e":"萊特兄弟是美國人；安安住宜蘭；〈月光下〉作者決定明天再去尋找答案。"},{"tag":"挑戰","s":"「寒流來襲，媽媽叮嚀要穿保暖衣物，免得受了（甲）。」「朋友騙了他，讓他覺得很（乙）。」甲、乙依序是？","o":["心寒／風寒","寒流／心寒","風寒／寒流","風寒／心寒"],"a":3,"e":"受涼生病是風寒；失望難過是心寒。"}],"sources":[{"t":"教育百科生字詞彙表（翰林四上第一～六課）","u":"https://pedia.cloud.edu.tw/Bookmark/Textword?category=%E5%9C%8B%E8%AA%9E&year=113_1&degree=4&press=%E7%BF%B0%E6%9E%97%E7%89%88"},{"t":"市隱「115-1 翰林 4 上國語」各課播放清單","u":"https://www.youtube.com/@市隱/playlists"},{"t":"vocus 翰林四上國語期中複習整理（補第二、五課）","u":"https://vocus.cc/article/6add066afd89780001b59c08"},{"t":"pixnet 請到我的家鄉來整理（補第二課）","u":"https://acerksy.pixnet.net/blog/post/221423895"}]};
// 作答同步（學習小站 study-hub）：網頁 → ntfy.sh → Mac mini。renderPage／renderHome 會把整份檔案嵌進頁面。
// 鑰匙：第一次用「網址#k=鑰匙」打開任何一頁就記在這台平板（同網域每頁共用），#k=off 取消；沒有鑰匙時完全不作用。
// 頻道與加密鑰匙都由鑰匙推出（和 Mac 的 study_hub.py 同一套規則）：
//   收件 sh-<sha256("in:"+鑰匙) 前 24 碼>、回條 sh-<sha256("st:"+鑰匙) 前 24 碼>、AES-GCM 鑰匙 sha256("enc:"+鑰匙)
// 作答先排進本機佇列，送出後等 Mac 在回條頻道確認才刪；沒網路或 Mac 沒回，20 分鐘後重送（Mac 會去重）。
const HUB = (() => {
  const NT = "https://ntfy.sh/", QK = "hub_q", MAXB = 2700; // 一則訊息的明文上限（加密＋base64 後要在 4096 以內）
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  // 首頁不清掉網址上的鑰匙：iPad「加入主畫面」的圖示和 Safari 分開存資料，網址帶著鑰匙，圖示打開時才會自己記住
  const takeKey = () => {
    const m = location.hash.match(/[#&]k=([\w-]+)/);
    if (!m) return false;
    put("hub_k", m[1] === "off" ? null : m[1]);
    if (typeof DATA !== "undefined") history.replaceState(null, "", location.pathname + location.search);
    return true;
  };
  takeKey();
  addEventListener("hashchange", () => { if (takeKey()) location.reload(); }); // 頁面已開著時點連結只會換 # 後面，不會重新載入
  const KEY = get("hub_k"), ON = !!(KEY && window.crypto && crypto.subtle && window.fetch);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const sha = (s) => crypto.subtle.digest("SHA-256", enc.encode(s));
  const b64u = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  let ch = null;
  const chan = () => ch || (ch = Promise.all([sha("in:" + KEY), sha("st:" + KEY), sha("enc:" + KEY)]).then(async ([a, b, c]) =>
    ({ tin: "sh-" + hex(a).slice(0, 24), tst: "sh-" + hex(b).slice(0, 24), k: await crypto.subtle.importKey("raw", c, "AES-GCM", false, ["encrypt", "decrypt"]) })));
  async function seal(k, u8) {
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, u8));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  const open = async (k, u8) => new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, k, u8.slice(12)));
  const DEV = get("hub_dev") || (() => { const d = Math.random().toString(36).slice(2, 10); put("hub_dev", d); return d; })();
  const queue = () => { try { return JSON.parse(get(QK) || "[]"); } catch (e) { return []; } };
  const save = (a) => put(QK, JSON.stringify(a.slice(-500)));
  const pg = () => (typeof DATA !== "undefined" && DATA && DATA.id) || "home";

  // 記一筆作答；key 相同又還沒送出的舊筆會被取代（打字題只送最後的內容）。題目代號用 id2，id 是這筆事件自己的
  let lastTs = 0;
  function log(t, d = {}, wait = 2500) {
    if (!ON) return;
    const a = queue(), ts = lastTs = Math.max(Date.now(), lastTs + 1); // 同一毫秒連點兩下也要分得出先後
    if (d.key) { const i = a.findIndex((e) => !e.s && e.key === d.key); if (i >= 0) a.splice(i, 1); }
    a.push({ ...d, id: ts.toString(36) + Math.random().toString(36).slice(2, 6), ts, pg: pg(), t, s: 0 });
    save(a); soon(wait); ui();
  }
  let tm = null, busy = false;
  const soon = (ms) => { clearTimeout(tm); tm = setTimeout(flush, ms); };
  async function flush(keepalive) {
    if (!ON || busy || navigator.onLine === false) return;
    busy = true;
    try {
      const c = await chan(), now = Date.now(), todo = queue().filter((e) => !e.s || now - e.s > 20 * 60e3);
      while (todo.length) {
        const batch = []; let size = 0;
        while (todo.length) {
          const { s, key, ...ev } = todo[0], j = JSON.stringify(ev), n = enc.encode(j).length;
          if (batch.length && size + n > MAXB) break;
          batch.push({ id: ev.id, j }); size += n; todo.shift();
        }
        const body = b64u(await seal(c.k, enc.encode(`{"v":1,"dev":"${DEV}","ev":[${batch.map((x) => x.j).join(",")}]}`)));
        const r = await fetch(NT + c.tin, { method: "POST", body, keepalive: !!keepalive });
        if (!r.ok) break;
        const ids = new Set(batch.map((x) => x.id)), t = Date.now(), cur = queue();
        cur.forEach((e) => { if (ids.has(e.id)) e.s = t; }); save(cur);
      }

  }
  // 整個檔案（作答報告圖）加密後當 ntfy 附件上傳；成功回 true
  async function sendFile(u8, meta) {

 cv.width=W;cv.height=H+P;x.fillStyle="#FFFCF6";x.fillRect(0,0,W,cv.height);x.strokeStyle=INK;x.lineWidth=6;x.strokeRect(14,14,W-28,cv.height-28);let y=P;
 lay.forEach(({it,ls})=>{x.font=`${it.b?"bold ":""}${it.sz}px ${FN}`;x.fillStyle=it.c;ls.forEach(l=>{y+=it.sz*1.45;x.fillText(l,P,y-it.sz*0.35)});y+=6});
 if(imgs.length){y+=50;x.font=`34px ${FN}`;x.fillStyle=HD;x.fillText("✍️ 手寫",P,y-10)}
 imgs.forEach(o=>{x.font=`26px ${FN}`;x.fillStyle="#7C7571";y+=40;x.fillText(wrapTxt(x,o.q,W-2*P)[0],P,y);y+=20;const h=o.im.height*((W-2*P)/o.im.width);x.drawImage(o.im,P,y,W-2*P,h);x.lineWidth=3;x.strokeStyle=INK;x.strokeRect(P,y,W-2*P,h);y+=h+20});
 const url=cv.toDataURL("image/jpeg",0.82),img=$("subimg");img.src=url;img.style.display="block";
 const blob=await (await fetch(url)).blob(),file=new File([blob],DATA.id+"-作答報告.jpg",{type:"image/jpeg"});
 if(HUB.on){fb.innerHTML="⏳ 正在傳給爸爸…";if(await HUB.sendFile(new Uint8Array(await blob.arrayBuffer()),{t:"report",star:S.star})){fb.innerHTML="✅ 已經自動傳給爸爸了！謝謝你，這週辛苦了 🎉";star(3);boom();return}}
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:DATA.title,text:DATA.title+" 作答報告"});fb.innerHTML="✅ 傳好了！謝謝你，這週辛苦了 🎉";star(3);boom();return}catch(e){}}
 fb.innerHTML=`📷 報告圖做好了（在下面）。<b>長按圖片</b>就能存起來或分享到 LINE 給爸爸。<br><a href="${url}" download="${DATA.id}-作答報告.jpg">或按這裡下載圖片</a>`}
// ---------- print ----------
function printQuiz(){const Q=qList();return `<div class="card"><h2>⚔️ 練習題</h2>${Q.map((q,i)=>`${LV[q.tag]&&(i===0||Q[i-1].tag!==q.tag)?`<h3>${LV[q.tag][0]} ${LV[q.tag][1]}：${LV[q.tag][2]}</h3>`:""}<div class="qbox"><div class="stem">${i+1}. ${q.tag&&!LV[q.tag]?`<span class="tag">${q.tag}</span>`:""}${q.s}</div>${q.src?srcBox(q)+`<div class="stem">${q.s2||""}</div>`:""}<div>${q.o.map((o,j)=>`(${L[j]}) ${o}`).join("　")}</div></div>`).join("")}</div>`}
function printKey(){return `<div class="card"><h2>✅ 解答與解析</h2>${qList().map((q,i)=>`<p><b>${i+1}. (${L[q.a]})</b> ${q.e}</p>`).join("")}${(DATA.order||[]).map(g=>`<p><b>${g.t}</b>：${g.items.join(" → ")}</p>`).join("")}</div>`}
